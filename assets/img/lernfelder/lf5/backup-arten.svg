<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="ba-title ba-desc">
  <title id="ba-title">Vollsicherung, inkrementelle und differenzielle Sicherung</title>
  <desc id="ba-desc">Sonntag wird jeweils voll gesichert, Donnerstag früh fällt das System aus. Bei täglicher Vollsicherung wird jeden Tag alles gesichert; zur Wiederherstellung genügt die Sicherung von Mittwoch, der Speicherbedarf ist am höchsten. Bei inkrementeller Sicherung werden Montag, Dienstag und Mittwoch nur die Änderungen seit der jeweils letzten Sicherung gespeichert; zur Wiederherstellung braucht man Sonntag, Montag, Dienstag und Mittwoch. Bei differenzieller Sicherung wird jeden Tag alles gesichert, was sich seit der letzten Vollsicherung geändert hat, die Sicherungen wachsen; zur Wiederherstellung braucht man Sonntag und Mittwoch.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .day { font-weight: 700; font-size: 12px; text-anchor: middle; }
      .h { font-weight: 700; font-size: 12.5px; }
      .full { fill: #0d6efd; }
      .inc { fill: #fd7e14; }
      .dif { fill: #6f42c1; }
      .need { stroke: #198754; stroke-width: 3; fill: none; }
      .s { font-size: 11.5px; fill: #343a40; }
      .r { font-size: 11.5px; fill: #146c43; font-weight: 600; }
      .x { fill: #b02a37; font-weight: 700; font-size: 12px; text-anchor: middle; }
    </style>
  </defs>
  <text class="day" x="200" y="20">So</text><text class="day" x="280" y="20">Mo</text><text class="day" x="360" y="20">Di</text><text class="day" x="440" y="20">Mi</text>
  <text class="x" x="515" y="20">Do ✕</text>
  <line x1="490" y1="28" x2="490" y2="210" stroke="#b02a37" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text class="s" x="496" y="222" style="fill:#b02a37">Ausfall</text>

  <!-- Voll -->
  <text class="h" x="10" y="54">täglich voll</text>
  <rect class="full" x="170" y="40" width="60" height="22" rx="3"/><rect class="full" x="250" y="40" width="60" height="22" rx="3"/>
  <rect class="full" x="330" y="40" width="60" height="22" rx="3"/><rect class="full" x="410" y="40" width="60" height="22" rx="3"/>
  <rect class="need" x="407" y="37" width="66" height="28" rx="4"/>
  <text class="r" x="530" y="48">zurück: nur Mi</text><text class="s" x="530" y="64">viel Speicher, lange Laufzeit</text>

  <!-- inkrementell -->
  <text class="h" x="10" y="114">inkrementell</text>
  <text class="s" x="10" y="130" style="font-size:10.5px">seit letzter Sicherung</text>
  <rect class="full" x="170" y="100" width="60" height="22" rx="3"/>
  <rect class="inc" x="270" y="100" width="20" height="22" rx="3"/><rect class="inc" x="350" y="100" width="20" height="22" rx="3"/><rect class="inc" x="430" y="100" width="20" height="22" rx="3"/>
  <rect class="need" x="167" y="97" width="66" height="28" rx="4"/><rect class="need" x="267" y="97" width="26" height="28" rx="4"/>
  <rect class="need" x="347" y="97" width="26" height="28" rx="4"/><rect class="need" x="427" y="97" width="26" height="28" rx="4"/>
  <text class="r" x="530" y="108">zurück: So + Mo + Di + Mi</text><text class="s" x="530" y="124">wenig Speicher, Zurückspielen</text><text class="s" x="530" y="138">dauert länger</text>

  <!-- differenziell -->
  <text class="h" x="10" y="174">differenziell</text>
  <text class="s" x="10" y="190" style="font-size:10.5px">seit letzter Vollsicherung</text>
  <rect class="full" x="170" y="160" width="60" height="22" rx="3"/>
  <rect class="dif" x="270" y="160" width="20" height="22" rx="3"/><rect class="dif" x="340" y="160" width="40" height="22" rx="3"/><rect class="dif" x="410" y="160" width="60" height="22" rx="3"/>
  <rect class="need" x="167" y="157" width="66" height="28" rx="4"/><rect class="need" x="407" y="157" width="66" height="28" rx="4"/>
  <text class="r" x="530" y="168">zurück: So + Mi</text><text class="s" x="530" y="184">Sicherungen wachsen täglich</text>

  <rect class="full" x="10" y="226" width="14" height="12" rx="2"/><text class="s" x="30" y="236">voll</text>
  <rect class="inc" x="80" y="226" width="14" height="12" rx="2"/><text class="s" x="100" y="236">inkrementell</text>
  <rect class="dif" x="190" y="226" width="14" height="12" rx="2"/><text class="s" x="210" y="236">differenziell</text>
  <rect class="need" x="300" y="226" width="14" height="12" rx="2"/><text class="s" x="320" y="236">zum Wiederherstellen nötig</text>
</svg>
