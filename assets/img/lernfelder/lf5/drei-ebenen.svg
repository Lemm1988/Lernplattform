<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="de-title de-desc">
  <title id="de-title">Drei-Ebenen-Architektur nach ANSI/SPARC</title>
  <desc id="de-desc">Oben die externe Ebene mit verschiedenen Sichten für Anwendungen: Webshop, Lager-App und Buchhaltung sehen jeweils nur die Daten, die sie brauchen. In der Mitte die konzeptionelle Ebene mit dem gesamten logischen Schema aller Tabellen, Beziehungen und Regeln. Unten die interne Ebene mit der physischen Speicherung in Dateien, Indizes und Seiten auf dem Datenträger. Zwischen extern und konzeptionell besteht logische Datenunabhängigkeit, zwischen konzeptionell und intern physische Datenunabhängigkeit: Änderungen auf einer Ebene erfordern keine Änderungen auf der darüberliegenden.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .ext { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .kon { fill: #d1e7dd; stroke: #198754; stroke-width: 1.4; }
      .int { fill: #fff3cd; stroke: #f0ad4e; stroke-width: 1.4; }
      .t { font-weight: 700; font-size: 13px; text-anchor: start; }
      .s { font-size: 11.5px; fill: #343a40; }
      .lab { font-size: 11.5px; fill: #6f42c1; font-weight: 600; text-anchor: start; }
      .ln { stroke: #6c757d; stroke-width: 1.3; }
    </style>
  </defs>
  <!-- extern -->
  <text class="t" x="10" y="22">Externe Ebene</text><text class="s" x="10" y="38" style="text-anchor:start">Sichten der Anwendungen</text>
  <rect class="ext" x="190" y="10" width="150" height="44" rx="8"/><text class="s" x="265" y="30" style="font-weight:600">Webshop</text><text class="s" x="265" y="46">Artikel, Preise</text>
  <rect class="ext" x="356" y="10" width="150" height="44" rx="8"/><text class="s" x="431" y="30" style="font-weight:600">Lager-App</text><text class="s" x="431" y="46">Artikel, Bestand</text>
  <rect class="ext" x="522" y="10" width="150" height="44" rx="8"/><text class="s" x="597" y="30" style="font-weight:600">Buchhaltung</text><text class="s" x="597" y="46">Rechnungen, Kunden</text>
  <line class="ln" x1="265" y1="54" x2="380" y2="96"/><line class="ln" x1="431" y1="54" x2="431" y2="96"/><line class="ln" x1="597" y1="54" x2="482" y2="96"/>
  <text class="lab" x="560" y="86">logische Datenunabhängigkeit</text>

  <!-- konzeptionell -->
  <text class="t" x="10" y="122">Konzeptionelle Ebene</text><text class="s" x="10" y="138" style="text-anchor:start">logisches Gesamtschema</text>
  <rect class="kon" x="190" y="96" width="482" height="54" rx="8"/>
  <text class="s" x="431" y="118" style="font-weight:600">alle Tabellen, Spalten, Datentypen, Schlüssel, Beziehungen, Regeln</text>
  <text class="s" x="431" y="136">Kunde · Artikel · Bestellung · Position · Rechnung …</text>
  <line class="ln" x1="431" y1="150" x2="431" y2="192"/>
  <text class="lab" x="440" y="176">physische Datenunabhängigkeit</text>

  <!-- intern -->
  <text class="t" x="10" y="218">Interne Ebene</text><text class="s" x="10" y="234" style="text-anchor:start">physische Speicherung</text>
  <rect class="int" x="190" y="192" width="482" height="54" rx="8"/>
  <text class="s" x="431" y="214" style="font-weight:600">Dateien, Seiten, Indizes (B-Bäume), Speicherorte auf dem Datenträger</text>
  <text class="s" x="431" y="232">nur das DBMS arbeitet hier – Anwendungen sehen davon nichts</text>
</svg>
