<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="kz-title kz-desc">
  <title id="kz-title">Konjunkturzyklus</title>
  <desc id="kz-desc">Die wirtschaftliche Aktivität schwankt wellenförmig um einen langfristig steigenden Trend. Phasen: Aufschwung mit steigender Produktion, sinkender Arbeitslosigkeit und mehr Investitionen; Hochkonjunktur oder Boom mit ausgelasteten Kapazitäten, Fachkräftemangel und steigenden Preisen; Abschwung, bei zwei Quartalen mit sinkender Wirtschaftsleistung spricht man von Rezession, Aufträge und Investitionen gehen zurück, die Arbeitslosigkeit steigt; Tiefstand oder Depression mit niedriger Auslastung, hoher Arbeitslosigkeit und niedriger Inflation. Danach beginnt ein neuer Aufschwung.</desc>
  <defs></defs>
