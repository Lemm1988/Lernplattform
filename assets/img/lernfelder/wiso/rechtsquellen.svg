<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="rq-title rq-desc">
  <title id="rq-title">Rangfolge der Rechtsquellen im Arbeitsrecht</title>
  <desc id="rq-desc">Pyramide mit sieben Ebenen von oben nach unten: EU-Recht und Grundgesetz, Gesetze wie BGB, Berufsbildungsgesetz, Kündigungsschutzgesetz, Arbeitszeitgesetz, Bundesurlaubsgesetz und Mindestlohngesetz, Rechtsverordnungen, Tarifvertrag zwischen Gewerkschaft und Arbeitgeber oder Arbeitgeberverband, Betriebsvereinbarung zwischen Arbeitgeber und Betriebsrat, Arbeitsvertrag, Weisungsrecht des Arbeitgebers. Rangprinzip: Die höhere Ebene geht vor. Günstigkeitsprinzip: Eine niedrigere Ebene darf für die Beschäftigten günstiger sein. Beispiel Urlaub bei einer Fünftagewoche: Gesetz 20 Tage, Tarifvertrag 30 Tage, Arbeitsvertrag 28 Tage – es gelten 30 Tage.</desc>
  <defs><marker id="rq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
    .h { font-weight: 700; font-size: 12px; text-anchor: middle; }
    .s { font-size: 10.5px; fill: #343a40; text-anchor: middle; }
    .l { font-size: 11px; fill: #343a40; }
  </style>
  <polygon points="155,14 345,14 366,51 134,51" fill="#343a40" stroke="#fff" stroke-width="2"/>
  <text class="h" x="250" y="30" style="fill:#fff;font-size:11.5px">EU-Recht und Grundgesetz</text><text class="s" x="250" y="44" style="fill:#fff;font-size:10px">z. B. Koalitionsfreiheit Art. 9 GG</text>
  <polygon points="134,54 366,54 387,91 113,91" fill="#495057" stroke="#fff" stroke-width="2"/>
  <text class="h" x="250" y="70" style="fill:#fff;font-size:11.5px">Gesetze</text><text class="s" x="250" y="84" style="fill:#fff;font-size:10px">BGB, BBiG, KSchG, ArbZG, BUrlG, MiLoG</text>
  <polygon points="113,94 387,94 408,131 92,131" fill="#6c757d" stroke="#fff" stroke-width="2"/>
  <text class="h" x="250" y="110" style="fill:#fff;font-size:11.5px">Rechtsverordnungen</text><text class="s" x="250" y="124" style="fill:#fff;font-size:10px">z. B. Mindestlohnanpassung</text>
  <polygon points="92,134 408,134 429,171 71,171" fill="#cfe2ff" stroke="#fff" stroke-width="2"/>
  <text class="h" x="250" y="150" style="fill:#212529;font-size:11.5px">Tarifvertrag</text><text class="s" x="250" y="164" style="fill:#212529;font-size:10px">Gewerkschaft + Arbeitgeber(verband)</text>
  <polygon points="71,174 429,174 450,211 50,211" fill="#d1e7dd" stroke="#fff" stroke-width="2"/>
  <text class="h" x="250" y="190" style="fill:#212529;font-size:11.5px">Betriebsvereinbarung</text><text class="s" x="250" y="204" style="fill:#212529;font-size:10px">Arbeitgeber + Betriebsrat</text>
  <polygon points="50,214 450,214 471,251 29,251" fill="#fff3cd" stroke="#fff" stroke-width="2"/>
  <text class="h" x="250" y="230" style="fill:#212529;font-size:11.5px">Arbeitsvertrag</text><text class="s" x="250" y="244" style="fill:#212529;font-size:10px">Arbeitgeber + Beschäftigte</text>
  <polygon points="29,254 471,254 492,291 8,291" fill="#f8f9fa" stroke="#fff" stroke-width="2"/>
  <text class="h" x="250" y="270" style="fill:#212529;font-size:11.5px">Weisungsrecht</text><text class="s" x="250" y="284" style="fill:#212529;font-size:10px">Arbeitgeber konkretisiert die Arbeit</text>
  <path d="M500,24 V290" stroke="#495057" stroke-width="2" marker-end="url(#rq-a)"/>
  <text class="l" x="512" y="40" style="font-weight:700">Rangprinzip</text>
  <text class="l" x="512" y="56">Die höhere Ebene geht vor;</text><text class="l" x="512" y="71">untere Ebenen dürfen ihr</text><text class="l" x="512" y="86">nicht widersprechen.</text>
  <text class="l" x="512" y="122" style="font-weight:700;fill:#198754">Günstigkeitsprinzip</text>
  <text class="l" x="512" y="138">Abweichen ist erlaubt, wenn</text><text class="l" x="512" y="153">es für die Beschäftigten</text><text class="l" x="512" y="168">günstiger ist.</text>
  <rect x="508" y="190" width="200" height="98" rx="8" fill="#f8f9fa" stroke="#ced4da"/>
  <text class="l" x="518" y="208" style="font-weight:700">Beispiel Urlaub (5-Tage-Woche)</text>
  <text class="l" x="518" y="226">Gesetz (BUrlG): 20 Tage</text><text class="l" x="518" y="242">Tarifvertrag: 30 Tage</text><text class="l" x="518" y="258">Arbeitsvertrag: 28 Tage</text>
  <text class="l" x="518" y="278" style="font-weight:700;fill:#198754">→ es gelten 30 Tage</text>
</svg>
