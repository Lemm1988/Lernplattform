<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="bn-title bn-desc">
  <title id="bn-title">Vom Brutto zum Netto: Beispielabrechnung 2026</title>
  <desc id="bn-desc">Wasserfalldiagramm. Bruttogehalt 3.200 Euro. Davon werden abgezogen: Lohnsteuer 370 Euro, angenommen laut Lohnsteuertabelle, Kirchensteuer 9 Prozent der Lohnsteuer, also 33,30 Euro, Krankenversicherung 8,75 Prozent, also 280 Euro, Pflegeversicherung für Kinderlose 2,4 Prozent, also 76,80 Euro, Rentenversicherung 9,3 Prozent, also 297,60 Euro, Arbeitslosenversicherung 1,3 Prozent, also 41,60 Euro. Es bleibt ein Nettogehalt von 2.100,70 Euro. Steuern zusammen 403,30 Euro, Sozialversicherung zusammen 696 Euro.</desc>
