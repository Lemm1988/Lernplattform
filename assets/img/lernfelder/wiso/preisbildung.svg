<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="pb-title pb-desc">
  <title id="pb-title">Preisbildung auf dem Markt: Angebot und Nachfrage</title>
  <desc id="pb-desc">Liniendiagramm mit der Menge auf der x-Achse von 0 bis 120 Stück und dem Preis auf der y-Achse von 0 bis 60 Euro. Die Nachfragekurve fällt von 60 Euro bei Menge 0 auf 0 Euro bei Menge 120: Je billiger, desto mehr wird gekauft. Die Angebotskurve steigt von 10 Euro bei Menge 0 auf 50 Euro bei Menge 120: Je teurer, desto mehr wird angeboten. Sie schneiden sich im Gleichgewicht bei 30 Euro und 60 Stück. Bei 40 Euro werden 90 Stück angeboten, aber nur 40 nachgefragt: Angebotsüberhang von 50, der Preis sinkt. Bei 20 Euro werden 80 nachgefragt und nur 30 angeboten: Nachfrageüberhang von 50, der Preis steigt.</desc>
  <defs></defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
    .h { font-weight: 700; font-size: 12px; text-anchor: middle; }
    .s { font-size: 10.5px; fill: #343a40; text-anchor: middle; }
    .l { font-size: 11px; fill: #343a40; }
    .ax { font-size: 10.5px; fill: #495057; }
    .g { stroke: #e9ecef; stroke-width: 1; }
  </style>
  <line class="g" x1="80.0" y1="30" x2="80.0" y2="260"/><text class="ax" x="80.0" y="276" text-anchor="middle">0</text>
  <line class="g" x1="153.3" y1="30" x2="153.3" y2="260"/><text class="ax" x="153.3" y="276" text-anchor="middle">20</text>
  <line class="g" x1="226.7" y1="30" x2="226.7" y2="260"/><text class="ax" x="226.7" y="276" text-anchor="middle">40</text>
  <line class="g" x1="300.0" y1="30" x2="300.0" y2="260"/><text class="ax" x="300.0" y="276" text-anchor="middle">60</text>
  <line class="g" x1="373.3" y1="30" x2="373.3" y2="260"/><text class="ax" x="373.3" y="276" text-anchor="middle">80</text>
  <line class="g" x1="446.7" y1="30" x2="446.7" y2="260"/><text class="ax" x="446.7" y="276" text-anchor="middle">100</text>
  <line class="g" x1="520.0" y1="30" x2="520.0" y2="260"/><text class="ax" x="520.0" y="276" text-anchor="middle">120</text>
  <line class="g" x1="80" y1="260.0" x2="520" y2="260.0"/><text class="ax" x="72" y="263.5" text-anchor="end">0 €</text>
  <line class="g" x1="80" y1="221.7" x2="520" y2="221.7"/><text class="ax" x="72" y="225.2" text-anchor="end">10 €</text>
  <line class="g" x1="80" y1="183.3" x2="520" y2="183.3"/><text class="ax" x="72" y="186.8" text-anchor="end">20 €</text>
  <line class="g" x1="80" y1="145.0" x2="520" y2="145.0"/><text class="ax" x="72" y="148.5" text-anchor="end">30 €</text>
  <line class="g" x1="80" y1="106.7" x2="520" y2="106.7"/><text class="ax" x="72" y="110.2" text-anchor="end">40 €</text>
  <line class="g" x1="80" y1="68.3" x2="520" y2="68.3"/><text class="ax" x="72" y="71.8" text-anchor="end">50 €</text>
  <line class="g" x1="80" y1="30.0" x2="520" y2="30.0"/><text class="ax" x="72" y="33.5" text-anchor="end">60 €</text>
  <line x1="80" y1="260" x2="520" y2="260" stroke="#495057" stroke-width="1.2"/><line x1="80" y1="30" x2="80" y2="260" stroke="#495057" stroke-width="1.2"/>
  <text class="ax" x="300.0" y="294" text-anchor="middle">Menge in Stück</text>
  <text class="ax" x="22" y="145.0" text-anchor="middle" transform="rotate(-90 22 145.0)">Preis</text>
  <line x1="226.7" y1="106.7" x2="410.0" y2="106.7" stroke="#adb5bd" stroke-width="6" stroke-linecap="round"/>
  <text class="l" x="318.3" y="96.7" text-anchor="middle">Angebotsüberhang 50 → Preis sinkt</text>
  <line x1="190.0" y1="183.3" x2="373.3" y2="183.3" stroke="#adb5bd" stroke-width="6" stroke-linecap="round"/>
  <text class="l" x="281.7" y="203.3" text-anchor="middle">Nachfrageüberhang 50 → Preis steigt</text>
  <line x1="80.0" y1="30.0" x2="520.0" y2="260.0" stroke="#2a78d6" stroke-width="2.4"/>
  <line x1="80.0" y1="221.7" x2="520.0" y2="68.3" stroke="#eb6834" stroke-width="2.4"/>
  <line x1="300.0" y1="145.0" x2="300.0" y2="177.3" stroke="#495057" stroke-dasharray="4 3"/><line x1="300.0" y1="209.3" x2="300.0" y2="260" stroke="#495057" stroke-dasharray="4 3"/><line x1="80" y1="145.0" x2="300.0" y2="145.0" stroke="#495057" stroke-dasharray="4 3"/>
  <circle cx="300.0" cy="145.0" r="6" fill="#212529" stroke="#fff" stroke-width="2"/>
  <text class="l" x="312.0" y="149.0" style="font-weight:700">Gleichgewicht: 30 €, 60 Stück</text>
  <text class="l" x="528.0" y="264.0" style="fill:#1f5fb0;font-weight:700">Nachfrage</text>
  <text class="l" x="528.0" y="72.3" style="fill:#c4511a;font-weight:700">Angebot</text>
  <rect x="560" y="80" width="150" height="130" rx="8" fill="#f8f9fa" stroke="#ced4da"/>
  <line x1="572" y1="100" x2="596" y2="100" stroke="#2a78d6" stroke-width="2.4"/><text class="l" x="602" y="104">Nachfrage</text>
  <text class="l" x="572" y="122">je billiger, desto mehr</text><text class="l" x="572" y="136">wird gekauft</text>
  <line x1="572" y1="160" x2="596" y2="160" stroke="#eb6834" stroke-width="2.4"/><text class="l" x="602" y="164">Angebot</text>
  <text class="l" x="572" y="182">je teurer, desto mehr</text><text class="l" x="572" y="196">wird angeboten</text>
</svg>
