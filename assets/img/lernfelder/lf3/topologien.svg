  <text class="h" x="72" y="22">Bus</text><text class="s" x="72" y="176">eine gemeinsame Leitung;</text><text class="s" x="72" y="191">Kabelbruch: alles weg</text>
  <text class="h" x="216" y="22">Ring</text><text class="s" x="216" y="176">Daten laufen im Kreis;</text><text class="s" x="216" y="191">historisch (Token Ring)</text>
  <text class="h" x="360" y="22">Stern</text><text class="s" x="360" y="176">zentraler Switch;</text><text class="s" x="360" y="191">heute Standard im LAN</text>
  <text class="h" x="504" y="22">Baum</text><text class="s" x="504" y="176">Sterne über Ebenen;</text><text class="s" x="504" y="191">typisch im Firmennetz</text>
  <text class="h" x="648" y="22">Vermascht</text><text class="s" x="648" y="176">viele Wege, ausfallsicher;</text><text class="s" x="648" y="191">Backbone, Internet</text>
  <text class="s" x="360" y="228" style="font-size:11px">Physische Topologie = wie die Kabel liegen; logische Topologie = wie die Daten fließen.</text>
</svg>
