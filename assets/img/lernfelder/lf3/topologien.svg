<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="tp-title tp-desc">
  <title id="tp-title">Netzwerk-Topologien</title>
  <desc id="tp-desc">Fünf Topologien. Bus: alle Geräte an einer gemeinsamen Leitung; ein Kabelbruch legt alles lahm, historisch. Ring: jedes Gerät mit zwei Nachbarn verbunden, Daten laufen im Kreis. Stern: alle Geräte an einem zentralen Switch, heute Standard im LAN; fällt der Switch aus, ist das Segment weg. Erweiterter Stern oder Baum: mehrere Sterne über Ebenen verbunden, typisch für Firmennetze. Vermascht: viele Wege zwischen den Knoten, sehr ausfallsicher, aber aufwendig, etwa im Internet-Backbone.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .ln { stroke: #495057; stroke-width: 2; fill: none; }
      .nd { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.5; }
      .hub { fill: #343a40; }
      .h { font-weight: 700; font-size: 12.5px; text-anchor: middle; }
      .s { font-size: 10.5px; fill: #343a40; text-anchor: middle; }
    </style>
  </defs>
  <line class="ln" x1="16" y1="90" x2="128" y2="90"/>
