<line class="ln" x1="360" y1="90" x2="404.0" y2="90.0"/><line class="ln" x1="360" y1="90" x2="382.0" y2="128.1"/><line class="ln" x1="360" y1="90" x2="338.0" y2="128.1"/><line class="ln" x1="360" y1="90" x2="316.0" y2="90.0"/><line class="ln" x1="360" y1="90" x2="338.0" y2="51.9"/><line class="ln" x1="360" y1="90" x2="382.0" y2="51.9"/><rect class="hub" x="348" y="78" width="24" height="24" rx="4"/><circle class="nd" cx="404.0" cy="90.0" r="8"/><circle class="nd" cx="382.0" cy="128.1" r="8"/><circle class="nd" cx="338.0" cy="128.1" r="8"/><circle class="nd" cx="316.0" cy="90.0" r="8"/><circle class="nd" cx="338.0" cy="51.9" r="8"/><circle class="nd" cx="382.0" cy="51.9" r="8"/>
