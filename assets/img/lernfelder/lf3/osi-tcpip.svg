<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-labelledby="ot-title ot-desc">
  <title id="ot-title">OSI-Modell und TCP/IP-Modell</title>
  <desc id="ot-desc">Links das OSI-Referenzmodell mit sieben Schichten, von oben: 7 Anwendung, 6 Darstellung, 5 Sitzung (Dateneinheit jeweils Daten), 4 Transport (Segment), 3 Vermittlung (Paket), 2 Sicherung (Frame), 1 Bitübertragung (Bits). Rechts das TCP/IP-Modell mit vier Schichten: Anwendung entspricht OSI 5 bis 7 mit Protokollen wie HTTP, DNS, SMTP, IMAP, SSH und DHCP. Transport entspricht OSI 4 mit TCP und UDP. Internet entspricht OSI 3 mit IPv4, IPv6 und ICMP. Netzzugang entspricht OSI 1 und 2 mit Ethernet und WLAN.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .n { font-weight: 800; font-size: 13px; text-anchor: middle; }
      .h { font-weight: 700; font-size: 12px; }
      .e { font-size: 10.5px; fill: #495057; }
      .p { font-size: 11px; font-style: italic; fill: #343a40; text-anchor: middle; }
      .th { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .03em; }
      .s { font-size: 11px; fill: #343a40; }
    </style>
  </defs>
  <text class="th" x="20" y="28">OSI-MODELL</text><text class="th" x="268" y="28">PDU</text><text class="th" x="370" y="28">TCP/IP-MODELL</text><text class="th" x="540" y="28">PROTOKOLLE</text>
  <rect x="20" y="40" width="300" height="36" fill="#e7f1ff" stroke="#fff" stroke-width="2"/><text class="n" x="38" y="63">7</text><text class="h" x="60" y="57">Anwendung</text><text class="e" x="60" y="70">Application</text><text class="p" x="282" y="63">Daten</text>
  <rect x="20" y="76" width="300" height="36" fill="#e7f1ff" stroke="#fff" stroke-width="2"/><text class="n" x="38" y="99">6</text><text class="h" x="60" y="93">Darstellung</text><text class="e" x="60" y="106">Presentation</text><text class="p" x="282" y="99">Daten</text>
  <rect x="20" y="112" width="300" height="36" fill="#e7f1ff" stroke="#fff" stroke-width="2"/><text class="n" x="38" y="135">5</text><text class="h" x="60" y="129">Sitzung</text><text class="e" x="60" y="142">Session</text><text class="p" x="282" y="135">Daten</text>
  <rect x="370" y="40" width="150" height="108" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.5" rx="4"/><text class="h c" x="445" y="98.0">Anwendung</text>
  <line x1="320" y1="94.0" x2="370" y2="94.0" stroke="#0d6efd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="s" x="540" y="90.0">HTTP(S), DNS, SMTP,</text><text class="s" x="540" y="106.0">IMAP, SSH, DHCP</text>
  <rect x="20" y="148" width="300" height="36" fill="#d1e7dd" stroke="#fff" stroke-width="2"/><text class="n" x="38" y="171">4</text><text class="h" x="60" y="165">Transport</text><text class="e" x="60" y="178">Transport</text><text class="p" x="282" y="171">Segment</text>
  <rect x="370" y="148" width="150" height="36" fill="#d1e7dd" stroke="#198754" stroke-width="1.5" rx="4"/><text class="h c" x="445" y="170.0">Transport</text>
  <line x1="320" y1="166.0" x2="370" y2="166.0" stroke="#198754" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="s" x="540" y="170.0">TCP, UDP</text>
  <rect x="20" y="184" width="300" height="36" fill="#fff3cd" stroke="#fff" stroke-width="2"/><text class="n" x="38" y="207">3</text><text class="h" x="60" y="201">Vermittlung</text><text class="e" x="60" y="214">Network</text><text class="p" x="282" y="207">Paket</text>
  <rect x="370" y="184" width="150" height="36" fill="#fff3cd" stroke="#b98900" stroke-width="1.5" rx="4"/><text class="h c" x="445" y="206.0">Internet</text>
  <line x1="320" y1="202.0" x2="370" y2="202.0" stroke="#b98900" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="s" x="540" y="206.0">IPv4, IPv6, ICMP</text>
  <rect x="20" y="220" width="300" height="36" fill="#ffe5d0" stroke="#fff" stroke-width="2"/><text class="n" x="38" y="243">2</text><text class="h" x="60" y="237">Sicherung</text><text class="e" x="60" y="250">Data Link</text><text class="p" x="282" y="243">Frame</text>
  <rect x="20" y="256" width="300" height="36" fill="#ffe5d0" stroke="#fff" stroke-width="2"/><text class="n" x="38" y="279">1</text><text class="h" x="60" y="273">Bitübertragung</text><text class="e" x="60" y="286">Physical</text><text class="p" x="282" y="279">Bits</text>
  <rect x="370" y="220" width="150" height="72" fill="#ffe5d0" stroke="#fd7e14" stroke-width="1.5" rx="4"/><text class="h c" x="445" y="260.0">Netzzugang</text>
  <line x1="320" y1="256.0" x2="370" y2="256.0" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="s" x="540" y="260.0">Ethernet, WLAN (802.11)</text>
  <text class="s" x="20" y="314">Merksatz von 7 nach 1: <tspan font-weight="700">A</tspan>lle <tspan font-weight="700">D</tspan>eutschen <tspan font-weight="700">S</tspan>tudenten <tspan font-weight="700">T</tspan>rinken <tspan font-weight="700">V</tspan>erschiedene <tspan font-weight="700">S</tspan>orten <tspan font-weight="700">B</tspan>ier</text>
  <text class="s" x="20" y="332">Schichten 1–4 heißen transportorientiert, 5–7 anwendungsorientiert.</text>
</svg>
