<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="bn-title bn-desc">
  <title id="bn-title">Netzplan eines kleinen Büros</title>
  <desc id="bn-desc">Der Internetanschluss kommt über Glasfaser zum Glasfaser-Modem, dem ONT. Dahinter sitzt ein Router mit Firewall, der NAT und DHCP übernimmt. Der Router hängt an einem verwalteten 24-Port-Switch mit Power over Ethernet. An den Switch angeschlossen sind zwölf Arbeitsplatz-PCs, zwei Drucker, zwei WLAN-Access-Points, die per PoE mit Strom versorgt werden, ein NAS als zentraler Dateispeicher und IP-Telefone, ebenfalls mit PoE. Switch, Router, Patchpanel und eine USV stehen in einem 19-Zoll-Netzwerkschrank.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .net { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.4; }
      .dev { fill: #343a40; }
      .dt { fill: #fff; font-weight: 700; font-size: 11px; text-anchor: middle; }
      .ds { fill: #ced4da; font-size: 9.5px; text-anchor: middle; }
      .end { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .et { font-weight: 700; font-size: 11px; text-anchor: middle; }
      .es { font-size: 10px; fill: #343a40; text-anchor: middle; }
      .rack { fill: none; stroke: #6c757d; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .lw { stroke: #fd7e14; stroke-width: 2.4; }
      .tp { stroke: #0d6efd; stroke-width: 1.8; }
      .s { font-size: 10.5px; fill: #343a40; }
    </style>
  </defs>
  <ellipse class="net" cx="60" cy="70" rx="48" ry="24"/><text class="c" x="60" y="75" style="font-weight:700;font-size:12px">Internet</text>
  <line class="lw" x1="108" y1="70" x2="140" y2="70"/>
  <rect class="rack" x="130" y="14" width="420" height="114" rx="8"/><text class="s" x="140" y="30">19-Zoll-Netzwerkschrank</text>
  <rect class="dev" x="140" y="48" width="80" height="44" rx="6"/><text class="dt" x="180" y="68">ONT</text><text class="ds" x="180" y="82">Glasfaser-Modem</text>
  <rect class="dev" x="240" y="48" width="96" height="44" rx="6"/><text class="dt" x="288" y="68">Router</text><text class="ds" x="288" y="82">Firewall, NAT, DHCP</text>
  <rect class="dev" x="356" y="48" width="180" height="44" rx="6"/><text class="dt" x="446" y="68">Switch, 24 Port</text><text class="ds" x="446" y="82">verwaltet, PoE+</text>
  <line class="tp" x1="220" y1="70" x2="240" y2="70"/><line class="tp" x1="336" y1="70" x2="356" y2="70"/>
  <rect x="356" y="100" width="88" height="20" rx="3" fill="#e9ecef" stroke="#6c757d"/><text class="c" x="400" y="114" style="font-size:9.5px">Patchpanel</text>
  <rect x="452" y="100" width="84" height="20" rx="3" fill="#e9ecef" stroke="#6c757d"/><text class="c" x="494" y="114" style="font-size:9.5px">USV</text>

  <line class="tp" x1="390" y1="128" x2="80" y2="190"/><line class="tp" x1="420" y1="128" x2="225" y2="190"/>
  <line class="tp" x1="450" y1="128" x2="370" y2="190"/><line class="tp" x1="480" y1="128" x2="515" y2="190"/>
  <line class="tp" x1="510" y1="128" x2="650" y2="190"/>
  <rect class="end" x="20" y="190" width="120" height="50" rx="6"/><text class="et" x="80" y="210">12 PCs</text><text class="es" x="80" y="226">Arbeitsplätze</text>
  <rect class="end" x="165" y="190" width="120" height="50" rx="6"/><text class="et" x="225" y="210">2 Drucker</text><text class="es" x="225" y="226">feste IP oder Reservierung</text>
  <rect class="end" x="310" y="190" width="120" height="50" rx="6"/><text class="et" x="370" y="210">2 Access Points</text><text class="es" x="370" y="226">Strom per PoE+</text>
  <rect class="end" x="455" y="190" width="120" height="50" rx="6"/><text class="et" x="515" y="210">NAS</text><text class="es" x="515" y="226">zentrale Ablage</text>
  <rect class="end" x="590" y="190" width="120" height="50" rx="6"/><text class="et" x="650" y="210">IP-Telefone</text><text class="es" x="650" y="226">Strom per PoE</text>

  <line class="lw" x1="580" y1="40" x2="608" y2="40"/><text class="s" x="614" y="44">Glasfaser</text>
  <line class="tp" x1="580" y1="60" x2="608" y2="60"/><text class="s" x="614" y="64">Twisted Pair</text>
  <text class="s" x="20" y="272">Endgeräte stecken an Datendosen; die fest verlegten Kabel enden im Patchpanel, kurze Patchkabel verbinden zum Switch.</text>
  <text class="s" x="20" y="290">Höheneinheit im Schrank: 1 HE = 1,75 Zoll = 44,45 mm.</text>
</svg>
