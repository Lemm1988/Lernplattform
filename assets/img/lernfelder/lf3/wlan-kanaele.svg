<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="wk2-title wk2-desc">
  <title id="wk2-title">WLAN-Kanäle im 2,4-GHz-Band</title>
  <desc id="wk2-desc">Im 2,4-GHz-Band liegen in Europa 13 Kanäle im Abstand von 5 MHz, die Mittenfrequenzen reichen von 2412 MHz (Kanal 1) bis 2472 MHz (Kanal 13). Ein Kanal ist etwa 20 MHz breit, deshalb überlappen benachbarte Kanäle. Überlappungsfrei sind zum Beispiel die Kanäle 1, 6 und 11; sie sind farbig hervorgehoben. Access Points in Reichweite zueinander sollten nicht überlappende Kanäle nutzen.</desc>
