<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="ad-title ad-desc">
  <title id="ad-title">Arbeitsgruppe und Domäne</title>
  <desc id="ad-desc">Links eine Arbeitsgruppe: Drei PCs haben jeweils eine eigene lokale Benutzerliste. Wer auf allen arbeiten will, braucht auf jedem PC ein eigenes Konto; Passwörter und Rechte werden an jedem Gerät einzeln gepflegt. Rechts eine Domäne: Ein Domänencontroller mit Active Directory hält alle Benutzer, Gruppen, Computer und Gruppenrichtlinien zentral. Die PCs sind Mitglied der Domäne; bei der Anmeldung prüft der Domänencontroller das Passwort. Ein Konto gilt an allen PCs, Freigaben und Druckern.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .pc { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .dc { fill: #343a40; }
      .dct { fill: #fff; font-weight: 700; font-size: 12px; text-anchor: middle; }
      .dcs { fill: #ced4da; font-size: 10px; text-anchor: middle; }
      .db { fill: #fff8e1; stroke: #b98900; stroke-width: 1.2; }
      .ln { stroke: #495057; stroke-width: 1.6; }
      .h { font-weight: 700; font-size: 13px; }
      .t { font-weight: 700; font-size: 11px; text-anchor: middle; }
      .u { font-size: 10px; fill: #343a40; text-anchor: middle; }
      .s { font-size: 11px; fill: #343a40; }
      .sep { stroke: #dee2e6; stroke-width: 1.2; }
    </style>
  </defs>
  <text class="h" x="20" y="24">Arbeitsgruppe</text>
  <rect class="pc" x="20" y="40" width="96" height="96" rx="6"/><text class="t" x="68" y="58">PC 1</text>
  <rect class="db" x="30" y="66" width="76" height="60" rx="3"/><text class="u" x="68" y="82">anna</text><text class="u" x="68" y="96">ben</text><text class="u" x="68" y="110">admin</text>
  <rect class="pc" x="128" y="40" width="96" height="96" rx="6"/><text class="t" x="176" y="58">PC 2</text>
  <rect class="db" x="138" y="66" width="76" height="60" rx="3"/><text class="u" x="176" y="82">anna</text><text class="u" x="176" y="96">carla</text><text class="u" x="176" y="110">admin</text>
  <rect class="pc" x="236" y="40" width="96" height="96" rx="6"/><text class="t" x="284" y="58">PC 3</text>
  <rect class="db" x="246" y="66" width="76" height="60" rx="3"/><text class="u" x="284" y="82">ben</text><text class="u" x="284" y="96">carla</text><text class="u" x="284" y="110">admin</text>
  <text class="s" x="20" y="164">jeder PC hat eigene lokale Konten</text>
  <text class="s" x="20" y="182">Passwörter, Rechte, Updates einzeln</text>
  <text class="s" x="20" y="200">sinnvoll nur für sehr wenige Geräte</text>
  <line class="sep" x1="356" y1="20" x2="356" y2="230"/>

  <text class="h" x="380" y="24">Domäne</text>
  <rect class="dc" x="470" y="38" width="170" height="60" rx="8"/><text class="dct" x="555" y="60">Domänencontroller</text><text class="dcs" x="555" y="76">Active Directory: Benutzer,</text><text class="dcs" x="555" y="89">Gruppen, Computer, GPOs</text>
  <rect class="pc" x="380" y="140" width="90" height="40" rx="6"/><text class="t" x="425" y="164">PC 1</text>
  <rect class="pc" x="510" y="140" width="90" height="40" rx="6"/><text class="t" x="555" y="164">PC 2</text>
  <rect class="pc" x="620" y="140" width="90" height="40" rx="6"/><text class="t" x="665" y="164">PC 3</text>
  <line class="ln" x1="425" y1="140" x2="520" y2="98"/><line class="ln" x1="555" y1="140" x2="555" y2="98"/><line class="ln" x1="665" y1="140" x2="590" y2="98"/>
  <text class="s" x="380" y="206">ein Konto gilt überall: PCs, Freigaben, Drucker</text>
  <text class="s" x="380" y="224">Anmeldung prüft der Domänencontroller (Kerberos)</text>
</svg>
