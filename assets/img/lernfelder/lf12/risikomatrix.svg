<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="rm-title rm-desc">
  <title id="rm-title">Risikomatrix des Werkstattprojekts</title>
  <desc id="rm-desc">Matrix mit Eintrittswahrscheinlichkeit gering, mittel, hoch auf der waagrechten Achse und Auswirkung gering, mittel, hoch auf der senkrechten Achse. Felder unten links grün, in der Mitte gelb, oben rechts rot. R1 Werkstattmeister lehnt das System ab: Wahrscheinlichkeit mittel, Auswirkung hoch, rot. R2 Entwickler fällt länger aus: gering, hoch, gelb. R3 Erinnerungsmails landen im Spam: hoch, mittel, rot. R4 Hosting fällt aus: gering, mittel, grün. R5 Kunde ändert Anforderungen: hoch, mittel, rot. Risikowert gleich Wahrscheinlichkeit mal Auswirkung, jeweils 1 bis 3.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .g { fill: #d1e7dd; } .y { fill: #fff3cd; } .r { fill: #f8d7da; }
      .cell { stroke: #fff; stroke-width: 3; }
      .ax { font-size: 12px; fill: #495057; }
      .axh { font-size: 12px; font-weight: 700; }
      .m { fill: #212529; } .mt { fill: #fff; font-size: 11px; font-weight: 700; }
      .val { font-size: 11px; fill: #6c757d; }
      .li { font-size: 11.5px; text-anchor: start; fill: #343a40; }
      .lb { font-size: 11.5px; text-anchor: start; font-weight: 700; }
    </style>
  </defs>
  <!-- Zellen: x 90..330, y 20..230; Spalten 80 breit, Zeilen 70 hoch -->
  <rect class="cell y" x="90" y="20" width="80" height="70"/><rect class="cell r" x="170" y="20" width="80" height="70"/><rect class="cell r" x="250" y="20" width="80" height="70"/>
  <rect class="cell g" x="90" y="90" width="80" height="70"/><rect class="cell y" x="170" y="90" width="80" height="70"/><rect class="cell r" x="250" y="90" width="80" height="70"/>
  <rect class="cell g" x="90" y="160" width="80" height="70"/><rect class="cell g" x="170" y="160" width="80" height="70"/><rect class="cell y" x="250" y="160" width="80" height="70"/>
  <text class="val" x="160" y="36">3</text><text class="val" x="240" y="36">6</text><text class="val" x="320" y="36">9</text>
  <text class="val" x="160" y="106">2</text><text class="val" x="240" y="106">4</text><text class="val" x="320" y="106">6</text>
  <text class="val" x="160" y="176">1</text><text class="val" x="240" y="176">2</text><text class="val" x="320" y="176">3</text>
  <!-- Achsen -->
  <text class="ax" x="130" y="248">gering</text><text class="ax" x="210" y="248">mittel</text><text class="ax" x="290" y="248">hoch</text>
  <text class="axh" x="210" y="270">Eintrittswahrscheinlichkeit</text>
  <text class="ax" x="82" y="59" style="text-anchor:end">hoch</text><text class="ax" x="82" y="129" style="text-anchor:end">mittel</text><text class="ax" x="82" y="199" style="text-anchor:end">gering</text>
  <text class="axh" x="22" y="125" transform="rotate(-90 22 125)">Auswirkung</text>
  <!-- Risiken -->
  <circle class="m" cx="210" cy="56" r="12"/><text class="mt" x="210" y="60">R1</text>
  <circle class="m" cx="130" cy="56" r="12"/><text class="mt" x="130" y="60">R2</text>
  <circle class="m" cx="276" cy="126" r="12"/><text class="mt" x="276" y="130">R3</text>
  <circle class="m" cx="306" cy="140" r="12"/><text class="mt" x="306" y="144">R5</text>
  <circle class="m" cx="130" cy="126" r="12"/><text class="mt" x="130" y="130">R4</text>
  <!-- Liste -->
  <text class="lb" x="370" y="30">Risiko</text><text class="lb" x="640" y="30">Wert</text>
  <text class="li" x="370" y="56">R1 Werkstattmeister lehnt System ab</text><text class="li" x="646" y="56">2 · 3 = 6</text>
  <text class="li" x="370" y="82">R3 Erinnerungsmails landen im Spam</text><text class="li" x="646" y="82">3 · 2 = 6</text>
  <text class="li" x="370" y="108">R5 Kunde ändert Anforderungen</text><text class="li" x="646" y="108">3 · 2 = 6</text>
  <text class="li" x="370" y="134">R2 Entwickler fällt länger aus</text><text class="li" x="646" y="134">1 · 3 = 3</text>
  <text class="li" x="370" y="160">R4 Hosting fällt kurz aus</text><text class="li" x="646" y="160">1 · 2 = 2</text>
  <line x1="370" y1="176" x2="712" y2="176" stroke="#dee2e6"/>
  <text class="li" x="370" y="198">Wert = Wahrscheinlichkeit · Auswirkung (je 1–3)</text>
  <text class="li" x="370" y="220"><tspan font-weight="700" fill="#b02a37">rot</tspan>: Maßnahme sofort planen</text>
  <text class="li" x="370" y="240"><tspan font-weight="700" fill="#997404">gelb</tspan>: beobachten, Notfallplan</text>
  <text class="li" x="370" y="260"><tspan font-weight="700" fill="#146c43">grün</tspan>: bewusst akzeptieren</text>
</svg>
