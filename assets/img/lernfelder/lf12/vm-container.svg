<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="vc-title vc-desc">
  <title id="vc-title">Virtuelle Maschinen und Container im Vergleich</title>
  <desc id="vc-desc">Links virtuelle Maschinen: Auf der Hardware läuft ein Hypervisor, darauf drei virtuelle Maschinen, jede mit eigenem Gastbetriebssystem, Bibliotheken und Anwendung. Rechts Container: Auf Hardware und Host-Betriebssystem läuft eine Container-Engine, darauf drei Container mit Bibliotheken und Anwendung, die sich den Kernel des Host-Betriebssystems teilen. Container sind daher kleiner und starten in Sekunden, virtuelle Maschinen sind stärker voneinander isoliert und können verschiedene Betriebssysteme ausführen.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .h { font-weight: 700; font-size: 13px; }
      .app { fill: #cfe2ff; stroke: #0d6efd; stroke-width: 1.2; }
      .lib { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.2; }
      .os { fill: #fff3cd; stroke: #f0ad4e; stroke-width: 1.2; }
      .hv { fill: #e2d9f3; stroke: #6f42c1; stroke-width: 1.2; }
      .hw { fill: #dee2e6; stroke: #6c757d; stroke-width: 1.2; }
      .t { font-size: 11.5px; }
      .s { font-size: 11px; fill: #495057; }
      .frame { fill: none; stroke: #343a40; stroke-width: 1.2; stroke-dasharray: 4 3; }
    </style>
  </defs>
  <!-- VMs -->
  <text class="h" x="175" y="18">Virtuelle Maschinen</text>
  <g>
    <rect class="frame" x="16" y="28" width="102" height="114" rx="6"/>
    <rect class="app" x="22" y="34" width="90" height="28" rx="3"/><text class="t" x="67" y="52">App A</text>
    <rect class="lib" x="22" y="66" width="90" height="28" rx="3"/><text class="t" x="67" y="84">Bibliotheken</text>
    <rect class="os" x="22" y="98" width="90" height="38" rx="3"/><text class="t" x="67" y="114">Gast-OS</text><text class="s" x="67" y="128">Linux</text>
  </g>
  <g>
    <rect class="frame" x="124" y="28" width="102" height="114" rx="6"/>
    <rect class="app" x="130" y="34" width="90" height="28" rx="3"/><text class="t" x="175" y="52">App B</text>
    <rect class="lib" x="130" y="66" width="90" height="28" rx="3"/><text class="t" x="175" y="84">Bibliotheken</text>
    <rect class="os" x="130" y="98" width="90" height="38" rx="3"/><text class="t" x="175" y="114">Gast-OS</text><text class="s" x="175" y="128">Windows</text>
  </g>
  <g>
    <rect class="frame" x="232" y="28" width="102" height="114" rx="6"/>
    <rect class="app" x="238" y="34" width="90" height="28" rx="3"/><text class="t" x="283" y="52">App C</text>
    <rect class="lib" x="238" y="66" width="90" height="28" rx="3"/><text class="t" x="283" y="84">Bibliotheken</text>
    <rect class="os" x="238" y="98" width="90" height="38" rx="3"/><text class="t" x="283" y="114">Gast-OS</text><text class="s" x="283" y="128">Linux</text>
  </g>
  <rect class="hv" x="16" y="148" width="318" height="30" rx="3"/><text class="t" x="175" y="168">Hypervisor (z. B. Hyper-V, VMware ESXi, KVM)</text>
  <rect class="hw" x="16" y="182" width="318" height="30" rx="3"/><text class="t" x="175" y="202">Hardware</text>
  <text class="s" x="175" y="232">je VM ein ganzes Betriebssystem: GB groß, Start in Minuten</text>

  <!-- Container -->
  <text class="h" x="545" y="18">Container</text>
  <g>
    <rect class="frame" x="386" y="62" width="102" height="66" rx="6"/>
    <rect class="app" x="392" y="68" width="90" height="26" rx="3"/><text class="t" x="437" y="85">App A</text>
    <rect class="lib" x="392" y="98" width="90" height="24" rx="3"/><text class="t" x="437" y="114">Bibliotheken</text>
  </g>
  <g>
    <rect class="frame" x="494" y="62" width="102" height="66" rx="6"/>
    <rect class="app" x="500" y="68" width="90" height="26" rx="3"/><text class="t" x="545" y="85">App B</text>
    <rect class="lib" x="500" y="98" width="90" height="24" rx="3"/><text class="t" x="545" y="114">Bibliotheken</text>
  </g>
  <g>
    <rect class="frame" x="602" y="62" width="102" height="66" rx="6"/>
    <rect class="app" x="608" y="68" width="90" height="26" rx="3"/><text class="t" x="653" y="85">App C</text>
    <rect class="lib" x="608" y="98" width="90" height="24" rx="3"/><text class="t" x="653" y="114">Bibliotheken</text>
  </g>
  <rect class="hv" x="386" y="134" width="318" height="22" rx="3"/><text class="t" x="545" y="150">Container-Engine (z. B. Docker)</text>
  <rect class="os" x="386" y="160" width="318" height="22" rx="3"/><text class="t" x="545" y="176">Host-Betriebssystem (gemeinsamer Kernel)</text>
  <rect class="hw" x="386" y="186" width="318" height="26" rx="3"/><text class="t" x="545" y="204">Hardware</text>
  <text class="s" x="545" y="232">teilen sich den Kernel: MB groß, Start in Sekunden</text>
</svg>
