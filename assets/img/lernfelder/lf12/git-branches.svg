<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="gr-title gr-desc">
  <title id="gr-title">Feature-Branch, Pull Request und Merge</title>
  <desc id="gr-desc">Der Branch main hat die Commits Startseite angelegt und Überschrift geändert. Vom ersten Commit zweigt der Branch feature/erinnerung ab mit dem Commit Erinnerungshinweis. Über einen Pull Request mit Code-Review und automatischen Tests wird der Feature-Branch zurückgeführt; es entsteht ein Merge-Commit auf main. Haben beide Seiten dieselbe Zeile geändert, gibt es einen Konflikt, der von Hand aufgelöst wird. Am Ende wird die Version mit dem Tag v1.0.0 markiert.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .main { stroke: #0d6efd; stroke-width: 3; fill: none; }
      .feat { stroke: #fd7e14; stroke-width: 3; fill: none; }
      .cm { fill: #fff; stroke-width: 3; }
      .s { font-size: 11.5px; fill: #495057; }
      .l { font-size: 12px; font-weight: 700; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
      .pr { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.2; stroke-dasharray: 5 3; }
    </style>
  </defs>
  <text class="l" x="10" y="64" style="fill:#0d6efd">main</text>
  <text class="l" x="10" y="164" style="fill:#fd7e14">feature/erinnerung</text>
  <path class="main" d="M70,60 H620"/>
  <path class="feat" d="M150,60 C190,60 190,160 230,160 H380 C430,160 440,60 480,60"/>
  <circle class="cm" cx="150" cy="60" r="10" stroke="#0d6efd"/><text class="s" x="150" y="36" text-anchor="middle">Startseite angelegt</text>
  <circle class="cm" cx="330" cy="60" r="10" stroke="#0d6efd"/><text class="s" x="330" y="36" text-anchor="middle">Überschrift geändert</text>
  <circle class="cm" cx="300" cy="160" r="10" stroke="#fd7e14"/><text class="s" x="300" y="190" text-anchor="middle">Erinnerungshinweis</text>
  <circle class="cm" cx="480" cy="60" r="12" stroke="#0d6efd" fill="#e7f1ff"/><text class="s" x="480" y="36" text-anchor="middle">Merge-Commit</text>
  <rect class="pr" x="512" y="96" width="176" height="44" rx="6"/>
  <text class="s" x="600" y="114" text-anchor="middle" style="font-weight:600;fill:#212529">Pull Request</text>
  <text class="s" x="600" y="130" text-anchor="middle">Review + Tests (CI)</text>
  <path d="M600,48 h36 l10,12 l-10,12 h-36 z" fill="#d1e7dd" stroke="#198754" stroke-width="1.3"/><text class="m" x="606" y="64">v1.0.0</text>
  <text class="m" x="10" y="212">git switch -c feature/erinnerung · git commit · git push · Pull Request · git merge · git tag v1.0.0</text>
</svg>
