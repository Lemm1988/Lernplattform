<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="lp-title lp-desc">
  <title id="lp-title">Vom Lastenheft zum Pflichtenheft</title>
  <desc id="lp-desc">Der Auftraggeber, hier die Fahrradwerkstatt, schreibt das Lastenheft: Was soll erreicht werden und wofür? Es enthält Ausgangssituation, Ziele, funktionale und nichtfunktionale Anforderungen, Rahmenbedingungen und Abnahmekriterien. Der Auftragnehmer, die Softwarefirma, antwortet mit dem Pflichtenheft: Wie und womit wird es umgesetzt? Es enthält die technische Lösung, Architektur, Oberflächenentwürfe, Datenmodell, Testkonzept und einen Zeitplan. Nach Freigabe durch den Auftraggeber ist das Pflichtenheft Vertragsgrundlage; bei der Abnahme wird gegen das Pflichtenheft geprüft.</desc>
  <defs>
    <marker id="lp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .doc { stroke-width: 1.5; }
      .t { font-weight: 700; font-size: 14px; text-anchor: middle; }
      .q { font-size: 12px; font-style: italic; text-anchor: middle; fill: #495057; }
      .w { font-size: 11.5px; font-weight: 600; text-anchor: middle; }
      .li { font-size: 11.5px; fill: #343a40; }
      .s { font-size: 11.5px; fill: #495057; text-anchor: middle; }
    </style>
  </defs>
  <!-- Lastenheft -->
  <text class="w" x="150" y="18">Auftraggeber (Kunde)</text>
  <path class="doc" d="M40,28 H240 L260,48 V230 H40 Z" fill="#fff8e1" stroke="#f0ad4e"/>
  <path d="M240,28 V48 H260" fill="none" stroke="#f0ad4e" stroke-width="1.5"/>
  <text class="t" x="150" y="56">Lastenheft</text>
  <text class="q" x="150" y="74">Was und wofür?</text>
  <text class="li" x="54" y="102">• Ausgangssituation (Ist)</text>
  <text class="li" x="54" y="122">• Ziele des Projekts</text>
  <text class="li" x="54" y="142">• funktionale Anforderungen</text>
  <text class="li" x="54" y="162">• nichtfunktionale Anforderungen</text>
  <text class="li" x="54" y="182">• Rahmenbedingungen</text>
  <text class="li" x="54" y="202">• Abnahmekriterien</text>

  <path d="M266,129 H446" stroke="#343a40" stroke-width="1.8" marker-end="url(#lp-a)"/>
  <text class="s" x="356" y="118">Grundlage für</text>
  <text class="s" x="356" y="148">Angebot und Lösung</text>

  <!-- Pflichtenheft -->
  <text class="w" x="570" y="18">Auftragnehmer (IT-Firma)</text>
  <path class="doc" d="M460,28 H660 L680,48 V230 H460 Z" fill="#e7f1ff" stroke="#0d6efd"/>
  <path d="M660,28 V48 H680" fill="none" stroke="#0d6efd" stroke-width="1.5"/>
  <text class="t" x="570" y="56">Pflichtenheft</text>
  <text class="q" x="570" y="74">Wie und womit?</text>
  <text class="li" x="474" y="102">• Lösungskonzept, Architektur</text>
  <text class="li" x="474" y="122">• Oberflächenentwürfe</text>
  <text class="li" x="474" y="142">• Datenmodell, Schnittstellen</text>
  <text class="li" x="474" y="162">• Testkonzept</text>
  <text class="li" x="474" y="182">• Zeit- und Ressourcenplan</text>
  <text class="li" x="474" y="202">• Lastenheft-Punkte zugeordnet</text>

  <text class="s" x="360" y="256" style="font-weight:600;fill:#212529">Vom Kunden freigegeben, wird das Pflichtenheft Vertragsgrundlage – die Abnahme prüft dagegen.</text>
</svg>
