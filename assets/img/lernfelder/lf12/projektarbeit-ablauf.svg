<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="pa-title pa-desc">
  <title id="pa-title">Ablauf der betrieblichen Projektarbeit in der Abschlussprüfung Teil 2</title>
  <desc id="pa-desc">Fünf Schritte nacheinander. 1 Projektantrag schreiben und bei der IHK einreichen: Ausgangslage, Ziel, Zeitplan, Präsentationsmittel. 2 Genehmigung durch den Prüfungsausschuss, eventuell mit Auflagen; erst danach beginnt das Projekt. 3 Projekt im Betrieb durchführen, höchstens 80 Stunden, begleitend dokumentieren. 4 Projektdokumentation fristgerecht abgeben. 5 Präsentation und Fachgespräch vor dem Prüfungsausschuss, zusammen höchstens 30 Minuten. Der Prüfungsbereich zählt 50 Prozent der Gesamtnote.</desc>
  <defs>
    <marker id="pa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .st { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .go { fill: #fff3cd; stroke: #f0ad4e; stroke-width: 1.4; }
      .fin { fill: #d1e7dd; stroke: #198754; stroke-width: 1.6; }
      .n { fill: #0d6efd; } .nt { fill: #fff; font-weight: 700; font-size: 11px; }
      .t { font-weight: 700; font-size: 12.5px; }
      .s { font-size: 11px; fill: #495057; }
      .ar { stroke: #343a40; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect class="st" x="8" y="20" width="128" height="120" rx="8"/><circle class="n" cx="22" cy="20" r="10"/><text class="nt" x="22" y="24">1</text>
  <text class="t" x="72" y="46">Projektantrag</text><text class="s" x="72" y="68">Ausgangslage, Ziel,</text><text class="s" x="72" y="83">Zeitplan (≤ 80 h),</text><text class="s" x="72" y="98">Präsentationsmittel</text><text class="s" x="72" y="122" style="font-style:italic">bei der IHK einreichen</text>
  <rect class="go" x="150" y="20" width="128" height="120" rx="8"/><circle class="n" cx="164" cy="20" r="10"/><text class="nt" x="164" y="24">2</text>
  <text class="t" x="214" y="46">Genehmigung</text><text class="s" x="214" y="68">durch den</text><text class="s" x="214" y="83">Prüfungsausschuss,</text><text class="s" x="214" y="98">ggf. mit Auflagen</text><text class="s" x="214" y="122" style="font-style:italic">erst dann starten</text>
  <rect class="st" x="292" y="20" width="128" height="120" rx="8"/><circle class="n" cx="306" cy="20" r="10"/><text class="nt" x="306" y="24">3</text>
  <text class="t" x="356" y="46">Durchführung</text><text class="s" x="356" y="68">im Betrieb,</text><text class="s" x="356" y="83">höchstens 80 Stunden,</text><text class="s" x="356" y="98">Stunden mitschreiben</text><text class="s" x="356" y="122" style="font-style:italic">laufend dokumentieren</text>
  <rect class="st" x="434" y="20" width="128" height="120" rx="8"/><circle class="n" cx="448" cy="20" r="10"/><text class="nt" x="448" y="24">4</text>
  <text class="t" x="498" y="46">Dokumentation</text><text class="s" x="498" y="68">mit praxisbezogenen</text><text class="s" x="498" y="83">Unterlagen, Umfang</text><text class="s" x="498" y="98">nach IHK-Vorgabe</text><text class="s" x="498" y="122" style="font-style:italic">fristgerecht abgeben</text>
  <rect class="fin" x="576" y="20" width="136" height="120" rx="8"/><circle class="n" cx="590" cy="20" r="10"/><text class="nt" x="590" y="24">5</text>
  <text class="t" x="644" y="46">Präsentation +</text><text class="t" x="644" y="62">Fachgespräch</text><text class="s" x="644" y="84">zusammen höchstens</text><text class="s" x="644" y="99">30 Minuten</text><text class="s" x="644" y="122" style="font-style:italic">vor dem Ausschuss</text>
  <path class="ar" d="M136,80 H148" marker-end="url(#pa-a)"/><path class="ar" d="M278,80 H290" marker-end="url(#pa-a)"/>
  <path class="ar" d="M420,80 H432" marker-end="url(#pa-a)"/><path class="ar" d="M562,80 H574" marker-end="url(#pa-a)"/>

  <rect x="8" y="160" width="704" height="50" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text class="t" x="360" y="180">Prüfungsbereich „Planen und Umsetzen eines Softwareprojektes“ = 50 % der Gesamtnote</text>
  <text class="s" x="360" y="198">Bewertet werden Dokumentation sowie Präsentation und Fachgespräch – maßgeblich sind die Vorgaben deiner IHK.</text>
</svg>
