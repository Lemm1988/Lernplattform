<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="md-title md-desc">
  <title id="md-title">Magisches Dreieck des Projektmanagements</title>
  <desc id="md-desc">Ein Dreieck mit den Ecken Leistung (Umfang und Qualität), Zeit und Kosten. Ändert sich eine Größe, ändern sich die anderen mit: Soll mehr geleistet werden, steigen Zeit oder Kosten. Soll es schneller gehen, steigen die Kosten oder der Umfang sinkt. Rechts drei Beispiele aus dem Werkstattprojekt.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .v { fill: #0d6efd; }
      .vt { fill: #fff; font-weight: 700; font-size: 13px; }
      .s { font-size: 11.5px; fill: #495057; }
      .card { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1.2; }
      .ct { font-weight: 700; font-size: 12px; text-anchor: start; }
      .cd { font-size: 11.5px; text-anchor: start; fill: #343a40; }
    </style>
  </defs>
  <path d="M190,36 L50,196 L330,196 Z" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2"/>
  <text class="s" x="190" y="138" style="font-weight:600;fill:#212529">Projekt-</text><text class="s" x="190" y="154" style="font-weight:600;fill:#212529">ziel</text>
  <rect class="v" x="130" y="10" width="120" height="40" rx="20"/><text class="vt" x="190" y="28">Leistung</text><text class="vt" x="190" y="43" style="font-size:10.5px;font-weight:400">Umfang, Qualität</text>
  <rect class="v" x="10" y="182" width="90" height="32" rx="16"/><text class="vt" x="55" y="203">Zeit</text>
  <rect class="v" x="280" y="182" width="90" height="32" rx="16"/><text class="vt" x="325" y="203">Kosten</text>

  <rect class="card" x="400" y="10" width="312" height="62" rx="6"/>
  <text class="ct" x="412" y="30">Kunde will zusätzlich Online-Bezahlung</text>
  <text class="cd" x="412" y="48">Leistung ↑ → mehr Zeit und/oder höhere Kosten</text>
  <text class="cd" x="412" y="64">→ über einen Änderungsantrag klären</text>
  <rect class="card" x="400" y="82" width="312" height="62" rx="6"/>
  <text class="ct" x="412" y="102">Go-live muss zwei Wochen früher sein</text>
  <text class="cd" x="412" y="120">Zeit ↓ → mehr Personal (Kosten ↑) oder</text>
  <text class="cd" x="412" y="136">Umfang kürzen (Should-haves später)</text>
  <rect class="card" x="400" y="154" width="312" height="62" rx="6"/>
  <text class="ct" x="412" y="174">Budget wird um 20 % gekürzt</text>
  <text class="cd" x="412" y="192">Kosten ↓ → weniger Funktionen oder</text>
  <text class="cd" x="412" y="208">mehr Zeit bei kleinerem Team</text>
</svg>
