  <title id="np-title">Netzplan der Online-Terminbuchung</title>
  <desc id="np-desc">Vorgangsknoten-Netzplan mit sieben Vorgängen. A Analyse, Dauer 3 Tage, frühester Anfang 0, frühestes Ende 3, spätester Anfang 0, spätestes Ende 3, Gesamtpuffer 0. B Backend, Dauer 6 Tage, frühester Anfang 3, frühestes Ende 9, spätester Anfang 3, spätestes Ende 9, Gesamtpuffer 0. C Oberfläche, Dauer 5 Tage, frühester Anfang 3, frühestes Ende 8, spätester Anfang 8, spätestes Ende 13, Gesamtpuffer 5. D Kalender, Dauer 4 Tage, frühester Anfang 9, frühestes Ende 13, spätester Anfang 9, spätestes Ende 13, Gesamtpuffer 0. E Erinnerung, Dauer 2 Tage, frühester Anfang 9, frühestes Ende 11, spätester Anfang 11, spätestes Ende 13, Gesamtpuffer 2. F Tests, Dauer 3 Tage, frühester Anfang 13, frühestes Ende 16, spätester Anfang 13, spätestes Ende 16, Gesamtpuffer 0. G Einführung, Dauer 2 Tage, frühester Anfang 16, frühestes Ende 18, spätester Anfang 16, spätestes Ende 18, Gesamtpuffer 0. Projektdauer 18 Tage. Kritischer Pfad: A, B, D, F, G.</desc>
