<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="eh-title eh-desc">
  <title id="eh-title">Exception-Hierarchie in Java</title>
  <desc id="eh-desc">Throwable ist die Oberklasse. Darunter Error für schwere Fehler der JVM wie OutOfMemoryError, die man nicht abfängt, und Exception. Unter Exception liegen geprüfte Exceptions (checked) wie IOException, SQLException und eigene fachliche Exceptions, die mit try-catch behandelt oder mit throws weitergegeben werden müssen, sowie RuntimeException mit ungeprüften Exceptions (unchecked) wie NullPointerException, IllegalArgumentException und ArrayIndexOutOfBoundsException, die meist Programmierfehler anzeigen.</desc>
  <defs>
    <marker id="eh-gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#343a40" stroke-width="1.2"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .c { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 1.4; }
      .err { fill: #f8d7da; stroke: #dc3545; stroke-width: 1.4; }
      .chk { fill: #fff3cd; stroke: #f0ad4e; stroke-width: 1.4; }
      .unc { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .ln { stroke: #343a40; stroke-width: 1.3; fill: none; }
      .note { font-size: 11.5px; fill: #495057; }
      .ex { font-family: ui-monospace, Consolas, monospace; font-size: 11px; fill: #495057; }
    </style>
  </defs>
  <rect class="box" x="300" y="8" width="120" height="30" rx="4"/><text class="c" x="360" y="28">Throwable</text>

  <rect class="err" x="60" y="70" width="140" height="30" rx="4"/><text class="c" x="130" y="90">Error</text>
  <rect class="box" x="440" y="70" width="140" height="30" rx="4"/><text class="c" x="510" y="90">Exception</text>
  <path class="ln" d="M130,70 V54 H510 V70 M360,54 V40" marker-end="url(#eh-gen)"/>

  <text class="note" x="130" y="120">schwere JVM-Fehler –</text>
  <text class="note" x="130" y="136">nicht abfangen</text>
  <text class="ex" x="130" y="158">OutOfMemoryError</text>
  <text class="ex" x="130" y="174">StackOverflowError</text>

  <rect class="chk" x="270" y="138" width="210" height="104" rx="6"/>
  <text x="375" y="158" style="font-weight:700;font-size:13px">geprüft (checked)</text>
  <text class="ex" x="375" y="178">IOException, SQLException,</text>
  <text class="ex" x="375" y="194">eigene fachliche Exceptions</text>
  <text class="note" x="375" y="216">MUSS behandelt (try-catch)</text>
  <text class="note" x="375" y="232">oder mit throws gemeldet werden</text>

  <rect class="unc" x="500" y="122" width="190" height="30" rx="4"/><text class="c" x="595" y="142">RuntimeException</text>
  <rect class="unc" x="500" y="160" width="210" height="82" rx="6"/>
  <text x="605" y="178" style="font-weight:700;font-size:13px">ungeprüft (unchecked)</text>
  <text class="ex" x="605" y="196">NullPointerException,</text>
  <text class="ex" x="605" y="211">IllegalArgumentException, …</text>
  <text class="note" x="605" y="232">meist Programmierfehler</text>

  <path class="ln" d="M375,138 V116 H510 V102" marker-end="url(#eh-gen)"/>
  <path class="ln" d="M595,122 V116 H510"/>
  <path class="ln" d="M595,160 V154" />
</svg>
