<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="de-title de-desc">
  <title id="de-title">Entwurfsprozess einer relationalen Datenbank</title>
  <desc id="de-desc">Fünf Schritte: 1 Anforderungsanalyse mit dem Ergebnis Lastenheft und Datenbedarf. 2 Konzeptioneller Entwurf mit dem Ergebnis ER-Modell. 3 Logischer Entwurf mit dem Ergebnis Relationenmodell aus Tabellen, Schlüsseln und Fremdschlüsseln. 4 Normalisierung bis zur dritten Normalform. 5 Physischer Entwurf mit SQL-DDL, Datentypen und Indizes für ein konkretes Datenbanksystem.</desc>
  <defs>
    <marker id="de-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .s { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.5; }
      .n { fill: #0d6efd; } .nt { fill: #fff; font-weight: 700; font-size: 13px; }
      .t { font-weight: 700; font-size: 13px; }
      .r { font-size: 11.5px; fill: #495057; }
      .flow { stroke: #0d6efd; stroke-width: 2; fill: none; }
      .res { fill: #fff8e1; stroke: #f0ad4e; stroke-width: 1.2; }
    </style>
  </defs>
  <g>
    <rect class="s" x="6" y="20" width="124" height="62" rx="8"/><circle class="n" cx="22" cy="20" r="12"/><text class="nt" x="22" y="25">1</text>
    <text class="t" x="68" y="48">Anforderungs-</text><text class="t" x="68" y="64">analyse</text>
    <rect class="res" x="6" y="98" width="124" height="52" rx="6"/><text class="r" x="68" y="119">Lastenheft,</text><text class="r" x="68" y="135">Datenbedarf</text>
  </g>
  <path class="flow" d="M130,51 H152" marker-end="url(#de-a)"/>
  <g>
    <rect class="s" x="154" y="20" width="124" height="62" rx="8"/><circle class="n" cx="170" cy="20" r="12"/><text class="nt" x="170" y="25">2</text>
    <text class="t" x="216" y="48">konzeptionell</text><text class="r" x="216" y="66">(fachlich)</text>
    <rect class="res" x="154" y="98" width="124" height="52" rx="6"/><text class="r" x="216" y="119">ER-Modell:</text><text class="r" x="216" y="135">Entitäten, Beziehungen</text>
  </g>
  <path class="flow" d="M278,51 H300" marker-end="url(#de-a)"/>
  <g>
    <rect class="s" x="302" y="20" width="124" height="62" rx="8"/><circle class="n" cx="318" cy="20" r="12"/><text class="nt" x="318" y="25">3</text>
    <text class="t" x="364" y="48">logisch</text><text class="r" x="364" y="66">(Datenmodell)</text>
    <rect class="res" x="302" y="98" width="124" height="52" rx="6"/><text class="r" x="364" y="119">Relationenmodell:</text><text class="r" x="364" y="135">Tabellen, PK, FK</text>
  </g>
  <path class="flow" d="M426,51 H448" marker-end="url(#de-a)"/>
  <g>
    <rect class="s" x="450" y="20" width="124" height="62" rx="8"/><circle class="n" cx="466" cy="20" r="12"/><text class="nt" x="466" y="25">4</text>
    <text class="t" x="512" y="48">Normalisierung</text><text class="r" x="512" y="66">(Redundanz weg)</text>
    <rect class="res" x="450" y="98" width="124" height="52" rx="6"/><text class="r" x="512" y="119">Tabellen in</text><text class="r" x="512" y="135">3. Normalform</text>
  </g>
  <path class="flow" d="M574,51 H596" marker-end="url(#de-a)"/>
  <g>
    <rect class="s" x="598" y="20" width="116" height="62" rx="8"/><circle class="n" cx="614" cy="20" r="12"/><text class="nt" x="614" y="25">5</text>
    <text class="t" x="656" y="48">physisch</text><text class="r" x="656" y="66">(DBMS-konkret)</text>
    <rect class="res" x="598" y="98" width="116" height="52" rx="6"/><text class="r" x="656" y="119">SQL-DDL,</text><text class="r" x="656" y="135">Datentypen, Indizes</text>
  </g>
</svg>
