<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img" aria-labelledby="gw-title gw-desc">
  <title id="gw-title">Äquivalenzklassen und Grenzwerte für die Versandkosten</title>
  <desc id="gw-desc">Zahlenstrahl für den Warenwert in Cent mit drei Äquivalenzklassen. Klasse 1, ungültig: Warenwert kleiner 0, erwartet wird eine Exception. Klasse 2, gültig: 0 bis 4999 Cent, Versand kostet 490 Cent. Klasse 3, gültig: ab 5000 Cent, versandkostenfrei. Grenzwerte liegen direkt an den Klassengrenzen: minus 1 und 0 sowie 4999 und 5000. Als Repräsentanten aus der Mitte der Klassen dienen minus 50, 2000 und 8000.</desc>
  <defs>
    <marker id="gw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .t { font-weight: 700; font-size: 13px; }
      .s { font-size: 11.5px; fill: #343a40; }
      .v { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
      .bad { fill: #f8d7da; stroke: #b02a37; stroke-width: 1.2; }
      .ok  { fill: #d1e7dd; stroke: #198754; stroke-width: 1.2; }
      .ok2 { fill: #cfe2ff; stroke: #0d6efd; stroke-width: 1.2; }
      .gw { fill: #fd7e14; stroke: #fff; stroke-width: 1.5; }
      .rep { fill: #6c757d; }
    </style>
  </defs>
  <!-- Klassen -->
  <rect class="bad" x="20" y="10" width="180" height="78" rx="6"/>
  <text class="t" x="110" y="32">ÄK 1: ungültig</text><text class="s" x="110" y="52">Warenwert &lt; 0</text><text class="s" x="110" y="70">→ Exception</text>
  <rect class="ok" x="200" y="10" width="250" height="78" rx="6"/>
  <text class="t" x="325" y="32">ÄK 2: gültig</text><text class="s" x="325" y="52">0 bis 4999 Cent</text><text class="s" x="325" y="70">→ 490 Cent Versand</text>
  <rect class="ok2" x="450" y="10" width="245" height="78" rx="6"/>
  <text class="t" x="572" y="32">ÄK 3: gültig</text><text class="s" x="572" y="52">ab 5000 Cent</text><text class="s" x="572" y="70">→ versandkostenfrei</text>

  <!-- Zahlenstrahl -->
  <path d="M20,112 H706" stroke="#343a40" stroke-width="1.8" marker-end="url(#gw-a)"/>
  <path d="M200,96 V128 M450,96 V128" stroke="#343a40" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Grenzwerte -->
  <circle class="gw" cx="190" cy="112" r="6"/><text class="v" x="186" y="140">-1</text>
  <circle class="gw" cx="210" cy="112" r="6"/><text class="v" x="214" y="140">0</text>
  <circle class="gw" cx="432" cy="112" r="6"/><text class="v" x="426" y="140">4999</text>
  <circle class="gw" cx="468" cy="112" r="6"/><text class="v" x="474" y="140">5000</text>
  <!-- Repräsentanten -->
  <path class="rep" d="M105,106 L111,112 L105,118 L99,112 z"/><text class="v" x="105" y="140" style="fill:#6c757d">-50</text>
  <path class="rep" d="M325,106 L331,112 L325,118 L319,112 z"/><text class="v" x="325" y="140" style="fill:#6c757d">2000</text>
  <path class="rep" d="M580,106 L586,112 L580,118 L574,112 z"/><text class="v" x="580" y="140" style="fill:#6c757d">8000</text>
  <text class="s" x="700" y="140" style="text-anchor:end">Warenwert in Cent</text>

  <!-- Legende -->
  <circle class="gw" cx="28" cy="178" r="6"/><text class="s" x="40" y="182" style="text-anchor:start">Grenzwert: direkt an der Klassengrenze testen</text>
  <path class="rep" d="M346,172 L352,178 L346,184 L340,178 z"/><text class="s" x="360" y="182" style="text-anchor:start">Repräsentant: ein Wert aus der Mitte jeder Klasse</text>
</svg>
