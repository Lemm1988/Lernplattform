<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="ra-title ra-desc">
  <title id="ra-title">Aufbau einer REST-Anfrage und -Antwort</title>
  <desc id="ra-desc">Ein Client, etwa ein Java-Programm oder Browser, schickt eine HTTP-Anfrage an den Server: Zeile 1 enthält Methode POST und Ressource /api/v1/kunden, darunter Header wie Content-Type application/json, danach der Body mit den Kundendaten als JSON. Der Server antwortet mit Statuszeile 201 Created, dem Header Location mit der Adresse der neuen Ressource /api/v1/kunden/2 und einem JSON-Body mit dem angelegten Kunden einschließlich ID. Jede Anfrage enthält alle nötigen Informationen, der Server speichert keinen Sitzungszustand.</desc>
  <defs>
    <marker id="ra-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/></marker>
    <marker id="ra-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198754"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .node { stroke-width: 1.5; }
      .t { font-weight: 700; font-size: 14px; }
      .s { font-size: 11.5px; fill: #495057; }
      .c { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; text-anchor: start; }
      .lab { font-size: 11px; fill: #6c757d; text-anchor: end; font-style: italic; }
      .cap { font-weight: 700; font-size: 12px; text-anchor: start; }
      .req { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .res { fill: #e8f5e9; stroke: #198754; stroke-width: 1.3; }
      .sep { stroke: #adb5bd; stroke-width: 1; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <!-- Client und Server -->
  <rect class="node" x="8" y="70" width="122" height="110" rx="10" fill="#f8f9fa" stroke="#343a40"/>
  <text class="t" x="69" y="112">Client</text>
  <text class="s" x="69" y="132">Java-HttpClient,</text><text class="s" x="69" y="147">Browser, App</text>
  <rect class="node" x="590" y="70" width="122" height="110" rx="10" fill="#f8f9fa" stroke="#343a40"/>
  <text class="t" x="651" y="112">Server</text>
  <text class="s" x="651" y="132">REST-API</text><text class="s" x="651" y="147">zustandslos</text>

  <!-- Anfrage -->
  <path d="M130,90 H150" stroke="#0d6efd" stroke-width="2" fill="none"/>
  <rect class="req" x="150" y="10" width="420" height="104" rx="8"/>
  <text class="cap" x="162" y="30" style="fill:#0d6efd">HTTP-Anfrage (Request)</text>
  <text class="c" x="162" y="52"><tspan font-weight="700">POST</tspan> /api/v1/kunden HTTP/1.1</text><text class="lab" x="560" y="52">Methode + Ressource</text>
  <text class="c" x="162" y="70">Content-Type: application/json</text><text class="lab" x="560" y="70">Header</text>
  <line class="sep" x1="162" y1="79" x2="560" y2="79"/>
  <text class="c" x="162" y="98">{"name": "Kaya", "ort": "Bonn"}</text><text class="lab" x="560" y="98">Body</text>
  <path d="M570,90 H586" stroke="#0d6efd" stroke-width="2" fill="none" marker-end="url(#ra-a)"/>

  <!-- Antwort -->
  <rect class="res" x="150" y="136" width="420" height="104" rx="8"/>
  <text class="cap" x="162" y="156" style="fill:#198754">HTTP-Antwort (Response)</text>
  <text class="c" x="162" y="178">HTTP/1.1 <tspan font-weight="700">201 Created</tspan></text><text class="lab" x="560" y="178">Statuscode</text>
  <text class="c" x="162" y="196">Location: /api/v1/kunden/2</text><text class="lab" x="560" y="196">Header</text>
  <line class="sep" x1="162" y1="205" x2="560" y2="205"/>
  <text class="c" x="162" y="224">{"id": 2, "name": "Kaya", "ort": "Bonn"}</text><text class="lab" x="560" y="224">Body</text>
  <path d="M590,160 H570" stroke="#198754" stroke-width="2" fill="none"/>
  <path d="M150,160 H134" stroke="#198754" stroke-width="2" fill="none" marker-end="url(#ra-b)"/>
</svg>
