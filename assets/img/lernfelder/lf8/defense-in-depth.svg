<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="dd-title dd-desc">
  <title id="dd-title">Mehrere Sicherheitsebenen (Defense in Depth)</title>
  <desc id="dd-desc">Vier ineinanderliegende Schichten schützen die Daten in der Mitte. Außen das Netzwerk mit Firewall, Web Application Firewall und TLS. Darin der Server mit Updates, minimalen Rechten und gesperrten Verzeichnissen. Darin die Anwendung mit Eingabevalidierung, Prepared Statements, Ausgabe-Escaping, CSRF-Schutz, Authentifizierung und Autorisierung. Innen die Daten mit Passwort-Hashes, Verschlüsselung, Backups und Protokollierung. Fällt eine Schicht, hält die nächste den Angriff auf.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .t { font-weight: 700; font-size: 13px; text-anchor: middle; }
      .h { font-weight: 700; font-size: 13.5px; }
      .m { font-size: 12px; fill: #495057; }
    </style>
  </defs>
  <rect x="10" y="10" width="300" height="300" rx="24" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text class="t" x="160" y="32">Netzwerk</text>
  <rect x="40" y="44" width="240" height="236" rx="20" fill="#e8f5e9" stroke="#198754" stroke-width="1.5"/>
  <text class="t" x="160" y="66">Server</text>
  <rect x="70" y="78" width="180" height="172" rx="16" fill="#fff8e1" stroke="#f0ad4e" stroke-width="1.5"/>
  <text class="t" x="160" y="100">Anwendung</text>
  <rect x="100" y="112" width="120" height="108" rx="12" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text class="t" x="160" y="160">Daten</text>
  <text x="160" y="180" style="font-size:22px;text-anchor:middle">🔒</text>

  <rect x="336" y="14" width="14" height="14" rx="3" fill="#e7f1ff" stroke="#0d6efd"/>
  <text class="h" x="358" y="26">Netzwerk</text>
  <text class="m" x="358" y="44">Firewall, Web Application Firewall, nur HTTPS (TLS)</text>

  <rect x="336" y="76" width="14" height="14" rx="3" fill="#e8f5e9" stroke="#198754"/>
  <text class="h" x="358" y="88">Server</text>
  <text class="m" x="358" y="106">Updates, minimale Rechte, keine Fehlerausgabe,</text>
  <text class="m" x="358" y="122">interne Ordner (.git, Logs, Tests) gesperrt</text>

  <rect x="336" y="150" width="14" height="14" rx="3" fill="#fff8e1" stroke="#f0ad4e"/>
  <text class="h" x="358" y="162">Anwendung</text>
  <text class="m" x="358" y="180">Eingaben validieren, Prepared Statements,</text>
  <text class="m" x="358" y="196">Ausgaben escapen, CSRF-Token, Login + Rechte-</text>
  <text class="m" x="358" y="212">prüfung bei jeder Anfrage, sichere Sessions</text>

  <rect x="336" y="240" width="14" height="14" rx="3" fill="#f8d7da" stroke="#dc3545"/>
  <text class="h" x="358" y="252">Daten</text>
  <text class="m" x="358" y="270">Passwörter nur als Hash, Verschlüsselung,</text>
  <text class="m" x="358" y="286">Backups, Protokollierung, Datensparsamkeit</text>
  <text class="m" x="358" y="312" style="font-style:italic">Fällt eine Schicht, hält die nächste noch.</text>
</svg>
