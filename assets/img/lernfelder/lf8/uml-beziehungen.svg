<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="ub-title ub-desc">
  <title id="ub-title">Beziehungen im UML-Klassendiagramm</title>
  <desc id="ub-desc">Sechs Beziehungsarten mit Darstellung und Beispiel. Assoziation: durchgezogene Linie, optional mit Pfeil für die Navigationsrichtung, Beispiel Kunde und Bestellung. Aggregation: hohle Raute am Ganzen, das Teil kann allein existieren, Beispiel Team und Mitarbeiter. Komposition: gefüllte Raute am Ganzen, das Teil existiert nur mit dem Ganzen, Beispiel Bestellung und Bestellposition. Generalisierung: hohle Dreiecksspitze zur Oberklasse, Beispiel Lkw ist ein Fahrzeug. Realisierung: gestrichelte Linie mit hohler Dreiecksspitze zum Interface, Beispiel Rechnung implementiert Zahlungsart. Abhängigkeit: gestrichelte Linie mit offener Pfeilspitze, Beispiel Bestellung benutzt MailService.</desc>
  <defs>
    <marker id="ub-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#343a40" stroke-width="1.5"/></marker>
    <marker id="ub-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#343a40" stroke-width="1.2"/></marker>
    <marker id="ub-dia-o" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#fff" stroke="#343a40" stroke-width="1.2"/></marker>
    <marker id="ub-dia-f" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#343a40" stroke="#343a40" stroke-width="1.2"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .cls { fill: #e7f1ff; stroke: #343a40; stroke-width: 1.3; }
      .cls-t { font-size: 12px; text-anchor: middle; }
      .ln { stroke: #343a40; stroke-width: 1.5; fill: none; }
      .dash { stroke-dasharray: 6 4; }
      .name { font-size: 13.5px; font-weight: 700; }
      .desc { font-size: 12px; fill: #495057; }
      .row { fill: #f8f9fa; }
    </style>
  </defs>

  <!-- Zeile: Name (x=14), Diagramm (x=180..430), Erklärung (x=448) -->
  <rect class="row" x="4" y="4" width="712" height="58" rx="6"/>
  <text class="name" x="14" y="30">Assoziation</text><text class="desc" x="14" y="48">„kennt“</text>
  <rect class="cls" x="180" y="18" width="80" height="30"/><text class="cls-t" x="220" y="37">Kunde</text>
  <rect class="cls" x="350" y="18" width="80" height="30"/><text class="cls-t" x="390" y="37">Bestellung</text>
  <path class="ln" d="M260,33 H348" marker-end="url(#ub-open)"/>
  <text class="desc" x="448" y="30">Linie; Pfeil = Navigationsrichtung</text><text class="desc" x="448" y="48">(Kunde kennt seine Bestellungen)</text>

  <text class="name" x="14" y="94">Aggregation</text><text class="desc" x="14" y="112">„hat“ – lose</text>
  <rect class="cls" x="180" y="82" width="80" height="30"/><text class="cls-t" x="220" y="101">Team</text>
  <rect class="cls" x="350" y="82" width="80" height="30"/><text class="cls-t" x="390" y="101">Mitarbeiter</text>
  <path class="ln" d="M261,97 H350" marker-start="url(#ub-dia-o)"/>
  <text class="desc" x="448" y="94">hohle Raute am Ganzen; das Teil</text><text class="desc" x="448" y="112">existiert auch ohne Team weiter</text>

  <rect class="row" x="4" y="132" width="712" height="58" rx="6"/>
  <text class="name" x="14" y="158">Komposition</text><text class="desc" x="14" y="176">„besteht aus“ – fest</text>
  <rect class="cls" x="180" y="146" width="80" height="30"/><text class="cls-t" x="220" y="165">Bestellung</text>
  <rect class="cls" x="340" y="146" width="90" height="30"/><text class="cls-t" x="385" y="165">Bestellposition</text>
  <path class="ln" d="M261,161 H340" marker-start="url(#ub-dia-f)"/>
  <text class="desc" x="448" y="158">gefüllte Raute am Ganzen; das Teil</text><text class="desc" x="448" y="176">wird mit der Bestellung gelöscht</text>

  <text class="name" x="14" y="222">Generalisierung</text><text class="desc" x="14" y="240">„ist ein“ (Vererbung)</text>
  <rect class="cls" x="180" y="210" width="80" height="30"/><text class="cls-t" x="220" y="229">Lkw</text>
  <rect class="cls" x="350" y="210" width="80" height="30"/><text class="cls-t" x="390" y="229">Fahrzeug</text>
  <path class="ln" d="M260,225 H349" marker-end="url(#ub-tri)"/>
  <text class="desc" x="448" y="222">hohles Dreieck zur Oberklasse</text><text class="desc" x="448" y="240">Java: class Lkw extends Fahrzeug</text>

  <rect class="row" x="4" y="260" width="712" height="58" rx="6"/>
  <text class="name" x="14" y="286">Realisierung</text><text class="desc" x="14" y="304">„implementiert“</text>
  <rect class="cls" x="180" y="274" width="80" height="30"/><text class="cls-t" x="220" y="293">Rechnung</text>
  <rect class="cls" x="340" y="268" width="90" height="42"/><text class="cls-t" x="385" y="284" style="font-size:10.5px">«interface»</text><text class="cls-t" x="385" y="300">Zahlungsart</text>
  <path class="ln dash" d="M260,289 H339" marker-end="url(#ub-tri)"/>
  <text class="desc" x="448" y="286">gestrichelt, hohles Dreieck zum Interface</text><text class="desc" x="448" y="304">Java: implements Zahlungsart</text>

  <text class="name" x="14" y="350">Abhängigkeit</text><text class="desc" x="14" y="368">„benutzt kurz“</text>
  <rect class="cls" x="180" y="338" width="80" height="30"/><text class="cls-t" x="220" y="357">Bestellung</text>
  <rect class="cls" x="350" y="338" width="80" height="30"/><text class="cls-t" x="390" y="357">MailService</text>
  <path class="ln dash" d="M260,353 H348" marker-end="url(#ub-open)"/>
  <text class="desc" x="448" y="350">gestrichelt, offene Spitze; z. B. nur</text><text class="desc" x="448" y="368">als Parameter einer Methode genutzt</text>
</svg>
