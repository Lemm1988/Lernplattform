<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" role="img" aria-labelledby="kf-title kf-desc">
  <title id="kf-title">Kontrollflussgraph und Überdeckungsgrade</title>
  <desc id="kf-desc">Kontrollflussgraph der Methode kostenCent mit drei Entscheidungen. Erste Entscheidung: Warenwert kleiner 0, bei ja wird eine Exception geworfen. Sonst kosten gleich 490. Zweite Entscheidung: Warenwert mindestens 5000, bei ja kosten gleich 0. Dritte Entscheidung: express, bei ja kosten plus 990. Danach return kosten. Rechts die Überdeckungsgrade: C0 Anweisungsüberdeckung braucht 2 Testfälle, minus 1 ohne Express und 6000 mit Express. C1 Zweigüberdeckung braucht 3 Testfälle, zusätzlich 2000 ohne Express. C2 Pfadüberdeckung braucht 5 Testfälle: den Exception-Pfad und alle 4 Kombinationen der beiden anderen Entscheidungen.</desc>
  <defs>
    <marker id="kf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .e { stroke: #343a40; stroke-width: 1.5; fill: none; }
      .d { fill: #fff8e1; stroke: #f0ad4e; stroke-width: 1.5; }
      .b { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.5; }
      .x { fill: #f8d7da; stroke: #b02a37; stroke-width: 1.5; }
      .c { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
      .l { font-size: 11px; fill: #495057; }
      .card { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1.2; }
      .ct { font-weight: 700; font-size: 13px; text-anchor: start; }
      .cs { font-size: 11.5px; text-anchor: start; fill: #343a40; }
      .cm { font-family: ui-monospace, Consolas, monospace; font-size: 11px; text-anchor: start; fill: #0d6efd; }
      .cn { font-weight: 700; font-size: 12px; text-anchor: start; fill: #198754; }
    </style>
  </defs>
  <!-- Start -->
  <circle cx="150" cy="16" r="7" fill="#343a40"/>
  <path class="e" d="M150,23 V32" marker-end="url(#kf-a)"/>
  <!-- D1 -->
  <path class="d" d="M150,34 L212,54 L150,74 L88,54 z"/><text class="c" x="150" y="58">w &lt; 0 ?</text>
  <path class="e" d="M212,54 H248" marker-end="url(#kf-a)"/><text class="l" x="228" y="47">ja</text>
  <rect class="x" x="250" y="41" width="130" height="26" rx="5"/><text class="c" x="315" y="58">Exception werfen</text>
  <path class="e" d="M380,54 H394" marker-end="url(#kf-a)"/>
  <circle cx="404" cy="54" r="8" fill="#fff" stroke="#343a40" stroke-width="1.5"/><circle cx="404" cy="54" r="4.5" fill="#343a40"/>
  <path class="e" d="M150,74 V86" marker-end="url(#kf-a)"/><text class="l" x="160" y="84" style="text-anchor:start">nein</text>
  <!-- B1 -->
  <rect class="b" x="95" y="88" width="110" height="24" rx="5"/><text class="c" x="150" y="104">kosten = 490</text>
  <path class="e" d="M150,112 V124" marker-end="url(#kf-a)"/>
  <!-- D2 -->
  <path class="d" d="M150,126 L212,146 L150,166 L88,146 z"/><text class="c" x="150" y="150">w ≥ 5000 ?</text>
  <path class="e" d="M212,146 H248" marker-end="url(#kf-a)"/><text class="l" x="228" y="139">ja</text>
  <rect class="b" x="250" y="134" width="110" height="24" rx="5"/><text class="c" x="305" y="150">kosten = 0</text>
  <path class="e" d="M305,158 V180 H152" marker-end="url(#kf-a)"/>
  <path class="e" d="M150,166 V192" marker-end="url(#kf-a)"/><text class="l" x="140" y="178" style="text-anchor:end">nein</text>
  <!-- D3 -->
  <path class="d" d="M150,194 L212,214 L150,234 L88,214 z"/><text class="c" x="150" y="218">express ?</text>
  <path class="e" d="M212,214 H248" marker-end="url(#kf-a)"/><text class="l" x="228" y="207">ja</text>
  <rect class="b" x="250" y="202" width="120" height="24" rx="5"/><text class="c" x="310" y="218">kosten += 990</text>
  <path class="e" d="M310,226 V248 H152" marker-end="url(#kf-a)"/>
  <path class="e" d="M150,234 V260" marker-end="url(#kf-a)"/><text class="l" x="140" y="246" style="text-anchor:end">nein</text>
  <!-- Return und Ende -->
  <rect class="b" x="95" y="262" width="110" height="24" rx="5"/><text class="c" x="150" y="278">return kosten</text>
  <path class="e" d="M150,286 V296" marker-end="url(#kf-a)"/>
  <circle cx="150" cy="306" r="8" fill="#fff" stroke="#343a40" stroke-width="1.5"/><circle cx="150" cy="306" r="4.5" fill="#343a40"/>

  <!-- Überdeckungsgrade -->
  <rect class="card" x="432" y="10" width="280" height="88" rx="8"/>
  <text class="ct" x="444" y="31">C0 – Anweisungsüberdeckung</text>
  <text class="cs" x="444" y="50">jede Anweisung mindestens einmal</text>
  <text class="cm" x="444" y="68">(-1, false)  (6000, true)</text>
  <text class="cn" x="444" y="88">→ 2 Testfälle</text>

  <rect class="card" x="432" y="110" width="280" height="88" rx="8"/>
  <text class="ct" x="444" y="131">C1 – Zweigüberdeckung</text>
  <text class="cs" x="444" y="150">jede Kante (ja und nein) mindestens einmal</text>
  <text class="cm" x="444" y="168">C0-Tests + (2000, false)</text>
  <text class="cn" x="444" y="188">→ 3 Testfälle</text>

  <rect class="card" x="432" y="210" width="280" height="88" rx="8"/>
  <text class="ct" x="444" y="231">C2 – Pfadüberdeckung</text>
  <text class="cs" x="444" y="250">jeder mögliche Weg von Start bis Ende</text>
  <text class="cm" x="444" y="268">Exception + 2 × 2 Kombinationen</text>
  <text class="cn" x="444" y="288">→ 5 Testfälle</text>
</svg>
