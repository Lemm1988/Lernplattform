<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="jd-title jd-desc">
  <title id="jd-title">Datenbankzugriff mit JDBC</title>
  <desc id="jd-desc">Die Java-Anwendung nutzt die JDBC-Schnittstelle aus dem Paket java.sql. Ein datenbankspezifischer Treiber, zum Beispiel MySQL Connector/J, übersetzt die Aufrufe für das Datenbanksystem. Ablauf in fünf Schritten: 1 Verbindung öffnen mit DriverManager.getConnection, 2 PreparedStatement mit Platzhaltern vorbereiten, 3 Parameter mit setString oder setInt binden, 4 ausführen mit executeQuery für SELECT oder executeUpdate für INSERT, UPDATE und DELETE, 5 das ResultSet Zeile für Zeile mit next lesen. try-with-resources schließt alles automatisch.</desc>
  <defs>
    <marker id="jd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .layer { stroke-width: 1.5; }
      .t { font-weight: 700; font-size: 13px; }
      .s { font-size: 11.5px; fill: #495057; }
      .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
      .step { fill: #fff; stroke: #0d6efd; stroke-width: 1.3; }
      .num { fill: #0d6efd; } .numt { fill: #fff; font-size: 11px; font-weight: 700; }
      .flow { stroke: #0d6efd; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <!-- Schichten links -->
  <rect class="layer" x="10" y="10" width="190" height="52" rx="8" fill="#e7f1ff" stroke="#0d6efd"/>
  <text class="t" x="105" y="32">Java-Anwendung</text><text class="s" x="105" y="50">(z. B. KundenDao)</text>
  <rect class="layer" x="10" y="74" width="190" height="52" rx="8" fill="#fff8e1" stroke="#f0ad4e"/>
  <text class="t" x="105" y="96">JDBC-API</text><text class="mono" x="105" y="114">java.sql.*</text>
  <rect class="layer" x="10" y="138" width="190" height="52" rx="8" fill="#e8f5e9" stroke="#198754"/>
  <text class="t" x="105" y="160">JDBC-Treiber</text><text class="s" x="105" y="178">MySQL Connector/J, MariaDB …</text>
  <path d="M105,190 V204" stroke="#343a40" stroke-width="1.5"/>
  <ellipse cx="105" cy="212" rx="70" ry="9" fill="#e9ecef" stroke="#343a40" stroke-width="1.3"/>
  <path d="M35,212 V236 A70,9 0 0 0 175,236 V212" fill="#e9ecef" stroke="#343a40" stroke-width="1.3"/>
  <text class="t" x="105" y="236" style="font-size:12px">Datenbank</text>

  <!-- Schritte rechts -->
  <g>
    <rect class="step" x="240" y="10" width="470" height="36" rx="6"/><circle class="num" cx="256" cy="28" r="10"/><text class="numt" x="256" y="32">1</text>
    <text class="mono" x="275" y="25" style="text-anchor:start">Connection con = DriverManager.getConnection(url, user, pw)</text>
    <text class="s" x="275" y="40" style="text-anchor:start">Verbindung öffnen</text>
  </g>
  <g>
    <rect class="step" x="240" y="54" width="470" height="36" rx="6"/><circle class="num" cx="256" cy="72" r="10"/><text class="numt" x="256" y="76">2</text>
    <text class="mono" x="275" y="69" style="text-anchor:start">PreparedStatement ps = con.prepareStatement("… WHERE ort = ?")</text>
    <text class="s" x="275" y="84" style="text-anchor:start">SQL mit Platzhalter vorbereiten</text>
  </g>
  <g>
    <rect class="step" x="240" y="98" width="470" height="36" rx="6"/><circle class="num" cx="256" cy="116" r="10"/><text class="numt" x="256" y="120">3</text>
    <text class="mono" x="275" y="113" style="text-anchor:start">ps.setString(1, ort)</text>
    <text class="s" x="275" y="128" style="text-anchor:start">Wert sicher binden – kein SQL-Injection-Risiko</text>
  </g>
  <g>
    <rect class="step" x="240" y="142" width="470" height="36" rx="6"/><circle class="num" cx="256" cy="160" r="10"/><text class="numt" x="256" y="164">4</text>
    <text class="mono" x="275" y="157" style="text-anchor:start">executeQuery()  bzw.  executeUpdate()</text>
    <text class="s" x="275" y="172" style="text-anchor:start">SELECT → ResultSet · INSERT/UPDATE/DELETE → Anzahl geänderter Zeilen</text>
  </g>
  <g>
    <rect class="step" x="240" y="186" width="470" height="36" rx="6"/><circle class="num" cx="256" cy="204" r="10"/><text class="numt" x="256" y="208">5</text>
    <text class="mono" x="275" y="201" style="text-anchor:start">while (rs.next()) { rs.getString("name") … }</text>
    <text class="s" x="275" y="216" style="text-anchor:start">Ergebnis Zeile für Zeile lesen</text>
  </g>
  <text class="s" x="475" y="242" style="font-style:italic">try-with-resources schließt ResultSet, Statement und Connection automatisch</text>
  <path class="flow" d="M200,36 H236" marker-end="url(#jd-a)"/>
</svg>
