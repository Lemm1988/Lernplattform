<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">DOM-Baum und Ablauf einer Live-Suche</title>
  <desc id="df-desc">Links der DOM-Baum der Suchseite: document, darunter html, darunter head und body. Unter body liegen form mit label und input, ein p mit aria-live für den Status und eine Liste ul mit li-Einträgen. JavaScript greift mit getElementById auf diese Knoten zu und verändert sie. Rechts der Ablauf in fünf Schritten: 1 Nutzer tippt, ein input-Ereignis wird ausgelöst. 2 Das Skript wartet 300 Millisekunden, ob weiter getippt wird. 3 fetch sendet eine Anfrage an suche.php. 4 PHP antwortet mit JSON. 5 Das Skript erzeugt li-Elemente mit textContent und aktualisiert den Status, den der Screenreader vorliest. Die Seite wird dabei nicht neu geladen.</desc>
  <defs>
    <marker id="df-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .k { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .kh { fill: #fff3e0; stroke: #fd7e14; stroke-width: 1.6; }
      .ed { stroke: #adb5bd; stroke-width: 1.4; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
      .ms { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; fill: #6f42c1; }
      .h { font-weight: 700; font-size: 13px; }
      .st { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1.2; }
      .n { fill: #0d6efd; } .nt { fill: #fff; font-weight: 700; font-size: 11px; }
      .t { font-size: 12px; text-anchor: start; }
      .s { font-size: 11px; fill: #495057; text-anchor: start; }
    </style>
  </defs>
  <!-- DOM -->
  <text class="h" x="170" y="18">DOM-Baum</text>
  <line class="ed" x1="170" y1="44" x2="170" y2="60"/>
  <line class="ed" x1="170" y1="78" x2="100" y2="96"/><line class="ed" x1="170" y1="78" x2="240" y2="96"/>
  <line class="ed" x1="240" y1="114" x2="80" y2="140"/><line class="ed" x1="240" y1="114" x2="210" y2="140"/><line class="ed" x1="240" y1="114" x2="300" y2="140"/>
  <line class="ed" x1="80" y1="158" x2="45" y2="186"/><line class="ed" x1="80" y1="158" x2="115" y2="186"/>
  <line class="ed" x1="300" y1="158" x2="270" y2="186"/><line class="ed" x1="300" y1="158" x2="330" y2="186"/>
  <rect class="k" x="125" y="26" width="90" height="18" rx="4"/><text class="m" x="170" y="39">document</text>
  <rect class="k" x="140" y="60" width="60" height="18" rx="4"/><text class="m" x="170" y="73">html</text>
  <rect class="k" x="70" y="96" width="60" height="18" rx="4"/><text class="m" x="100" y="109">head</text>
  <rect class="k" x="210" y="96" width="60" height="18" rx="4"/><text class="m" x="240" y="109">body</text>
  <rect class="k" x="50" y="140" width="60" height="18" rx="4"/><text class="m" x="80" y="153">form</text>
  <rect class="kh" x="168" y="140" width="84" height="18" rx="4"/><text class="m" x="210" y="153">p#status</text>
  <rect class="kh" x="260" y="140" width="80" height="18" rx="4"/><text class="m" x="300" y="153">ul#ergebnis</text>
  <rect class="k" x="15" y="186" width="60" height="18" rx="4"/><text class="m" x="45" y="199">label</text>
  <rect class="kh" x="85" y="186" width="60" height="18" rx="4"/><text class="m" x="115" y="199">input#q</text>
  <rect class="kh" x="245" y="186" width="50" height="18" rx="4"/><text class="m" x="270" y="199">li</text>
  <rect class="kh" x="305" y="186" width="50" height="18" rx="4"/><text class="m" x="330" y="199">li</text>
  <text class="s" x="15" y="236">Orange: Knoten, die das Skript liest oder ändert –</text>
  <text class="s" x="15" y="252">z. B. document.getElementById('ergebnis').</text>
  <text class="s" x="15" y="268">Neue li-Knoten entstehen mit createElement.</text>

  <line x1="380" y1="10" x2="380" y2="280" stroke="#dee2e6"/>

  <!-- Ablauf -->
  <text class="h" x="550" y="18">Live-Suche ohne Neuladen</text>
  <rect class="st" x="396" y="30" width="316" height="40" rx="6"/><circle class="n" cx="410" cy="50" r="9"/><text class="nt" x="410" y="54">1</text>
  <text class="t" x="426" y="47">Nutzer tippt</text><text class="ms" x="426" y="62" style="text-anchor:start">feld.addEventListener('input', …)</text>
  <rect class="st" x="396" y="78" width="316" height="40" rx="6"/><circle class="n" cx="410" cy="98" r="9"/><text class="nt" x="410" y="102">2</text>
  <text class="t" x="426" y="95">300 ms warten, ob weiter getippt wird</text><text class="ms" x="426" y="110" style="text-anchor:start">clearTimeout / setTimeout</text>
  <rect class="st" x="396" y="126" width="316" height="40" rx="6"/><circle class="n" cx="410" cy="146" r="9"/><text class="nt" x="410" y="150">3</text>
  <text class="t" x="426" y="143">Anfrage im Hintergrund</text><text class="ms" x="426" y="158" style="text-anchor:start">await fetch('suche.php?q=' + …)</text>
  <rect class="st" x="396" y="174" width="316" height="40" rx="6"/><circle class="n" cx="410" cy="194" r="9"/><text class="nt" x="410" y="198">4</text>
  <text class="t" x="426" y="191">PHP antwortet mit JSON</text><text class="ms" x="426" y="206" style="text-anchor:start">{"anzahl":3,"treffer":[…]}</text>
  <rect class="st" x="396" y="222" width="316" height="40" rx="6"/><circle class="n" cx="410" cy="242" r="9"/><text class="nt" x="410" y="246">5</text>
  <text class="t" x="426" y="239">DOM aktualisieren, Status vorlesen</text><text class="ms" x="426" y="254" style="text-anchor:start">li.textContent = name</text>
  <path d="M700,70 V76" stroke="#0d6efd" stroke-width="1.6" marker-end="url(#df-a)"/>
  <path d="M700,118 V124" stroke="#0d6efd" stroke-width="1.6" marker-end="url(#df-a)"/>
  <path d="M700,166 V172" stroke="#0d6efd" stroke-width="1.6" marker-end="url(#df-a)"/>
  <path d="M700,214 V220" stroke="#0d6efd" stroke-width="1.6" marker-end="url(#df-a)"/>
</svg>
