<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="se-title se-desc">
  <title id="se-title">Login mit Session und Cookie</title>
  <desc id="se-desc">Ablauf zwischen Browser und Server. 1: Der Browser ruft die Login-Seite auf, der Server antwortet mit Set-Cookie PHPSESSID gleich a1b2, HttpOnly und SameSite Lax; die Session ist noch leer. 2: Der Browser sendet Benutzername und Passwort per POST zusammen mit dem Cookie. Der Server prüft mit password_verify, erzeugt mit session_regenerate_id eine neue ID x9y8, speichert benutzer gleich kaya und antwortet mit Set-Cookie x9y8 und einer Umleitung. 3: Bei jedem weiteren Aufruf schickt der Browser das Cookie x9y8 mit, der Server findet damit die Session-Daten und antwortet mit Hallo kaya. 4: Beim Abmelden löscht der Server die Session und das Cookie. Die Daten liegen auf dem Server, im Browser liegt nur die zufällige ID.</desc>
  <defs>
    <marker id="se-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/></marker>
    <marker id="se-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198754"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .hd { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .ll { stroke: #adb5bd; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .rq { stroke: #0d6efd; stroke-width: 1.6; fill: none; }
      .rs { stroke: #198754; stroke-width: 1.6; fill: none; stroke-dasharray: 6 3; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
      .ms { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; fill: #6f42c1; }
      .n { fill: #0d6efd; } .nt { fill: #fff; font-weight: 700; font-size: 11px; }
      .s { font-size: 11px; fill: #495057; text-anchor: start; }
      .t { font-weight: 700; font-size: 12.5px; }
    </style>
  </defs>
  <rect class="hd" x="30" y="10" width="100" height="30" rx="5"/><text class="t" x="80" y="30">Browser</text>
  <rect class="hd" x="370" y="10" width="100" height="30" rx="5"/><text class="t" x="420" y="30">Server</text>
  <line class="ll" x1="80" y1="40" x2="80" y2="320"/><line class="ll" x1="420" y1="40" x2="420" y2="320"/>

  <!-- 1 -->
  <circle class="n" cx="18" cy="62" r="9"/><text class="nt" x="18" y="66">1</text>
  <path class="rq" d="M80,62 H416" marker-end="url(#se-a)"/><text class="m" x="250" y="56">GET /login.php</text>
  <path class="rs" d="M420,86 H84" marker-end="url(#se-b)"/><text class="ms" x="250" y="80">Set-Cookie: PHPSESSID=a1b2; HttpOnly; SameSite=Lax</text>

  <!-- 2 -->
  <circle class="n" cx="18" cy="122" r="9"/><text class="nt" x="18" y="126">2</text>
  <path class="rq" d="M80,122 H416" marker-end="url(#se-a)"/><text class="m" x="250" y="116">POST /login.php  name, passwort  (Cookie: a1b2)</text>
  <text class="s" x="428" y="134">password_verify() ✓</text>
  <text class="s" x="428" y="148">session_regenerate_id(true)</text>
  <path class="rs" d="M420,166 H84" marker-end="url(#se-b)"/><text class="ms" x="250" y="160">303 → konto.php · Set-Cookie: PHPSESSID=x9y8</text>

  <!-- 3 -->
  <circle class="n" cx="18" cy="206" r="9"/><text class="nt" x="18" y="210">3</text>
  <path class="rq" d="M80,206 H416" marker-end="url(#se-a)"/><text class="m" x="250" y="200">GET /konto.php  (Cookie: x9y8)</text>
  <text class="s" x="428" y="220">$_SESSION['benutzer']</text>
  <path class="rs" d="M420,236 H84" marker-end="url(#se-b)"/><text class="ms" x="250" y="230">200 „Hallo kaya“</text>

  <!-- 4 -->
  <circle class="n" cx="18" cy="276" r="9"/><text class="nt" x="18" y="280">4</text>
  <path class="rq" d="M80,276 H416" marker-end="url(#se-a)"/><text class="m" x="250" y="270">POST /logout.php  (Cookie: x9y8)</text>
  <text class="s" x="428" y="290">session_destroy()</text>
  <path class="rs" d="M420,306 H84" marker-end="url(#se-b)"/><text class="ms" x="250" y="300">Cookie gelöscht · 303 → login.php</text>

  <!-- Speicher -->
  <rect x="570" y="10" width="140" height="160" rx="8" fill="#fff8e1" stroke="#f0ad4e" stroke-width="1.3"/>
  <text class="t" x="640" y="30">Session-Speicher</text><text class="s" x="580" y="46" style="font-size:10.5px">(auf dem Server)</text>
  <line x1="580" y1="56" x2="700" y2="56" stroke="#f0ad4e"/>
  <text class="ms" x="580" y="76" style="text-anchor:start;fill:#212529">x9y8:</text>
  <text class="ms" x="590" y="94" style="text-anchor:start;fill:#212529">benutzer = kaya</text>
  <text class="ms" x="590" y="112" style="text-anchor:start;fill:#212529">aufrufe  = 3</text>
  <text class="s" x="580" y="140">Im Browser liegt nur</text><text class="s" x="580" y="156">die zufällige ID.</text>
  <path d="M640,170 V216 H560" stroke="#f0ad4e" stroke-width="1.3" fill="none" stroke-dasharray="3 3"/>
</svg>
