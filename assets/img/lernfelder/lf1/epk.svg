<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="ep-title ep-desc">
  <title id="ep-title">Ereignisgesteuerte Prozesskette: Kundenanfrage bearbeiten</title>
  <desc id="ep-desc">Die EPK beginnt mit dem Ereignis Kundenanfrage ist eingegangen. Es folgt die Funktion Anfrage prüfen, ausgeführt vom Vertrieb mit dem Informationsobjekt Kundendaten. Danach verzweigt ein XOR-Konnektor: Entweder tritt das Ereignis Anfrage ist umsetzbar ein, dann folgt die Funktion Angebot erstellen und das Ereignis Angebot ist versendet. Oder es tritt das Ereignis Anfrage ist nicht umsetzbar ein, dann folgt die Funktion Absage formulieren und das Ereignis Absage ist versendet. Ereignisse sind Sechsecke, Funktionen abgerundete Rechtecke; Ereignisse und Funktionen wechseln sich ab, die Kette beginnt und endet mit Ereignissen. Nach einem Ereignis darf nicht mit XOR oder ODER verzweigt werden, weil Ereignisse nichts entscheiden.</desc>
  <defs>
    <marker id="ep-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .ev { fill: #f7d6e6; stroke: #a8326e; stroke-width: 1.4; }
      .fn { fill: #d1e7dd; stroke: #198754; stroke-width: 1.4; }
      .org { fill: #fff3cd; stroke: #b98900; stroke-width: 1.3; }
      .inf { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .con { fill: #fff; stroke: #212529; stroke-width: 1.5; }
      .t { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .ar { stroke: #495057; stroke-width: 1.5; marker-end: url(#ep-arr); fill: none; }
      .as { stroke: #6c757d; stroke-width: 1.2; fill: none; }
      .s { font-size: 10.5px; fill: #343a40; }
    </style>
  </defs>
  <polygon class="ev" points="210,14 330,14 346,34 330,54 210,54 194,34"/><text class="t" x="270" y="31">Kundenanfrage ist</text><text class="t" x="270" y="45">eingegangen</text>
  <path class="ar" d="M270,54 V76"/>
  <rect class="fn" x="200" y="80" width="140" height="40" rx="10"/><text class="t" x="270" y="104">Anfrage prüfen</text>
  <line class="as" x1="200" y1="100" x2="150" y2="100"/><ellipse class="org" cx="100" cy="100" rx="50" ry="18"/><text class="t" x="100" y="104">Vertrieb</text>
  <line class="as" x1="340" y1="100" x2="390" y2="100"/><rect class="inf" x="390" y="84" width="96" height="32"/><text class="t" x="438" y="104">Kundendaten</text>
  <path class="ar" d="M270,120 V140"/>
  <circle class="con" cx="270" cy="156" r="16"/><text class="t" x="270" y="160">XOR</text>
  <path class="ar" d="M256,164 L170,196"/><path class="ar" d="M284,164 L370,196"/>
  <polygon class="ev" points="100,200 220,200 236,220 220,240 100,240 84,220"/><text class="t" x="160" y="217">Anfrage ist</text><text class="t" x="160" y="231">umsetzbar</text>
  <polygon class="ev" points="320,200 440,200 456,220 440,240 320,240 304,220"/><text class="t" x="380" y="217">Anfrage ist nicht</text><text class="t" x="380" y="231">umsetzbar</text>
  <path class="ar" d="M160,240 V262"/><path class="ar" d="M380,240 V262"/>
  <rect class="fn" x="90" y="266" width="140" height="40" rx="10"/><text class="t" x="160" y="290">Angebot erstellen</text>
  <rect class="fn" x="310" y="266" width="140" height="40" rx="10"/><text class="t" x="380" y="290">Absage formulieren</text>
  <path class="ar" d="M160,306 V328"/><path class="ar" d="M380,306 V328"/>
  <polygon class="ev" points="100,332 220,332 236,352 220,372 100,372 84,352"/><text class="t" x="160" y="349">Angebot ist</text><text class="t" x="160" y="363">versendet</text>
  <polygon class="ev" points="320,332 440,332 456,352 440,372 320,372 304,352"/><text class="t" x="380" y="349">Absage ist</text><text class="t" x="380" y="363">versendet</text>

  <text class="t" x="520" y="200" style="text-anchor:start">Legende</text>
  <polygon class="ev" points="522,212 562,212 570,224 562,236 522,236 514,224"/><text class="s" x="580" y="228">Ereignis (Zustand)</text>
  <rect class="fn" x="514" y="246" width="56" height="24" rx="8"/><text class="s" x="580" y="262">Funktion (Tätigkeit)</text>
  <ellipse class="org" cx="542" cy="292" rx="28" ry="12"/><text class="s" x="580" y="296">Organisationseinheit</text>
  <rect class="inf" x="514" y="312" width="56" height="22"/><text class="s" x="580" y="327">Informationsobjekt</text>
  <circle class="con" cx="542" cy="356" r="12"/><text class="c" x="542" y="360" style="font-size:9px;font-weight:700">XOR</text><text class="s" x="580" y="360">Konnektor</text>
  <text class="s" x="20" y="402">Regeln: Ereignis und Funktion wechseln sich ab · Start und Ende sind Ereignisse · nach einem Ereignis keine XOR-/ODER-Verzweigung</text>
</svg>
