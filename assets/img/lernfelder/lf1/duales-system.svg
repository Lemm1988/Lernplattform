<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">Das duale Ausbildungssystem</title>
  <desc id="ds-desc">In der Mitte die oder der Auszubildende. Links der Ausbildungsbetrieb: Grundlage ist der Ausbildungsvertrag und der Ausbildungsrahmenplan aus der Ausbildungsverordnung; der Betrieb vermittelt die Praxis. Rechts die Berufsschule oder bei einer Umschulung der Bildungsträger: Grundlage ist der Rahmenlehrplan mit den Lernfeldern; dort wird Theorie vermittelt. Darüber die zuständige Stelle, die Industrie- und Handelskammer: Sie trägt den Vertrag ins Verzeichnis ein, berät, überwacht die Ausbildung und nimmt die Prüfungen ab. Grundlage für alle ist das Berufsbildungsgesetz.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .b { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .s2 { fill: #d1e7dd; stroke: #198754; stroke-width: 1.4; }
      .k { fill: #fff3cd; stroke: #b98900; stroke-width: 1.4; }
      .a { fill: #343a40; }
      .at { fill: #fff; font-weight: 700; font-size: 12.5px; text-anchor: middle; }
      .h { font-weight: 700; font-size: 12.5px; text-anchor: middle; }
      .s { font-size: 11px; fill: #343a40; text-anchor: middle; }
      .ln { stroke: #6c757d; stroke-width: 1.6; }
      .dl { stroke: #b98900; stroke-width: 1.4; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect class="k" x="230" y="14" width="260" height="56" rx="8"/><text class="h" x="360" y="36">IHK (zuständige Stelle)</text><text class="s" x="360" y="54">Vertrag eintragen, beraten, überwachen, prüfen</text>
  <rect class="b" x="20" y="110" width="210" height="96" rx="8"/><text class="h" x="125" y="132">Ausbildungsbetrieb</text>
  <text class="s" x="125" y="152">Ausbildungsvertrag</text><text class="s" x="125" y="168">Ausbildungsrahmenplan</text><text class="s" x="125" y="190" style="font-weight:700">Praxis</text>
  <rect class="a" x="290" y="130" width="140" height="56" rx="8"/><text class="at" x="360" y="154">Auszubildende/r</text><text class="c" x="360" y="172" style="fill:#ced4da;font-size:10.5px">bzw. Umschüler/in</text>
  <rect class="s2" x="490" y="110" width="210" height="96" rx="8"/><text class="h" x="595" y="132">Berufsschule / Bildungsträger</text>
  <text class="s" x="595" y="152">Rahmenlehrplan</text><text class="s" x="595" y="168">mit Lernfeldern</text><text class="s" x="595" y="190" style="font-weight:700">Theorie</text>
  <line class="ln" x1="230" y1="158" x2="290" y2="158"/><line class="ln" x1="430" y1="158" x2="490" y2="158"/>
  <line class="dl" x1="290" y1="70" x2="160" y2="110"/><line class="dl" x1="360" y1="70" x2="360" y2="130"/>
  <text class="s" x="360" y="238" style="font-weight:700">Rechtsgrundlage: Berufsbildungsgesetz (BBiG) und Ausbildungsverordnung für die IT-Berufe</text>
</svg>
