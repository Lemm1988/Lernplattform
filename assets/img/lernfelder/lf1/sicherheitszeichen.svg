<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="sz1-title sz1-desc">
  <title id="sz1-title">Arten von Sicherheitszeichen</title>
  <desc id="sz1-desc">Fünf Arten von Sicherheitszeichen nach Form und Farbe. Verbotszeichen: rund, weißer Grund, roter Rand und roter Querbalken, schwarzes Symbol, etwa Essen und Trinken verboten. Gebotszeichen: rund, blau mit weißem Symbol, etwa Gehörschutz benutzen. Warnzeichen: dreieckig, gelb mit schwarzem Rand und Symbol, etwa Warnung vor elektrischer Spannung. Rettungszeichen: rechteckig oder quadratisch, grün mit weißem Symbol, etwa Notausgang oder Erste Hilfe. Brandschutzzeichen: rechteckig oder quadratisch, rot mit weißem Symbol, etwa Feuerlöscher.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .h { font-weight: 700; font-size: 12px; text-anchor: middle; }
      .s { font-size: 10.5px; fill: #343a40; text-anchor: middle; }
    </style>
  </defs>
  <g transform="translate(72 64)">
    <circle r="38" fill="#fff" stroke="#c8102e" stroke-width="8"/>
    <path d="M-10,-16 v26 M-16,-16 v10 a6,6 0 0 0 12,0 v-10 M8,-16 c6,0 6,12 0,14 v22" stroke="#212529" stroke-width="3" fill="none"/>
    <line x1="-26" y1="-26" x2="26" y2="26" stroke="#c8102e" stroke-width="7"/>
  </g>
  <text class="h" x="72" y="126">Verbot</text><text class="s" x="72" y="144">rund, rot umrandet,</text><text class="s" x="72" y="158">roter Querbalken</text><text class="s" x="72" y="176">z. B. Essen verboten</text>

  <g transform="translate(216 64)">
    <circle r="40" fill="#005387"/>
    <circle cx="0" cy="-4" r="13" fill="none" stroke="#fff" stroke-width="3"/><rect x="-20" y="-10" width="8" height="16" rx="3" fill="#fff"/><rect x="12" y="-10" width="8" height="16" rx="3" fill="#fff"/>
  </g>
  <text class="h" x="216" y="126">Gebot</text><text class="s" x="216" y="144">rund, blau,</text><text class="s" x="216" y="158">weißes Symbol</text><text class="s" x="216" y="176">z. B. Gehörschutz tragen</text>

  <g transform="translate(360 68)">
    <path d="M0,-42 L42,32 L-42,32 Z" fill="#f9a800" stroke="#212529" stroke-width="5" stroke-linejoin="round"/>
    <path d="M4,-16 L-8,6 L2,6 L-4,24 L10,0 L0,0 Z" fill="#212529"/>
  </g>
  <text class="h" x="360" y="126">Warnung</text><text class="s" x="360" y="144">Dreieck, gelb,</text><text class="s" x="360" y="158">schwarzer Rand</text><text class="s" x="360" y="176">z. B. elektrische Spannung</text>

  <g transform="translate(504 64)">
    <rect x="-40" y="-40" width="80" height="80" rx="4" fill="#009a44"/>
    <rect x="-8" y="-26" width="16" height="52" fill="#fff"/><rect x="-26" y="-8" width="52" height="16" fill="#fff"/>
  </g>
  <text class="h" x="504" y="126">Rettung</text><text class="s" x="504" y="144">Rechteck, grün,</text><text class="s" x="504" y="158">weißes Symbol</text><text class="s" x="504" y="176">z. B. Erste Hilfe, Notausgang</text>

  <g transform="translate(648 64)">
    <rect x="-40" y="-40" width="80" height="80" rx="4" fill="#c8102e"/>
    <rect x="-9" y="-16" width="18" height="40" rx="5" fill="#fff"/><rect x="-4" y="-26" width="8" height="10" fill="#fff"/><path d="M4,-22 h12 l4,6" stroke="#fff" stroke-width="3" fill="none"/>
  </g>
  <text class="h" x="648" y="126">Brandschutz</text><text class="s" x="648" y="144">Rechteck, rot,</text><text class="s" x="648" y="158">weißes Symbol</text><text class="s" x="648" y="176">z. B. Feuerlöscher</text>
  <text class="s" x="360" y="202" style="font-size:11px">Form und Farbe verraten die Bedeutung schon, bevor man das Symbol erkennt (ASR A1.3, DIN EN ISO 7010).</text>
</svg>
