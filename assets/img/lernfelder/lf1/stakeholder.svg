<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="sk1-title sk1-desc">
  <title id="sk1-title">Anspruchsgruppen eines Unternehmens</title>
  <desc id="sk1-desc">In der Mitte das Unternehmen. Interne Anspruchsgruppen: Eigentümer wollen Gewinn und Wertsteigerung, Geschäftsleitung will Erfolg und Gestaltungsspielraum, Mitarbeitende wollen sichere Arbeitsplätze, faire Bezahlung und gute Arbeitsbedingungen. Externe Anspruchsgruppen: Kunden wollen gute Qualität zu fairen Preisen, Lieferanten wollen stabile Aufträge und pünktliche Zahlung, Banken wollen Zins und Tilgung, der Staat will Steuern und die Einhaltung von Gesetzen, die Gesellschaft will Umweltschutz und Arbeitsplätze in der Region. Die Interessen können sich widersprechen.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .u { fill: #343a40; }
      .ut { fill: #fff; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .in { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .ex { fill: #fff8e1; stroke: #b98900; stroke-width: 1.3; }
      .h { font-weight: 700; font-size: 11.5px; }
      .s { font-size: 10.5px; fill: #343a40; }
      .ln { stroke: #adb5bd; stroke-width: 1.3; }
      .lab { font-size: 11px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
    </style>
  </defs>
  <line class="ln" x1="360" y1="150" x2="224" y2="49"/><line class="ln" x1="360" y1="150" x2="224" y2="149"/><line class="ln" x1="360" y1="150" x2="224" y2="249"/>
  <line class="ln" x1="360" y1="150" x2="496" y2="40"/><line class="ln" x1="360" y1="150" x2="496" y2="100"/><line class="ln" x1="360" y1="150" x2="496" y2="160"/><line class="ln" x1="360" y1="150" x2="496" y2="220"/><line class="ln" x1="360" y1="150" x2="496" y2="277"/>
  <rect class="u" x="290" y="124" width="140" height="52" rx="10"/><text class="ut" x="360" y="155">Unternehmen</text>
  <text class="lab" x="14" y="16">INTERN</text>
  <rect class="in" x="14" y="26" width="210" height="46" rx="6"/><text class="h" x="24" y="44">Eigentümer</text><text class="s" x="24" y="61">Gewinn, Wertsteigerung</text>
  <rect class="in" x="14" y="126" width="210" height="46" rx="6"/><text class="h" x="24" y="144">Geschäftsleitung</text><text class="s" x="24" y="161">Erfolg, Gestaltungsspielraum</text>
  <rect class="in" x="14" y="226" width="210" height="46" rx="6"/><text class="h" x="24" y="244">Mitarbeitende</text><text class="s" x="24" y="261">sichere Stelle, faire Bezahlung</text>
  <text class="lab" x="496" y="12">EXTERN</text>
  <rect class="ex" x="496" y="18" width="210" height="44" rx="6"/><text class="h" x="506" y="36">Kunden</text><text class="s" x="506" y="52">Qualität, fairer Preis, Service</text>
  <rect class="ex" x="496" y="78" width="210" height="44" rx="6"/><text class="h" x="506" y="96">Lieferanten</text><text class="s" x="506" y="112">Aufträge, pünktliche Zahlung</text>
  <rect class="ex" x="496" y="138" width="210" height="44" rx="6"/><text class="h" x="506" y="156">Banken</text><text class="s" x="506" y="172">Zins und Tilgung, Sicherheit</text>
  <rect class="ex" x="496" y="198" width="210" height="44" rx="6"/><text class="h" x="506" y="216">Staat</text><text class="s" x="506" y="232">Steuern, Einhaltung von Gesetzen</text>
  <rect class="ex" x="496" y="258" width="210" height="38" rx="6"/><text class="h" x="506" y="274">Gesellschaft, Umwelt</text><text class="s" x="506" y="289">Klimaschutz, Arbeitsplätze vor Ort</text>
</svg>
