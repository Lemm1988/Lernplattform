<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="kv-title kv-desc">
  <title id="kv-title">Kumulations- und Verteilungseffekt</title>
  <desc id="kv-desc">Links der Kumulationseffekt: Auf einem Virtualisierungshost laufen zwölf virtuelle Maschinen, jede mit normalem Schutzbedarf für die Verfügbarkeit. Fällt der Host aus, stehen alle zwölf still, deshalb hat der Host einen hohen Schutzbedarf. Rechts der Verteilungseffekt: Das Ticketsystem hat einen hohen Schutzbedarf für die Verfügbarkeit, läuft aber redundant auf zwei Servern hinter einem Lastverteiler. Fällt einer aus, übernimmt der andere, deshalb genügt für jeden einzelnen Server ein normaler Schutzbedarf.</desc>
  <defs>
    <marker id="kv-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .bx { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1.3; }
      .h { font-weight: 700; font-size: 12.5px; }
      .l { font-weight: 700; font-size: 11px; }
      .bt { font-size: 10px; font-weight: 700; text-anchor: middle; }
      .s { font-size: 11px; fill: #343a40; }
      .ln { stroke: #6c757d; stroke-width: 1.5; }
      .ar { stroke: #495057; stroke-width: 1.7; marker-end: url(#kv-arr); fill: none; }
    </style>
  </defs>
  <text class="h" x="20" y="22">Kumulationseffekt: Bedarf steigt</text>
  <rect class="bx" x="20" y="34" width="238" height="128" rx="6"/><text class="l" x="30" y="52">Virtualisierungshost</text>
  <rect x="30" y="62" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="55.0" y="76">VM · A: N</text>
  <rect x="86" y="62" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="111.0" y="76">VM · A: N</text>
  <rect x="142" y="62" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="167.0" y="76">VM · A: N</text>
  <rect x="198" y="62" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="223.0" y="76">VM · A: N</text>
  <rect x="30" y="92" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="55.0" y="106">VM · A: N</text>
  <rect x="86" y="92" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="111.0" y="106">VM · A: N</text>
  <rect x="142" y="92" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="167.0" y="106">VM · A: N</text>
  <rect x="198" y="92" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="223.0" y="106">VM · A: N</text>
  <rect x="30" y="122" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="55.0" y="136">VM · A: N</text>
  <rect x="86" y="122" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="111.0" y="136">VM · A: N</text>
  <rect x="142" y="122" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="167.0" y="136">VM · A: N</text>
  <rect x="198" y="122" width="50" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="223.0" y="136">VM · A: N</text>
  <path class="ar" d="M262,98 H292"/>
  <rect x="296" y="88" width="84" height="20" rx="4" fill="#fff3cd" stroke="#b98900"/><text class="bt" x="338.0" y="102">Host · A: H</text>
  <text class="s" x="20" y="186">12 Anwendungen mit normalem Bedarf – fällt der</text><text class="s" x="20" y="202">Host aus, stehen alle gleichzeitig still.</text>
  <text class="h" x="420" y="22">Verteilungseffekt: Bedarf sinkt</text>
  <rect class="bx" x="470" y="34" width="200" height="40" rx="6"/><text class="l" x="482" y="58">Ticketsystem</text><rect x="590" y="44" width="70" height="20" rx="4" fill="#fff3cd" stroke="#b98900"/><text class="bt" x="625.0" y="58">A: H</text>
  <line class="ln" x1="540" y1="74" x2="480" y2="118"/><line class="ln" x1="600" y1="74" x2="640" y2="118"/>
  <text class="s" x="570" y="100" style="text-anchor:middle">Lastverteiler</text>
  <rect class="bx" x="410" y="118" width="140" height="40" rx="6"/><text class="l" x="420" y="142">Server 1</text><rect x="484" y="128" width="58" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="513.0" y="142">A: N</text>
  <rect class="bx" x="570" y="118" width="140" height="40" rx="6"/><text class="l" x="580" y="142">Server 2</text><rect x="644" y="128" width="58" height="20" rx="4" fill="#d1e7dd" stroke="#198754"/><text class="bt" x="673.0" y="142">A: N</text>
  <text class="s" x="420" y="186">Läuft redundant auf zwei Servern: Fällt einer aus,</text><text class="s" x="420" y="202">übernimmt der andere.</text>
</svg>
