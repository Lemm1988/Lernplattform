<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="ro-title ro-desc">
  <title id="ro-title">Rollen in der Informationssicherheit</title>
  <desc id="ro-desc">Die Geschäftsleitung trägt die Gesamtverantwortung. Ihr berichten direkt der Informationssicherheitsbeauftragte, der das Sicherheitsmanagement steuert und berät, und der Datenschutzbeauftragte, der den Datenschutz überwacht und dabei weisungsfrei ist. Der IT-Betrieb setzt die Maßnahmen um, alle Mitarbeitenden halten die Regeln ein und melden Vorfälle. Außerhalb des Unternehmens: Das BSI veröffentlicht Standards und Warnungen und nimmt Meldungen von Betreibern kritischer Infrastrukturen und NIS-2-Einrichtungen entgegen. Die Datenschutz-Aufsichtsbehörde des Landes erhält Meldungen über Datenpannen, in der Regel innerhalb von 72 Stunden. Bei Straftaten hilft die Polizei über die Zentralen Ansprechstellen Cybercrime.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .gl { fill: #343a40; }
      .glt { fill: #fff; font-weight: 700; font-size: 12.5px; text-anchor: middle; }
      .gls { fill: #ced4da; font-size: 10.5px; text-anchor: middle; }
      .r { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .p { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1.2; }
      .ext { fill: #fff8e1; stroke: #b98900; stroke-width: 1.3; }
      .h { font-weight: 700; font-size: 12px; }
      .s { font-size: 10.5px; fill: #343a40; }
      .ln { stroke: #6c757d; stroke-width: 1.5; fill: none; }
      .dl { stroke: #b98900; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
      .zone { fill: none; stroke: #ced4da; stroke-width: 1.2; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect class="zone" x="10" y="10" width="440" height="280" rx="8"/><text class="s" x="20" y="26" style="font-weight:700">im Unternehmen</text>
  <rect class="gl" x="130" y="36" width="200" height="46" rx="6"/><text class="glt" x="230" y="56">Geschäftsleitung</text><text class="gls" x="230" y="72">Gesamtverantwortung, Budget</text>
  <path class="ln" d="M180,82 V108 M280,82 V108"/>
  <rect class="r" x="30" y="108" width="190" height="56" rx="6"/><text class="h c" x="125" y="128">Informationssicherheits-</text><text class="h c" x="125" y="143">beauftragte/r (ISB)</text><text class="s c" x="125" y="157">steuert das ISMS, berät</text>
  <rect class="r" x="240" y="108" width="190" height="56" rx="6"/><text class="h c" x="335" y="128">Datenschutz-</text><text class="h c" x="335" y="143">beauftragte/r (DSB)</text><text class="s c" x="335" y="157">überwacht, weisungsfrei</text>
  <path class="ln" d="M230,82 V190"/>
  <rect class="p" x="130" y="190" width="200" height="40" rx="6"/><text class="h c" x="230" y="207">IT-Betrieb</text><text class="s c" x="230" y="222">setzt Maßnahmen um</text>
  <path class="ln" d="M230,230 V244"/>
  <rect class="p" x="80" y="244" width="300" height="36" rx="6"/><text class="h c" x="230" y="260">alle Mitarbeitenden</text><text class="s c" x="230" y="274">Regeln einhalten, Vorfälle melden</text>

  <text class="s" x="470" y="26" style="font-weight:700">außerhalb</text>
  <rect class="ext" x="470" y="36" width="240" height="56" rx="6"/><text class="h" x="482" y="55">BSI</text><text class="s" x="482" y="70">Standards, Warnungen, CERT-Bund;</text><text class="s" x="482" y="84">Meldestelle für KRITIS/NIS 2</text>
  <rect class="ext" x="470" y="120" width="240" height="56" rx="6"/><text class="h" x="482" y="139">Datenschutz-Aufsichtsbehörde</text><text class="s" x="482" y="154">des Landes; Meldung von</text><text class="s" x="482" y="168">Datenpannen meist binnen 72 h</text>
  <rect class="ext" x="470" y="204" width="240" height="56" rx="6"/><text class="h" x="482" y="223">Polizei (ZAC)</text><text class="s" x="482" y="238">Zentrale Ansprechstellen</text><text class="s" x="482" y="252">Cybercrime der Länder</text>
  <path class="dl" d="M30,124 H20 V32 H462 V58 H470"/>
  <path class="dl" d="M430,148 H470"/>
</svg>
