<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="au-title au-desc">
  <title id="au-title">Faktoren der Authentifizierung</title>
  <desc id="au-desc">Drei Faktorarten: Wissen, etwa Passwort, PIN oder Sicherheitsfrage. Besitz, etwa Authenticator-App auf dem Smartphone, Hardware-Token oder Smartcard. Sein, also biometrische Merkmale wie Fingerabdruck oder Gesicht. Mehr-Faktor-Authentifizierung braucht mindestens zwei verschiedene Arten. Beispiele: Passwort plus Code aus der App sind zwei Faktoren. Smartcard plus PIN sind zwei Faktoren. Passwort plus Sicherheitsfrage ist nur ein Faktor, weil beides Wissen ist. Ein Passkey kombiniert einen Schlüssel auf dem Gerät mit Fingerabdruck oder PIN zum Entsperren und ist gegen Phishing geschützt.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .w { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.5; }
      .b { fill: #fff3cd; stroke: #b98900; stroke-width: 1.5; }
      .i { fill: #d1e7dd; stroke: #198754; stroke-width: 1.5; }
      .h { font-weight: 700; font-size: 13px; }
      .q { font-size: 11px; fill: #495057; font-style: italic; }
      .s { font-size: 11px; fill: #343a40; }
      .ok { fill: #146c43; font-weight: 700; }
      .no { fill: #b02a37; font-weight: 700; }
    </style>
  </defs>
  <rect class="w" x="20" y="16" width="216" height="106" rx="8"/><text class="h c" x="128" y="40">Wissen</text><text class="q c" x="128" y="57">etwas, das ich weiß</text>
  <text class="s c" x="128" y="80">Passwort, PIN,</text><text class="s c" x="128" y="96">Sicherheitsfrage</text>
  <rect class="b" x="252" y="16" width="216" height="106" rx="8"/><text class="h c" x="360" y="40">Besitz</text><text class="q c" x="360" y="57">etwas, das ich habe</text>
  <text class="s c" x="360" y="80">Authenticator-App, Hardware-</text><text class="s c" x="360" y="96">Token, Smartcard</text>
  <rect class="i" x="484" y="16" width="216" height="106" rx="8"/><text class="h c" x="592" y="40">Sein</text><text class="q c" x="592" y="57">etwas, das ich bin</text>
  <text class="s c" x="592" y="80">Fingerabdruck, Gesicht,</text><text class="s c" x="592" y="96">Iris (Biometrie)</text>

  <text class="h" x="20" y="152" style="font-size:12.5px">MFA = mindestens zwei verschiedene Faktorarten</text>
  <text class="s" x="20" y="176"><tspan class="ok">✓ 2 Faktoren</tspan>  Passwort + Code aus der App</text>
  <text class="s" x="20" y="196"><tspan class="ok">✓ 2 Faktoren</tspan>  Smartcard + PIN</text>
  <text class="s" x="20" y="216"><tspan class="no">✗ 1 Faktor</tspan>  Passwort + Sicherheitsfrage (beides Wissen)</text>
  <text class="s" x="380" y="176" style="font-weight:700">Passkey (FIDO2)</text>
  <text class="s" x="380" y="196">privater Schlüssel auf dem Gerät (Besitz),</text>
  <text class="s" x="380" y="212">entsperrt per Fingerabdruck oder PIN;</text>
  <text class="s" x="380" y="228">an die echte Domain gebunden → phishing-resistent</text>
  <text class="s" x="20" y="256">Code per SMS ist besser als kein zweiter Faktor, aber schwächer als App oder Token (SIM-Tausch, Umleitung).</text>
</svg>
