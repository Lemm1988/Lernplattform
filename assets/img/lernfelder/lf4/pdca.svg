<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="pd-title pd-desc">
  <title id="pd-title">PDCA-Zyklus eines ISMS</title>
  <desc id="pd-desc">Ein Informationssicherheitsmanagementsystem arbeitet im Kreislauf Plan, Do, Check, Act. Plan: Ziele und Leitlinie festlegen, Risiken bewerten, Maßnahmen planen. Do: Maßnahmen umsetzen, Mitarbeitende schulen. Check: Audits, Kennzahlen, Vorfälle auswerten. Act: Mängel beheben, Konzept verbessern. Danach beginnt der Kreislauf von vorn. Normen dafür sind ISO/IEC 27001 und BSI-Standard 200-1.</desc>
  <defs>
    <marker id="pd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .bx { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .h { font-weight: 700; font-size: 13px; }
      .s { font-size: 11px; fill: #343a40; }
      .ar { stroke: #495057; stroke-width: 1.8; marker-end: url(#pd-arr); fill: none; }
      .mid { fill: #343a40; }
      .mt { fill: #fff; font-weight: 700; font-size: 12px; text-anchor: middle; }
      .ph { font-weight: 700; font-size: 12.5px; }
    </style>
  </defs>
  <rect class="bx" x="20" y="16" width="190" height="84" rx="8"/><text class="h" x="34" y="40">Plan</text><text class="s" x="80" y="40">planen</text>
  <text class="s" x="34" y="62">Ziele und Leitlinie festlegen,</text><text class="s" x="34" y="78">Risiken bewerten, Maßnahmen planen</text>
  <rect class="bx" x="250" y="16" width="190" height="84" rx="8"/><text class="h" x="264" y="40">Do</text><text class="s" x="292" y="40">umsetzen</text>
  <text class="s" x="264" y="62">Maßnahmen einführen,</text><text class="s" x="264" y="78">Mitarbeitende schulen</text>
  <rect class="bx" x="250" y="146" width="190" height="84" rx="8"/><text class="h" x="264" y="170">Check</text><text class="s" x="310" y="170">prüfen</text>
  <text class="s" x="264" y="192">Audits, Kennzahlen,</text><text class="s" x="264" y="208">Vorfälle auswerten</text>
  <rect class="bx" x="20" y="146" width="190" height="84" rx="8"/><text class="h" x="34" y="170">Act</text><text class="s" x="64" y="170">verbessern</text>
  <text class="s" x="34" y="192">Mängel beheben,</text><text class="s" x="34" y="208">Konzept anpassen</text>
  <path class="ar" d="M210,58 H246"/><path class="ar" d="M345,100 V142"/><path class="ar" d="M250,188 H214"/><path class="ar" d="M115,146 V104"/>
  <circle class="mid" cx="230" cy="123" r="22"/><text class="mt" x="230" y="127">ISMS</text>

  <text class="ph" x="480" y="40">ISMS</text>
  <text class="s" x="480" y="60">Informationssicherheits-Managementsystem:</text>
  <text class="s" x="480" y="76">Regeln, Rollen und Verfahren, mit denen</text>
  <text class="s" x="480" y="92">ein Unternehmen Sicherheit dauerhaft steuert</text>
  <text class="ph" x="480" y="130">Normen</text>
  <text class="s" x="480" y="150">ISO/IEC 27001 (zertifizierbar)</text>
  <text class="s" x="480" y="166">BSI-Standard 200-1</text>
  <text class="s" x="480" y="182">ISO 27001 auf Basis von IT-Grundschutz</text>
  <text class="s" x="480" y="218" style="font-weight:700">Sicherheit ist ein Kreislauf, kein Projekt.</text>
</svg>
