<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="ib-title ib-desc">
  <title id="ib-title">IPv4-Adresse 192.168.10.77/26 binär zerlegt</title>
  <desc id="ib-desc">Die Adresse 192.168.10.77 mit Präfix /26 binär: Die ersten 26 Bit sind der Netzanteil, die letzten 6 Bit der Hostanteil. Die Maske /26 besteht aus 26 Einsen und 6 Nullen, dezimal 255.255.255.192. Die Netzadresse entsteht durch UND-Verknüpfung von Adresse und Maske, also alle Hostbits auf 0: 192.168.10.64. Die Broadcastadresse hat alle Hostbits auf 1: 192.168.10.127. Nutzbar sind 2 hoch 6 minus 2, also 62 Adressen von 192.168.10.65 bis 192.168.10.126.</desc>
