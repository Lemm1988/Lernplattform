<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="lr-title lr-desc">
  <title id="lr-title">Linux-Dateirechte rwxr-x--- als Oktalzahl 750</title>
  <desc id="lr-desc">Die Rechteanzeige -rwxr-x--- besteht aus dem Dateityp und drei Dreiergruppen. Das erste Zeichen ist der Typ: Bindestrich für eine Datei, d für ein Verzeichnis, l für einen Link. Dann folgen die Rechte für den Besitzer (rwx, also 4 plus 2 plus 1 gleich 7), die Gruppe (r-x, 4 plus 0 plus 1 gleich 5) und alle anderen (---, 0). Zusammen ergibt das chmod 750. Lesen hat den Wert 4, Schreiben 2, Ausführen 1. Bei Verzeichnissen bedeutet r Inhalt auflisten, w Einträge anlegen und löschen, x das Verzeichnis betreten.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .big { font-family: ui-monospace, Consolas, monospace; font-size: 28px; font-weight: 700; text-anchor: middle; }
      .t { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 1.3; }
      .u { fill: #cfe2ff; stroke: #0d6efd; stroke-width: 1.4; }
      .g { fill: #d1e7dd; stroke: #198754; stroke-width: 1.4; }
      .o { fill: #ffe5d0; stroke: #fd7e14; stroke-width: 1.4; }
      .h { font-weight: 700; font-size: 12.5px; }
      .s { font-size: 11.5px; fill: #343a40; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      .th { font-size: 11px; font-weight: 700; fill: #495057; }
    </style>
  </defs>
  <rect class="t" x="20" y="30" width="56" height="54" rx="6"/><text class="big" x="48" y="67">-</text>
  <rect class="u" x="92" y="30" width="150" height="54" rx="6"/><text class="big" x="167" y="67">rwx</text>
  <rect class="g" x="258" y="30" width="150" height="54" rx="6"/><text class="big" x="333" y="67">r-x</text>
  <rect class="o" x="424" y="30" width="150" height="54" rx="6"/><text class="big" x="499" y="67">---</text>
  <text class="big" x="645" y="67">= 750</text>

  <text class="h c" x="48" y="104">Typ</text><text class="s c" x="48" y="122">- Datei</text><text class="s c" x="48" y="138">d Verz.</text>
  <text class="h c" x="167" y="104">Besitzer (u)</text><text class="m c" x="167" y="124">4 + 2 + 1 = 7</text>
  <text class="h c" x="333" y="104">Gruppe (g)</text><text class="m c" x="333" y="124">4 + 0 + 1 = 5</text>
  <text class="h c" x="499" y="104">Andere (o)</text><text class="m c" x="499" y="124">0 + 0 + 0 = 0</text>
  <text class="m c" x="645" y="104">chmod 750</text>

  <text class="th" x="20" y="180">Recht</text><text class="th" x="110" y="180">Wert</text><text class="th" x="180" y="180">bei Dateien</text><text class="th" x="420" y="180">bei Verzeichnissen</text>
  <text class="m" x="20" y="204">r</text><text class="m" x="110" y="204">4</text><text class="s" x="180" y="204">Inhalt lesen</text><text class="s" x="420" y="204">Inhalt auflisten (ls)</text>
  <text class="m" x="20" y="226">w</text><text class="m" x="110" y="226">2</text><text class="s" x="180" y="226">Inhalt ändern</text><text class="s" x="420" y="226">Einträge anlegen, umbenennen, löschen</text>
  <text class="m" x="20" y="248">x</text><text class="m" x="110" y="248">1</text><text class="s" x="180" y="248">als Programm ausführen</text><text class="s" x="420" y="248">betreten (cd)</text>
</svg>
