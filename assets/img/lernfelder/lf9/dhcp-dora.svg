<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="dh-title dh-desc">
  <title id="dh-title">DHCP-Ablauf DORA</title>
  <desc id="dh-desc">Erstens Discover: Der Client ohne Adresse sendet einen Broadcast von 0.0.0.0 Port 68 an 255.255.255.255 Port 67. Zweitens Offer: Der DHCP-Server bietet 192.168.10.57 mit Maske, Gateway, DNS-Server und Lease-Dauer 8 Stunden an. Drittens Request: Der Client fordert genau dieses Angebot an, wieder per Broadcast, damit andere DHCP-Server wissen, dass ihr Angebot nicht genommen wurde. Viertens Acknowledge: Der Server bestätigt, die Lease beginnt. Nach der Hälfte der Lease-Zeit verlängert der Client direkt beim Server. Liegt der Server in einem anderen Subnetz, leitet ein DHCP-Relay auf dem Router die Anfragen weiter.</desc>
  <defs>
    <marker id="dh-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .box { fill: #343a40; }
      .bt { fill: #fff; font-weight: 700; font-size: 12px; text-anchor: middle; }
      .life { stroke: #adb5bd; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg { stroke: #495057; stroke-width: 1.6; marker-end: url(#dh-arr); }
      .bc { stroke: #fd7e14; stroke-width: 2; marker-end: url(#dh-arr); }
      .L { font-size: 15px; font-weight: 800; fill: #0a58ca; }
      .ml { font-size: 12px; font-weight: 700; }
      .s { font-size: 11px; fill: #343a40; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>
  <rect class="box" x="70" y="14" width="160" height="34" rx="6"/><text class="bt" x="150" y="36">Client (noch ohne IP)</text>
  <rect class="box" x="490" y="14" width="160" height="34" rx="6"/><text class="bt" x="570" y="36">DHCP-Server</text>
  <line class="life" x1="150" y1="48" x2="150" y2="240"/><line class="life" x1="570" y1="48" x2="570" y2="240"/>

  <text class="L" x="20" y="88">D</text>
  <line class="bc" x1="150" y1="84" x2="566" y2="84"/>
  <text class="ml" x="160" y="76">Discover</text><text class="m" x="232" y="76">0.0.0.0:68 → 255.255.255.255:67</text>
  <text class="L" x="20" y="136">O</text>
  <line class="msg" x1="570" y1="132" x2="154" y2="132"/>
  <text class="ml" x="160" y="124">Offer</text><text class="m" x="210" y="124">192.168.10.57/24, Gateway, DNS, Lease 8 h</text>
  <text class="L" x="20" y="184">R</text>
  <line class="bc" x1="150" y1="180" x2="566" y2="180"/>
  <text class="ml" x="160" y="172">Request</text><text class="s" x="224" y="172">„Ich nehme 192.168.10.57 von diesem Server“</text>
  <text class="L" x="20" y="232">A</text>
  <line class="msg" x1="570" y1="228" x2="154" y2="228"/>
  <text class="ml" x="160" y="220">Acknowledge</text><text class="s" x="252" y="220">bestätigt – Lease läuft</text>

  <line class="bc" x1="20" y1="262" x2="48" y2="262"/><text class="s" x="56" y="266">Broadcast (Client hat noch keine Adresse; andere Server sehen, dass ihr Angebot abgelehnt ist)</text>
  <text class="s" x="20" y="288">Nach 50 % der Lease verlängert der Client per Unicast. Anderes Subnetz? → DHCP-Relay auf dem Router.</text>
</svg>
