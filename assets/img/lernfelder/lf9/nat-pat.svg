<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" role="img" aria-labelledby="np-title np-desc">
  <title id="np-title">NAT mit Port Address Translation</title>
  <desc id="np-desc">Zwei PCs im privaten Netz, 192.168.1.10 und 192.168.1.11, rufen beide vom Quellport 51000 aus denselben Webserver 198.51.100.7 auf Port 443 auf. Der Router hat außen nur die öffentliche Adresse 203.0.113.5. Er ersetzt Quelladresse und Quellport: Die Verbindung von PC 1 erscheint als 203.0.113.5:40001, die von PC 2 als 203.0.113.5:40002. Die Zuordnung merkt er sich in der NAT-Tabelle. Antwortet der Server an Port 40002, schlägt der Router nach und leitet die Antwort an 192.168.1.11:51000 weiter.</desc>
  <defs>
    <marker id="np-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .pc { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .srv { fill: #d1e7dd; stroke: #198754; stroke-width: 1.4; }
      .rt { fill: #343a40; }
      .rtt { fill: #fff; font-weight: 700; font-size: 12px; text-anchor: middle; }
      .rts { fill: #ced4da; font-size: 10.5px; text-anchor: middle; }
      .ln { stroke: #495057; stroke-width: 1.8; marker-end: url(#np-arr); }
      .h { font-weight: 700; font-size: 12px; }
      .s { font-size: 11px; fill: #343a40; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
      .th { font-size: 11px; font-weight: 700; fill: #495057; }
      .zone { fill: none; stroke: #ced4da; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .row { fill: #f8f9fa; }
    </style>
  </defs>
  <rect class="zone" x="10" y="20" width="230" height="150" rx="8"/><text class="s" x="20" y="36">privates Netz 192.168.1.0/24</text>
  <rect class="pc" x="30" y="48" width="170" height="44" rx="6"/><text class="h c" x="115" y="66">PC 1</text><text class="m c" x="115" y="83">192.168.1.10:51000</text>
  <rect class="pc" x="30" y="112" width="170" height="44" rx="6"/><text class="h c" x="115" y="130">PC 2</text><text class="m c" x="115" y="147">192.168.1.11:51000</text>
  <line class="ln" x1="200" y1="70" x2="286" y2="94"/><line class="ln" x1="200" y1="134" x2="286" y2="110"/>
  <rect class="rt" x="290" y="78" width="130" height="48" rx="8"/><text class="rtt" x="355" y="99">Router (PAT)</text><text class="rts" x="355" y="116">außen 203.0.113.5</text>
  <line class="ln" x1="420" y1="102" x2="546" y2="102"/>
  <text class="s c" x="483" y="94">Quelle 203.0.113.5</text><text class="s c" x="483" y="120">:40001 / :40002</text>
  <rect class="srv" x="550" y="78" width="150" height="48" rx="6"/><text class="h c" x="625" y="97">Webserver</text><text class="m c" x="625" y="115">198.51.100.7:443</text>

  <text class="h" x="20" y="200">NAT-Tabelle im Router</text>
  <text class="th" x="20" y="222">innen (privat)</text><text class="th" x="220" y="222">außen (öffentlich)</text><text class="th" x="420" y="222">Ziel</text>
  <rect class="row" x="14" y="228" width="580" height="20"/>
  <text class="m" x="20" y="242">192.168.1.10:51000</text><text class="m" x="220" y="242">203.0.113.5:40001</text><text class="m" x="420" y="242">198.51.100.7:443</text>
  <text class="m" x="20" y="262">192.168.1.11:51000</text><text class="m" x="220" y="262">203.0.113.5:40002</text><text class="m" x="420" y="262">198.51.100.7:443</text>
  <text class="s" x="20" y="286">Antwort an :40002 → Router schlägt nach → weiter an 192.168.1.11:51000.</text>
  <text class="s" x="20" y="302">Beide PCs nutzen Port 51000 – erst der neue Port macht sie unterscheidbar.</text>
</svg>
