<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="qt-title qt-desc">
  <title id="qt-title">Der 802.1Q-Tag im Ethernet-Frame</title>
  <desc id="qt-desc">Ein Ethernet-Frame mit den Feldern Ziel-MAC (6 Byte), Quell-MAC (6 Byte), 802.1Q-Tag (4 Byte), EtherType (2 Byte), Daten (46 bis 1500 Byte) und FCS (4 Byte). Der Tag steht zwischen Quell-MAC und EtherType und besteht aus 32 Bit: TPID mit dem Wert 0x8100 (16 Bit), PCP für die Priorität 0 bis 7 (3 Bit), DEI (1 Bit) und VLAN-ID (12 Bit). 12 Bit ergeben 4096 Werte; 0 und 4095 sind reserviert, nutzbar sind die VLANs 1 bis 4094.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .f { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1.2; }
      .tag { fill: #cfe2ff; stroke: #0d6efd; stroke-width: 1.8; }
      .ft { font-size: 11.5px; font-weight: 700; }
      .fs { font-size: 10.5px; fill: #495057; }
      .con { stroke: #0d6efd; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .s { font-size: 11.5px; fill: #343a40; text-anchor: start; }
    </style>
  </defs>
  <rect class="f" x="20" y="34" width="120" height="36"/><text class="ft" x="80" y="57">Ziel-MAC</text><text class="fs" x="80" y="86">6 Byte</text>
  <rect class="f" x="140" y="34" width="120" height="36"/><text class="ft" x="200" y="57">Quell-MAC</text><text class="fs" x="200" y="86">6 Byte</text>
  <rect class="tag" x="260" y="34" width="100" height="36"/><text class="ft" x="310" y="57">802.1Q-Tag</text><text class="fs" x="310" y="86">4 Byte</text>
  <rect class="f" x="360" y="34" width="90" height="36"/><text class="ft" x="405" y="57">EtherType</text><text class="fs" x="405" y="86">2 Byte</text>
  <rect class="f" x="450" y="34" width="170" height="36"/><text class="ft" x="535" y="57">Daten</text><text class="fs" x="535" y="86">46–1500 Byte</text>
  <rect class="f" x="620" y="34" width="80" height="36"/><text class="ft" x="660" y="57">FCS</text><text class="fs" x="660" y="86">4 Byte</text>
  <text class="fs" x="360" y="20" style="font-size:11px">wird am Trunk eingefügt und am Access-Port wieder entfernt</text>

  <path class="con" d="M260,70 V96 L60,124 M360,70 V96 L660,124"/>
  <rect class="tag" x="60" y="124" width="240" height="36"/><text class="ft" x="180" y="147">TPID = 0x8100</text><text class="fs" x="180" y="176">16 Bit · „hier folgt ein Tag“</text>
  <rect class="tag" x="300" y="124" width="100" height="36"/><text class="ft" x="350" y="147">PCP</text><text class="fs" x="350" y="176">3 Bit · Priorität 0–7</text>
  <rect class="tag" x="400" y="124" width="70" height="36"/><text class="ft" x="435" y="147">DEI</text><text class="fs" x="435" y="176">1 Bit</text>
  <rect class="tag" x="470" y="124" width="190" height="36"/><text class="ft" x="565" y="147">VLAN-ID (VID)</text><text class="fs" x="565" y="176">12 Bit</text>
  <text class="s" x="60" y="206">12 Bit = 4096 Werte; 0 und 4095 sind reserviert → nutzbar sind VLAN 1 bis 4094.</text>
</svg>
