<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="mg-title mg-desc">
  <title id="mg-title">Diagonale, Breite und Pixeldichte eines Monitors</title>
  <desc id="mg-desc">Ein Monitor im Format 16 zu 9 mit 27 Zoll Diagonale und 2560 mal 1440 Pixeln. Breite, Höhe und Diagonale bilden ein rechtwinkliges Dreieck, es gilt der Satz des Pythagoras. Breite gleich Diagonale mal 16 durch Wurzel aus 16 zum Quadrat plus 9 zum Quadrat, also 27 mal 16 durch 18,36 gleich 23,53 Zoll oder 59,8 Zentimeter; Höhe 13,24 Zoll oder 33,6 Zentimeter. Pixeldichte gleich Pixeldiagonale durch Zoll-Diagonale: Wurzel aus 2560 zum Quadrat plus 1440 zum Quadrat ergibt 2937 Pixel, geteilt durch 27 ergibt rund 109 Pixel pro Zoll.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .scr { fill: #e7f1ff; stroke: #343a40; stroke-width: 3; }
      .diag { stroke: #fd7e14; stroke-width: 2.4; stroke-dasharray: 7 4; }
      .dim { stroke: #495057; stroke-width: 1.3; }
      .h { font-weight: 700; font-size: 12px; }
      .s { font-size: 11px; fill: #343a40; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
    </style>
  </defs>
  <rect class="scr" x="40" y="30" width="288" height="162" rx="4"/>
  <rect x="164" y="192" width="40" height="18" fill="#6c757d"/><rect x="134" y="210" width="100" height="8" rx="3" fill="#6c757d"/>
  <line class="diag" x1="40" y1="192" x2="328" y2="30"/>
  <text class="h" x="200" y="104" style="fill:#b35c00" transform="rotate(-29 200 104)">27" Diagonale</text>
  <line class="dim" x1="40" y1="22" x2="328" y2="22"/><text class="s c" x="184" y="16">Breite: 16 Teile</text>
  <line class="dim" x1="338" y1="30" x2="338" y2="192"/><text class="s" x="344" y="114">Höhe:</text><text class="s" x="344" y="128">9 Teile</text>
  <text class="s c" x="120" y="60">2560 × 1440 Pixel</text>

  <text class="h" x="410" y="40">Breite aus Diagonale (16:9)</text>
  <text class="m" x="410" y="62">√(16² + 9²) = 18,36</text>
  <text class="m" x="410" y="80">27 × 16 ÷ 18,36 = 23,53" ≈ 59,8 cm</text>
  <text class="m" x="410" y="98">27 × 9 ÷ 18,36 = 13,24" ≈ 33,6 cm</text>
  <text class="h" x="410" y="134">Pixeldichte (ppi)</text>
  <text class="m" x="410" y="156">√(2560² + 1440²) ≈ 2937 px</text>
  <text class="m" x="410" y="174">2937 ÷ 27 ≈ 109 ppi</text>
  <text class="s" x="410" y="204">1 Zoll = 2,54 cm</text>
  <text class="s" x="410" y="222">zum Vergleich: 24" Full HD ≈ 92 ppi</text>
</svg>
