<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-labelledby="af-title af-desc">
  <title id="af-title">Lineare Abschreibung eines Notebooks</title>
  <desc id="af-desc">Ein Notebook kostet 1200 Euro netto und wird linear über drei Jahre abgeschrieben, jedes Jahr 400 Euro. Der Buchwert sinkt von 1200 Euro bei der Anschaffung auf 800 Euro nach dem ersten, 400 Euro nach dem zweiten und 0 Euro nach dem dritten Jahr. Rechts die Sonderregeln: Geringwertige Wirtschaftsgüter bis 800 Euro netto dürfen im Anschaffungsjahr voll abgeschrieben werden. Computerhardware und Software dürfen seit 2021 auch über ein Jahr abgeschrieben werden.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .tk { font-size: 10.5px; fill: #6c757d; }
      .grid { stroke: #e9ecef; stroke-width: 1; }
      .ln { stroke: #2a78d6; stroke-width: 2; fill: none; }
      .pt { fill: #2a78d6; stroke: #fff; stroke-width: 2; }
      .val { font-size: 11.5px; font-weight: 700; }
      .h { font-size: 12px; font-weight: 700; }
      .s { font-size: 11px; fill: #343a40; }
    </style>
  </defs>
  <line class="grid" x1="90" y1="200.0" x2="430" y2="200.0"/><text class="tk" x="82" y="204.0" style="text-anchor:end">0 €</text>
  <line class="grid" x1="90" y1="151.3" x2="430" y2="151.3"/><text class="tk" x="82" y="155.3" style="text-anchor:end">400 €</text>
  <line class="grid" x1="90" y1="102.7" x2="430" y2="102.7"/><text class="tk" x="82" y="106.7" style="text-anchor:end">800 €</text>
  <line class="grid" x1="90" y1="54.0" x2="430" y2="54.0"/><text class="tk" x="82" y="58.0" style="text-anchor:end">1200 €</text>
  <text class="tk" x="90.0" y="218" style="text-anchor:middle">Kauf</text>
  <text class="tk" x="203.3" y="218" style="text-anchor:middle">Jahr 1</text>
  <text class="tk" x="316.7" y="218" style="text-anchor:middle">Jahr 2</text>
  <text class="tk" x="430.0" y="218" style="text-anchor:middle">Jahr 3</text>
  <polyline class="ln" points="90.0,54.0 203.3,102.7 316.7,151.3 430.0,200.0"/>
  <circle class="pt" cx="90.0" cy="54.0" r="5"/><text class="val" x="98.0" y="46.0">1200 €</text>
  <circle class="pt" cx="203.3" cy="102.7" r="5"/><text class="val" x="211.3" y="94.7">800 €</text>
  <circle class="pt" cx="316.7" cy="151.3" r="5"/><text class="val" x="324.7" y="143.3">400 €</text>
  <circle class="pt" cx="430.0" cy="200.0" r="5"/><text class="val" x="438.0" y="192.0">0 €</text>
  <text class="s" x="90" y="18">Buchwert, AfA je Jahr = 1200 € ÷ 3 = 400 €</text>
  <text class="h" x="470" y="50">Sonderregeln</text>
  <text class="s" x="470" y="74">Geringwertige Wirtschaftsgüter</text><text class="s" x="470" y="90">bis 800 € netto: im Anschaffungs-</text><text class="s" x="470" y="106">jahr voll absetzbar</text>
  <text class="s" x="470" y="134">Computerhardware und Software:</text><text class="s" x="470" y="150">seit 2021 auch über 1 Jahr</text><text class="s" x="470" y="166">abschreibbar</text>
</svg>
