<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="nw-title nw-desc">
  <title id="nw-title">Nutzwertanalyse für drei Notebooks</title>
  <desc id="nw-desc">Gestapelte Balken der gewichteten Punkte. Gewichte: Leistung 40 Prozent, Akkulaufzeit 30 Prozent, Gewicht 20 Prozent, Service 10 Prozent. Notebook X erreicht 3,2 plus 1,8 plus 1,8 plus 0,7 gleich 7,5 Punkte. Notebook Y erreicht 3,6 plus 2,4 plus 1,0 plus 0,6 gleich 7,6 Punkte und liegt damit vorn. Notebook Z erreicht 2,4 plus 2,7 plus 1,4 plus 0,8 gleich 7,3 Punkte.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .lab { font-size: 12px; font-weight: 700; text-anchor: end; }
      .tot { font-size: 12px; font-weight: 700; }
      .tk { font-size: 10.5px; fill: #6c757d; text-anchor: middle; }
      .grid { stroke: #e9ecef; stroke-width: 1; }
      .lg { font-size: 11px; fill: #343a40; }
    </style>
  </defs>
  <rect x="150" y="14" width="12" height="12" rx="2" fill="#2a78d6"/><text class="lg" x="167" y="24">Leistung 40 %</text>
  <rect x="266.9" y="14" width="12" height="12" rx="2" fill="#eb6834"/><text class="lg" x="283.9" y="24">Akkulaufzeit 30 %</text>
  <rect x="409.0" y="14" width="12" height="12" rx="2" fill="#1baf7a"/><text class="lg" x="426.0" y="24">Gewicht 20 %</text>
  <rect x="519.6" y="14" width="12" height="12" rx="2" fill="#eda100"/><text class="lg" x="536.6" y="24">Service 10 %</text>
  <line class="grid" x1="150.0" y1="52" x2="150.0" y2="198"/><text class="tk" x="150.0" y="214">0</text>
  <line class="grid" x1="248.0" y1="52" x2="248.0" y2="198"/><text class="tk" x="248.0" y="214">2</text>
  <line class="grid" x1="346.0" y1="52" x2="346.0" y2="198"/><text class="tk" x="346.0" y="214">4</text>
  <line class="grid" x1="444.0" y1="52" x2="444.0" y2="198"/><text class="tk" x="444.0" y="214">6</text>
  <line class="grid" x1="542.0" y1="52" x2="542.0" y2="198"/><text class="tk" x="542.0" y="214">8</text>
  <line class="grid" x1="640.0" y1="52" x2="640.0" y2="198"/><text class="tk" x="640.0" y="214">10</text>
  <text class="lab" x="140" y="77.0">Notebook X</text>
  <rect x="150.0" y="58" width="154.8" height="30" fill="#2a78d6"/>
  <rect x="306.8" y="58" width="86.2" height="30" fill="#eb6834"/>
  <rect x="395.0" y="58" width="86.2" height="30" fill="#1baf7a"/>
  <rect x="483.2" y="58" width="32.3" height="30" fill="#eda100"/>
  <text class="tot" x="525.5" y="77.0">7,5 Punkte</text>
  <text class="lab" x="140" y="129.0">Notebook Y</text>
  <rect x="150.0" y="110" width="174.4" height="30" fill="#2a78d6"/>
  <rect x="326.4" y="110" width="115.6" height="30" fill="#eb6834"/>
  <rect x="444.0" y="110" width="47.0" height="30" fill="#1baf7a"/>
  <rect x="493.0" y="110" width="27.4" height="30" fill="#eda100"/>
  <text class="tot" x="530.4" y="129.0">7,6 Punkte</text>
  <text class="lab" x="140" y="181.0">Notebook Z</text>
  <rect x="150.0" y="162" width="115.6" height="30" fill="#2a78d6"/>
  <rect x="267.6" y="162" width="130.3" height="30" fill="#eb6834"/>
  <rect x="399.9" y="162" width="66.6" height="30" fill="#1baf7a"/>
  <rect x="468.5" y="162" width="37.2" height="30" fill="#eda100"/>
  <text class="tot" x="515.7" y="181.0">7,3 Punkte</text>
</svg>
