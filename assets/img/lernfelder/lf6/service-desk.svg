<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">Der Service Desk als zentrale Anlaufstelle</title>
  <desc id="sd-desc">Anwenderinnen und Anwender melden sich über verschiedene Kanäle: Telefon, E-Mail, Self-Service-Portal und Chat. Alle Anfragen laufen beim Service Desk zusammen, dem Single Point of Contact. Er nimmt an, erfasst ein Ticket, löst selbst oder leitet weiter an Fachteams: Server und Netz, Anwendungsbetreuung, Softwareentwicklung sowie Hersteller und externe Dienstleister. Der Service Desk bleibt Ansprechpartner, bis das Ticket geschlossen ist.</desc>
  <defs>
    <marker id="sd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .c { text-anchor: middle; }
      .ch { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .sd { fill: #343a40; }
      .sdt { fill: #fff; font-weight: 700; font-size: 13px; text-anchor: middle; }
      .sds { fill: #ced4da; font-size: 10.5px; text-anchor: middle; }
      .tm { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1.3; }
      .h { font-weight: 700; font-size: 11.5px; }
      .s { font-size: 11px; fill: #343a40; }
      .ln { stroke: #6c757d; stroke-width: 1.4; fill: none; marker-end: url(#sd-arr); }
      .lb { stroke: #6c757d; stroke-width: 1.4; fill: none; marker-start: url(#sd-arr); marker-end: url(#sd-arr); }
      .row { font-size: 10.5px; font-weight: 700; fill: #495057; letter-spacing: .04em; }
    </style>
  </defs>
  <text class="row" x="20" y="20">KANÄLE</text>
  <rect class="ch" x="20" y="30" width="140" height="32" rx="5"/><text class="h c" x="90" y="50">Telefon</text>
  <rect class="ch" x="20" y="76" width="140" height="32" rx="5"/><text class="h c" x="90" y="96">E-Mail</text>
  <rect class="ch" x="20" y="122" width="140" height="32" rx="5"/><text class="h c" x="90" y="142">Self-Service-Portal</text>
  <rect class="ch" x="20" y="168" width="140" height="32" rx="5"/><text class="h c" x="90" y="188">Chat</text>
  <path class="ln" d="M160,46 L246,104"/><path class="ln" d="M160,92 L246,112"/><path class="ln" d="M160,138 L246,124"/><path class="ln" d="M160,184 L246,132"/>

  <rect class="sd" x="250" y="76" width="190" height="84" rx="8"/><text class="sdt" x="345" y="102">Service Desk</text>
  <text class="sds" x="345" y="120">Single Point of Contact</text><text class="sds" x="345" y="136">annehmen, erfassen,</text><text class="sds" x="345" y="150">lösen oder weiterleiten</text>

  <text class="row" x="500" y="20">FACHTEAMS</text>
  <rect class="tm" x="500" y="30" width="200" height="32" rx="5"/><text class="h" x="512" y="50">Server und Netz</text>
  <rect class="tm" x="500" y="76" width="200" height="32" rx="5"/><text class="h" x="512" y="96">Anwendungsbetreuung</text>
  <rect class="tm" x="500" y="122" width="200" height="32" rx="5"/><text class="h" x="512" y="142">Softwareentwicklung</text>
  <rect class="tm" x="500" y="168" width="200" height="32" rx="5"/><text class="h" x="512" y="188">Hersteller, Dienstleister</text>
  <path class="lb" d="M444,104 L496,46"/><path class="lb" d="M444,112 L496,92"/><path class="lb" d="M444,124 L496,138"/><path class="lb" d="M444,132 L496,184"/>

  <text class="s" x="20" y="232">Ein Ticket je Anliegen. Der Service Desk bleibt Ansprechpartner der Anwender, bis das Ticket geschlossen ist –</text>
  <text class="s" x="20" y="250">auch wenn ein Fachteam oder der Hersteller das Problem löst.</text>
</svg>
