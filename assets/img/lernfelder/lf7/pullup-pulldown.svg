<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="pu-title pu-desc">
  <title id="pu-title">Pull-up- und Pull-down-Widerstand an einem Taster</title>
  <desc id="pu-desc">Links Pull-up: Ein 10-Kiloohm-Widerstand verbindet den GPIO-Eingang mit 3,3 Volt, der Taster verbindet den Eingang mit Masse. Nicht gedrückt liest der Eingang HIGH, gedrückt LOW – die Logik ist invertiert, man spricht von aktiv LOW. Rechts Pull-down: Der Taster liegt zwischen 3,3 Volt und Eingang, der Widerstand zwischen Eingang und Masse. Nicht gedrückt liest der Eingang LOW, gedrückt HIGH. Ohne Widerstand wäre der offene Eingang undefiniert, er „floatet“ und liefert zufällige Werte.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
    .w { stroke: #212529; stroke-width: 2; fill: none; }
    .r { fill: #fff; stroke: #212529; stroke-width: 2; }
    .t { font-weight: 700; font-size: 13px; }
    .l { font-size: 11.5px; } .b { font-weight: 700; }
    .s { font-size: 11px; fill: #343a40; }
  </style>
  <text class="t" x="20" y="22">Pull-up – aktiv LOW</text>
  <path class="w" d="M96,50 h28"/><text class="l b" x="110" y="44" text-anchor="middle">+3,3 V</text>
  <path class="w" d="M110,50 V58"/><rect class="r" x="101" y="58" width="18" height="54"/><path class="w" d="M110,112 V120"/>
  <text class="l" x="126" y="83.0">R</text><text class="s" x="126" y="98.0">10 kΩ</text>
  <circle cx="110" cy="130" r="4" fill="#212529"/><path class="w" d="M110,120 V140 M110,130 H220"/>
  <rect x="220" y="117" width="96" height="26" rx="5" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.5"/><text class="l b" x="268" y="135" text-anchor="middle">GPIO-Eingang</text>
  <path class="w" d="M110,140 V163.0"/><circle cx="110" cy="163.0" r="3" fill="#fff" stroke="#212529" stroke-width="2"/>
  <circle cx="110" cy="187.0" r="3" fill="#fff" stroke="#212529" stroke-width="2"/><path class="w" d="M110,190.0 V210"/>
  <path class="w" d="M107,165.0 L92,185.0"/><path class="w" d="M84,175.0 h12"/><path class="w" d="M84,169.0 v12"/>
  <text class="l" x="124" y="179.0">Taster</text>
  <path class="w" d="M110,210 v6 M96,216 h28 M101,221 h18 M106,226 h8"/><text class="s" x="128" y="224">GND</text>
  <text class="s" x="20" y="254">nicht gedrückt:</text><text class="s b" x="148" y="254" style="fill:#0a58ca">HIGH (über R an 3,3 V)</text>
  <text class="s" x="20" y="272">gedrückt:</text><text class="s b" x="148" y="272" style="fill:#0a58ca">LOW (direkt an GND)</text>
  <line x1="358" y1="10" x2="358" y2="290" stroke="#dee2e6" stroke-width="1.5"/>
  <text class="t" x="390" y="22">Pull-down – aktiv HIGH</text>
  <path class="w" d="M466,50 h28"/><text class="l b" x="480" y="44" text-anchor="middle">+3,3 V</text>
  <path class="w" d="M480,50 V73.0"/><circle cx="480" cy="73.0" r="3" fill="#fff" stroke="#212529" stroke-width="2"/>
  <circle cx="480" cy="97.0" r="3" fill="#fff" stroke="#212529" stroke-width="2"/><path class="w" d="M480,100.0 V120"/>
  <path class="w" d="M477,75.0 L462,95.0"/><path class="w" d="M454,85.0 h12"/><path class="w" d="M454,79.0 v12"/>
  <text class="l" x="494" y="89.0">Taster</text>
  <circle cx="480" cy="130" r="4" fill="#212529"/><path class="w" d="M480,120 V140 M480,130 H590"/>
  <rect x="590" y="117" width="96" height="26" rx="5" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.5"/><text class="l b" x="638" y="135" text-anchor="middle">GPIO-Eingang</text>
  <path class="w" d="M480,140 V148"/><rect class="r" x="471" y="148" width="18" height="54"/><path class="w" d="M480,202 V210"/>
  <text class="l" x="496" y="173.0">R</text><text class="s" x="496" y="188.0">10 kΩ</text>
  <path class="w" d="M480,210 v6 M466,216 h28 M471,221 h18 M476,226 h8"/><text class="s" x="498" y="224">GND</text>
  <text class="s" x="390" y="254">nicht gedrückt:</text><text class="s b" x="518" y="254" style="fill:#0a58ca">LOW (über R an GND)</text>
  <text class="s" x="390" y="272">gedrückt:</text><text class="s b" x="518" y="272" style="fill:#0a58ca">HIGH (direkt an 3,3 V)</text>
</svg>
