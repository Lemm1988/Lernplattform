  <text class="val" x="366.0" y="252">0</text>
  <line x1="340" y1="180" x2="340" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <rect x="392" y="158" width="52" height="20" fill="#fff3cd" stroke="#fff" stroke-width="2"/><text class="cell" x="418.0" y="172">D4</text>
  <text class="val" x="418.0" y="252">0</text>
  <line x1="392" y1="180" x2="392" y2="234" stroke="#e9ecef" stroke-width="1"/>
