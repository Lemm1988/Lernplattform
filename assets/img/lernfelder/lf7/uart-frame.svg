<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="ua-title ua-desc">
  <title id="ua-title">UART: Verdrahtung und Rahmen für das Zeichen A</title>
  <desc id="ua-desc">Oben zwei Geräte, Mikrocontroller und GPS-Modul. TX des einen ist mit RX des anderen verbunden und umgekehrt, die Leitungen kreuzen sich; zusätzlich ist Masse verbunden. Beide müssen dieselbe Baudrate verwenden, zum Beispiel 9600. Unten der Rahmen für den Buchstaben A, hexadezimal 41, binär 0100 0001, im Format 8N1. Die Leitung ruht auf HIGH. Ein Startbit LOW kündigt das Zeichen an, danach folgen die 8 Datenbits mit dem niedrigstwertigen Bit zuerst: 1, 0, 0, 0, 0, 0, 1, 0. Kein Paritätsbit, ein Stoppbit HIGH. Ein Zeichen braucht damit 10 Bitzeiten; bei 9600 Baud dauert ein Bit etwa 104 Mikrosekunden.</desc>
  <defs><marker id="ua-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
    .bx { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
    .h { font-weight: 700; font-size: 12px; text-anchor: middle; }
    .s { font-size: 11px; fill: #343a40; }
    .pin { font-size: 11px; font-weight: 700; font-family: Consolas, monospace; }
    .w { stroke: #495057; stroke-width: 1.8; fill: none; marker-end: url(#ua-a); }
    .ax { font-size: 10.5px; fill: #495057; text-anchor: middle; }
    .cell { font-size: 10.5px; text-anchor: middle; fill: #495057; }
    .val { font-size: 13px; font-weight: 700; text-anchor: middle; font-family: Consolas, monospace; }
  </style>
  <rect class="bx" x="40" y="14" width="170" height="88" rx="8"/><text class="h" x="125" y="34">Mikrocontroller</text>
  <text class="pin" x="200" y="56" text-anchor="end">TX</text><text class="pin" x="200" y="76" text-anchor="end">RX</text><text class="pin" x="200" y="96" text-anchor="end">GND</text>
  <rect class="bx" x="460" y="14" width="170" height="88" rx="8"/><text class="h" x="545" y="34">GPS-Modul</text>
  <text class="pin" x="470" y="56">TX</text><text class="pin" x="470" y="76">RX</text><text class="pin" x="470" y="96">GND</text>
  <path class="w" d="M210,52 H300 L370,72 H456"/>
  <path class="w" d="M460,52 H370 L300,72 H214"/>
  <path d="M210,92 H460" stroke="#212529" stroke-width="1.8"/>
  <text class="s" x="335" y="44" text-anchor="middle">TX → RX gekreuzt</text>
  <text class="s" x="335" y="86" text-anchor="middle">gemeinsame Masse</text>
  <text class="s" x="335" y="118" text-anchor="middle">Beide Seiten: gleiche Baudrate (z. B. 9600) und gleiches Format (z. B. 8N1)</text>

  <text class="s" x="20" y="140" style="font-weight:700">Zeichen „A“ = 0x41 = 0100 0001 · Format 8N1 · niedrigstwertiges Bit zuerst</text>
  <text class="ax" x="66" y="190" text-anchor="end">HIGH</text><text class="ax" x="66" y="230" text-anchor="end">LOW</text>
  <rect x="80" y="158" width="52" height="20" fill="#f8f9fa" stroke="#fff" stroke-width="2"/><text class="cell" x="106.0" y="172">Ruhe</text>
  <line x1="80" y1="180" x2="80" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <rect x="132" y="158" width="52" height="20" fill="#f8d7da" stroke="#fff" stroke-width="2"/><text class="cell" x="158.0" y="172">Start</text>
  <text class="val" x="158.0" y="252">0</text>
  <line x1="132" y1="180" x2="132" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <rect x="184" y="158" width="52" height="20" fill="#fff3cd" stroke="#fff" stroke-width="2"/><text class="cell" x="210.0" y="172">D0</text>
  <text class="val" x="210.0" y="252">1</text>
