  <text class="val" x="470.0" y="252">0</text>
  <line x1="444" y1="180" x2="444" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <rect x="496" y="158" width="52" height="20" fill="#fff3cd" stroke="#fff" stroke-width="2"/><text class="cell" x="522.0" y="172">D6</text>
  <text class="val" x="522.0" y="252">1</text>
  <line x1="496" y1="180" x2="496" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <rect x="548" y="158" width="52" height="20" fill="#fff3cd" stroke="#fff" stroke-width="2"/><text class="cell" x="574.0" y="172">D7</text>
  <text class="val" x="574.0" y="252">0</text>
  <line x1="548" y1="180" x2="548" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <rect x="600" y="158" width="52" height="20" fill="#d1e7dd" stroke="#fff" stroke-width="2"/><text class="cell" x="626.0" y="172">Stopp</text>
  <text class="val" x="626.0" y="252">1</text>
  <line x1="600" y1="180" x2="600" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <rect x="652" y="158" width="52" height="20" fill="#f8f9fa" stroke="#fff" stroke-width="2"/><text class="cell" x="678.0" y="172">Ruhe</text>
  <line x1="652" y1="180" x2="652" y2="234" stroke="#e9ecef" stroke-width="1"/>
  <polyline points="80,186 132,186 132,226 184,226 184,186 236,186 236,226 288,226 288,226 340,226 340,226 392,226 392,226 444,226 444,226 496,226 496,186 548,186 548,226 600,226 600,186 652,186 652,186 704,186" fill="none" stroke="#2a78d6" stroke-width="2.2"/>
  <path d="M132,266 v6 H184 v-6" fill="none" stroke="#495057" stroke-width="1.2"/>
  <text class="s" x="132" y="288">1 Bitzeit = 1 / Baudrate ≈ 104 µs bei 9600 Baud</text>
</svg>
