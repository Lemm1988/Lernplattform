<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="zp-title zp-desc">
  <title id="zp-title">Zweipunktregelung mit Hysterese</title>
  <desc id="zp-desc">Temperaturverlauf über 60 Minuten bei einer Heizung mit Zweipunktregler. Sollwert 21 Grad, Einschaltschwelle 20 Grad, Ausschaltschwelle 22 Grad; der Bereich dazwischen ist die Hysterese. Die Temperatur startet bei 19 Grad, die Heizung schaltet ein, die Temperatur steigt bis 22 Grad, die Heizung schaltet aus, die Temperatur fällt bis 20 Grad, die Heizung schaltet wieder ein. Die Temperatur pendelt so zwischen 20 und 22 Grad. Darunter ein Balken, der zeigt, wann die Heizung eingeschaltet ist. Ohne Hysterese würde der Regler um 21 Grad herum sehr schnell hin und her schalten.</desc>
