<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="nt-title nt-desc">
  <title id="nt-title">Temperaturmessung mit NTC im Spannungsteiler</title>
  <desc id="nt-desc">Schaltung: Von 3,3 Volt führt ein Festwiderstand R1 mit 10 Kiloohm zu einem Mittelpunkt, von dort ein NTC-Thermistor mit 10 Kiloohm bei 25 Grad nach Masse. Der Mittelpunkt ist mit dem Analogeingang A0 des Mikrocontrollers verbunden. Formel: U an A0 gleich 3,3 Volt mal R NTC geteilt durch R1 plus R NTC. Tabelle für einen 10-Bit-Wandler: bei 0 Grad hat der NTC etwa 33,6 Kiloohm, an A0 liegen 2,54 Volt, Rohwert 789; bei 25 Grad 10 Kiloohm, 1,65 Volt, Rohwert 512; bei 50 Grad 3,6 Kiloohm, 0,87 Volt, Rohwert 270. Je wärmer, desto kleiner der Widerstand und die Spannung.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
    .w { stroke: #212529; stroke-width: 2; fill: none; }
    .r { fill: #fff; stroke: #212529; stroke-width: 2; }
    .l { font-size: 12px; } .b { font-weight: 700; }
    .s { font-size: 11px; fill: #343a40; }
    .th { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .td { font-size: 11.5px; text-anchor: middle; }
  </style>
  <text class="l b" x="70" y="30">+3,3 V</text>
  <path class="w" d="M90,38 V62"/>
  <rect class="r" x="78" y="62" width="24" height="60"/>
  <text class="l" x="112" y="88">R1</text><text class="s" x="112" y="104">10 kΩ</text>
  <path class="w" d="M90,122 V160"/>
  <circle cx="90" cy="148" r="4" fill="#212529"/>
  <path class="w" d="M90,148 H200"/>
  <rect x="200" y="134" width="96" height="28" rx="5" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text class="l b" x="248" y="153" text-anchor="middle">A0 (ADC)</text>
  <text class="s" x="118" y="140">U<tspan dy="3" font-size="8">A0</tspan></text>
  <rect class="r" x="78" y="160" width="24" height="60"/>
  <path d="M68,214 L112,166" stroke="#b02a37" stroke-width="1.6"/><path d="M68,214 h-8" stroke="#b02a37" stroke-width="1.6"/>
  <text class="l" x="112" y="186">NTC</text><text class="s" x="112" y="202">10 kΩ bei 25 °C</text>
  <path class="w" d="M90,220 V250"/>
  <path class="w" d="M72,250 H108 M78,256 H102 M84,262 H96"/>
  <text class="s" x="112" y="258">GND</text>

  <rect x="330" y="34" width="370" height="40" rx="6" fill="#f8f9fa" stroke="#ced4da"/>
  <text class="l" x="515" y="59" text-anchor="middle">U<tspan dy="3" font-size="9">A0</tspan><tspan dy="-3"> = 3,3 V · R</tspan><tspan dy="3" font-size="9">NTC</tspan><tspan dy="-3"> / (R1 + R</tspan><tspan dy="3" font-size="9">NTC</tspan><tspan dy="-3">)</tspan></text>
  <rect x="330" y="92" width="370" height="26" fill="#e9ecef"/>
  <text class="th" x="380" y="109">Temperatur</text><text class="th" x="470" y="109">R NTC</text><text class="th" x="560" y="109">U an A0</text><text class="th" x="650" y="109">Rohwert (10 Bit)</text>
  <rect x="330" y="118" width="370" height="28" fill="#fff" stroke="#dee2e6"/>
  <text class="td" x="380" y="136">0 °C</text><text class="td" x="470" y="136">33,6 kΩ</text><text class="td" x="560" y="136">2,54 V</text><text class="td" x="650" y="136">789</text>
  <rect x="330" y="146" width="370" height="28" fill="#fff" stroke="#dee2e6"/>
  <text class="td" x="380" y="164">25 °C</text><text class="td" x="470" y="164">10,0 kΩ</text><text class="td" x="560" y="164">1,65 V</text><text class="td" x="650" y="164">512</text>
  <rect x="330" y="174" width="370" height="28" fill="#fff" stroke="#dee2e6"/>
  <text class="td" x="380" y="192">50 °C</text><text class="td" x="470" y="192">3,6 kΩ</text><text class="td" x="560" y="192">0,87 V</text><text class="td" x="650" y="192">270</text>
  <text class="s" x="330" y="228">NTC (Negative Temperature Coefficient): wärmer → kleinerer</text>
  <text class="s" x="330" y="244">Widerstand → kleinere Spannung an A0.</text>
  <text class="s" x="330" y="266">Rohwert = U / 3,3 V · 1024. Die Kennlinie ist nicht linear – die Software rechnet</text>
  <text class="s" x="330" y="282">mit einer Formel (z. B. B-Parameter) oder einer Tabelle in °C um.</text>
</svg>
