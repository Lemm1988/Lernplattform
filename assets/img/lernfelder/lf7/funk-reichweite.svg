<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="fr-title fr-desc">
  <title id="fr-title">Funkstandards für das IoT: Reichweite und Datenrate</title>
  <desc id="fr-desc">Streudiagramm mit logarithmischen Achsen, x-Achse Reichweite von 1 Meter bis 100 Kilometer, y-Achse Datenrate von 100 Bit pro Sekunde bis 1 Gigabit pro Sekunde. Typische Größenordnungen: WLAN etwa 50 Meter und einige hundert Megabit pro Sekunde, Energiebedarf hoch. Bluetooth Low Energy etwa 30 Meter und 1 Megabit pro Sekunde, Energie niedrig. Zigbee und Thread etwa 80 Meter je Funkstrecke und 250 Kilobit pro Sekunde, als Mesh. LTE-M etwa 10 Kilometer und 1 Megabit pro Sekunde über Mobilfunk. NB-IoT etwa 10 Kilometer und rund 60 Kilobit pro Sekunde. LoRaWAN etwa 5 Kilometer und wenige Kilobit pro Sekunde mit sehr niedrigem Energiebedarf. Grundregel: Je größer die Reichweite bei wenig Energie, desto kleiner die Datenrate. Die Werte schwanken stark mit Umgebung und Konfiguration.</desc>
  <style>text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; } .ax { font-size: 10.5px; fill: #495057; } .g { stroke: #e9ecef; stroke-width: 1; } .n { font-size: 11.5px; font-weight: 700; } .s { font-size: 10.5px; fill: #495057; }</style>
  <line class="g" x1="100.0" y1="40" x2="100.0" y2="250"/><text class="ax" x="100.0" y="266" text-anchor="middle">1 m</text>
  <line class="g" x1="216.0" y1="40" x2="216.0" y2="250"/><text class="ax" x="216.0" y="266" text-anchor="middle">10 m</text>
  <line class="g" x1="332.0" y1="40" x2="332.0" y2="250"/><text class="ax" x="332.0" y="266" text-anchor="middle">100 m</text>
  <line class="g" x1="448.0" y1="40" x2="448.0" y2="250"/><text class="ax" x="448.0" y="266" text-anchor="middle">1 km</text>
  <line class="g" x1="564.0" y1="40" x2="564.0" y2="250"/><text class="ax" x="564.0" y="266" text-anchor="middle">10 km</text>
  <line class="g" x1="680.0" y1="40" x2="680.0" y2="250"/><text class="ax" x="680.0" y="266" text-anchor="middle">100 km</text>
  <line class="g" x1="100" y1="220.0" x2="680" y2="220.0"/><text class="ax" x="92" y="223.5" text-anchor="end">1 kbit/s</text>
  <line class="g" x1="100" y1="130.0" x2="680" y2="130.0"/><text class="ax" x="92" y="133.5" text-anchor="end">1 Mbit/s</text>
  <line class="g" x1="100" y1="40.0" x2="680" y2="40.0"/><text class="ax" x="92" y="43.5" text-anchor="end">1 Gbit/s</text>
  <line class="g" x1="100" y1="250.0" x2="680" y2="250.0"/><text class="ax" x="92" y="253.5" text-anchor="end">100 bit/s</text>
  <line x1="100" y1="250" x2="680" y2="250" stroke="#495057" stroke-width="1.2"/><line x1="100" y1="40" x2="100" y2="250" stroke="#495057" stroke-width="1.2"/>
  <text class="ax" x="390.0" y="284" text-anchor="middle">Reichweite (logarithmisch) · typische Größenordnungen, stark abhängig von Umgebung und Einstellung</text>
  <text class="ax" x="22" y="145.0" text-anchor="middle" transform="rotate(-90 22 145.0)">Datenrate (logarithmisch)</text>
  <circle cx="297.1" cy="55.7" r="6" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <text class="n" x="309.1" y="55.7" text-anchor="start">WLAN</text><text class="s" x="309.1" y="68.7" text-anchor="start">Energie hoch</text>
  <circle cx="271.3" cy="130.0" r="6" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <text class="n" x="259.3" y="130.0" text-anchor="end">Bluetooth LE</text><text class="s" x="259.3" y="143.0" text-anchor="end">Energie niedrig</text>
  <circle cx="320.8" cy="148.1" r="6" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <text class="n" x="332.8" y="158.1" text-anchor="start">Zigbee / Thread</text><text class="s" x="332.8" y="171.1" text-anchor="start">Mesh, Energie niedrig</text>
  <circle cx="564.0" cy="130.0" r="6" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <text class="n" x="552.0" y="130.0" text-anchor="end">LTE-M</text><text class="s" x="552.0" y="143.0" text-anchor="end">Mobilfunk, SIM</text>
  <circle cx="564.0" cy="166.7" r="6" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <text class="n" x="576.0" y="166.7" text-anchor="start">NB-IoT</text><text class="s" x="576.0" y="179.7" text-anchor="start">Mobilfunk, SIM</text>
  <circle cx="529.1" cy="199.0" r="6" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <text class="n" x="517.1" y="199.0" text-anchor="end">LoRaWAN</text><text class="s" x="517.1" y="212.0" text-anchor="end">Energie sehr niedrig</text>
</svg>
