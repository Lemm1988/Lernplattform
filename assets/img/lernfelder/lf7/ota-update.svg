<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="ota-title ota-desc">
  <title id="ota-title">Sicheres Firmware-Update über das Netz mit A/B-Partitionen</title>
  <desc id="ota-desc">Links der Hersteller: Der Build-Server signiert die neue Firmware mit dem privaten Schlüssel, der den Hersteller nie verlässt. Der Update-Server stellt sie per HTTPS bereit. Rechts das Gerät mit zwei Firmware-Partitionen: A ist aktiv und läuft, B ist frei. Ablauf: 1. Firmware in Partition B herunterladen. 2. Signatur mit dem im Gerät gespeicherten öffentlichen Schlüssel prüfen; ist sie ungültig, wird das Update verworfen. 3. Neustart von B. 4. Selbsttest: Läuft B fehlerfrei und erreicht den Server, wird B als gültig markiert. Schlägt der Test fehl, startet das Gerät automatisch wieder von A, das ist der Rollback.</desc>
  <defs><marker id="ota-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
    .h { font-weight: 700; font-size: 12px; text-anchor: middle; }
    .s { font-size: 10.5px; fill: #343a40; text-anchor: middle; }
    .st { font-size: 11px; fill: #212529; }
    .w { stroke: #495057; stroke-width: 1.8; fill: none; marker-end: url(#ota-a); }
    .num { font-weight: 700; font-size: 11px; fill: #fff; text-anchor: middle; }
  </style>
  <rect x="20" y="20" width="170" height="70" rx="8" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.4"/>
  <text class="h" x="105" y="42">Build-Server</text><text class="s" x="105" y="60">signiert Firmware mit</text><text class="s" x="105" y="74">privatem Schlüssel</text>
  <path class="w" d="M105,90 V126"/>
  <rect x="20" y="130" width="170" height="60" rx="8" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1.4"/>
  <text class="h" x="105" y="154">Update-Server</text><text class="s" x="105" y="172">Firmware + Signatur</text>
  <path class="w" d="M190,160 H266"/><text class="s" x="228" y="150" style="font-weight:700">HTTPS</text>
  <rect x="270" y="20" width="430" height="260" rx="12" fill="#f8f9fa" stroke="#495057" stroke-width="1.6"/>
  <text x="284" y="40" style="font-size:12px;font-weight:700">Gerät</text>
  <rect x="290" y="56" width="120" height="44" rx="6" fill="#d1e7dd" stroke="#198754" stroke-width="1.4"/><text class="h" x="350" y="75">Partition A</text><text class="s" x="350" y="91">aktiv, v1.4</text>
  <rect x="290" y="112" width="120" height="44" rx="6" fill="#fff3cd" stroke="#eda100" stroke-width="1.4"/><text class="h" x="350" y="131">Partition B</text><text class="s" x="350" y="147">neu, v1.5</text>
  <rect x="290" y="176" width="120" height="40" rx="6" fill="#fff" stroke="#6c757d" stroke-width="1.2"/><text class="s" x="350" y="193" style="font-weight:700">öffentlicher</text><text class="s" x="350" y="207" style="font-weight:700">Schlüssel</text>
  <circle cx="440" cy="66" r="10" fill="#2a78d6"/><text class="num" x="440" y="70">1</text><text class="st" x="458" y="70">in die freie Partition B laden</text>
  <circle cx="440" cy="100" r="10" fill="#2a78d6"/><text class="num" x="440" y="104">2</text><text class="st" x="458" y="104">Signatur prüfen – ungültig? verwerfen</text>
  <circle cx="440" cy="134" r="10" fill="#2a78d6"/><text class="num" x="440" y="138">3</text><text class="st" x="458" y="138">von B neu starten</text>
  <circle cx="440" cy="168" r="10" fill="#2a78d6"/><text class="num" x="440" y="172">4</text><text class="st" x="458" y="172">Selbsttest: läuft B, erreicht es den Server?</text>
  <rect x="430" y="208" width="120" height="50" rx="6" fill="#d1e7dd" stroke="#198754" stroke-width="1.4"/><text class="h" x="490" y="228">ja</text><text class="s" x="490" y="244">B wird gültig</text>
  <rect x="566" y="208" width="120" height="50" rx="6" fill="#f8d7da" stroke="#b02a37" stroke-width="1.4"/><text class="h" x="626" y="228">nein</text><text class="s" x="626" y="244">Rollback auf A</text>
  <path class="w" d="M520,180 L496,204"/><path class="w" d="M560,180 L600,204"/>
  <text x="20" y="226" style="font-size:11px;fill:#343a40">Der private Schlüssel</text><text x="20" y="241" style="font-size:11px;fill:#343a40">verlässt den Hersteller nie.</text>
  <text x="20" y="262" style="font-size:11px;fill:#343a40">Ein Stromausfall mitten im</text><text x="20" y="277" style="font-size:11px;fill:#343a40">Update lässt A unberührt.</text>
</svg>
