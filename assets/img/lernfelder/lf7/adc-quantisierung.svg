<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="adc-title adc-desc">
  <title id="adc-title">Analog-Digital-Wandlung mit 3 Bit</title>
  <desc id="adc-desc">Ein analoges Spannungssignal zwischen 0 und 3,3 Volt verläuft als glatte Kurve. Ein 3-Bit-Wandler tastet es in festen Zeitabständen 16-mal ab und ordnet jeden Abtastwert einer von 8 Stufen zu, 000 bis 111. Jede Stufe ist 3,3 Volt geteilt durch 8, also rund 0,41 Volt breit. Das digitale Ergebnis ist eine Treppenkurve, die dem Original nur grob folgt; die Differenz ist der Quantisierungsfehler. Mehr Bits ergeben feinere Stufen, eine höhere Abtastrate kürzere Treppenstufen.</desc>
