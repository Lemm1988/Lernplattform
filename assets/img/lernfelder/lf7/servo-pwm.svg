  <text class="lab" x="620" y="250">180°</text>
  <line x1="110" y1="260" x2="470" y2="260" stroke="#495057" stroke-width="1.2"/>
  <text class="ax" x="110.0" y="276" text-anchor="middle">0</text>
  <text class="ax" x="191.8" y="276" text-anchor="middle">5</text>
  <text class="ax" x="273.6" y="276" text-anchor="middle">10</text>
  <text class="ax" x="355.5" y="276" text-anchor="middle">15</text>
  <text class="ax" x="437.3" y="276" text-anchor="middle">20</text>
  <text class="ax" x="290.0" y="292" text-anchor="middle">Zeit in ms – Periode 20 ms (50 Hz)</text>
  <text class="s" x="516" y="292">Hebelstellung (Draufsicht)</text>
</svg>
