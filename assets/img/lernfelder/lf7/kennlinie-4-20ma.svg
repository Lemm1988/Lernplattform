<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="ma-title ma-desc">
  <title id="ma-title">Kennlinie eines Drucksensors mit 4–20-mA-Ausgang</title>
  <desc id="ma-desc">Liniendiagramm: Auf der x-Achse der Druck von 0 bis 10 bar, auf der y-Achse der Strom von 0 bis 24 Milliampere. Die Kennlinie ist eine Gerade von 4 Milliampere bei 0 bar bis 20 Milliampere bei 10 bar. Markiert ist der Punkt 12 Milliampere gleich 5 bar. Ein Strom unter 3,6 Milliampere ist kein gültiger Messwert, sondern zeigt einen Fehler wie Drahtbruch an; ebenso ein Strom über 21 Milliampere.</desc>
  <style>text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; } .ax { font-size: 10.5px; fill: #495057; } .g { stroke: #e9ecef; stroke-width: 1; } .s { font-size: 11px; fill: #343a40; }</style>
  <rect x="90" y="218.5" width="450" height="31.5" fill="#f8d7da"/>
  <rect x="90" y="40.0" width="450" height="26.2" fill="#f8d7da"/>
  <line class="g" x1="90" y1="250.0" x2="540" y2="250.0"/>
  <text class="ax" x="82" y="253.5" text-anchor="end">0 mA</text>
  <line class="g" x1="90" y1="215.0" x2="540" y2="215.0"/>
  <text class="ax" x="82" y="218.5" text-anchor="end">4 mA</text>
  <line class="g" x1="90" y1="180.0" x2="540" y2="180.0"/>
  <text class="ax" x="82" y="183.5" text-anchor="end">8 mA</text>
  <line class="g" x1="90" y1="145.0" x2="540" y2="145.0"/>
  <text class="ax" x="82" y="148.5" text-anchor="end">12 mA</text>
  <line class="g" x1="90" y1="110.0" x2="540" y2="110.0"/>
  <text class="ax" x="82" y="113.5" text-anchor="end">16 mA</text>
  <line class="g" x1="90" y1="75.0" x2="540" y2="75.0"/>
  <text class="ax" x="82" y="78.5" text-anchor="end">20 mA</text>
  <line class="g" x1="90" y1="40.0" x2="540" y2="40.0"/>
  <text class="ax" x="82" y="43.5" text-anchor="end">24 mA</text>
  <text class="ax" x="90.0" y="266" text-anchor="middle">0</text>
  <text class="ax" x="180.0" y="266" text-anchor="middle">2</text>
  <text class="ax" x="270.0" y="266" text-anchor="middle">4</text>
  <text class="ax" x="360.0" y="266" text-anchor="middle">6</text>
  <text class="ax" x="450.0" y="266" text-anchor="middle">8</text>
  <text class="ax" x="540.0" y="266" text-anchor="middle">10</text>
  <text class="ax" x="315.0" y="284" text-anchor="middle">Druck in bar</text>
  <line x1="90" y1="250" x2="540" y2="250" stroke="#495057" stroke-width="1.2"/>
  <line x1="90" y1="34" x2="90" y2="250" stroke="#495057" stroke-width="1.2"/>
  <line x1="315.0" y1="250" x2="315.0" y2="145.0" stroke="#6c757d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="90" y1="145.0" x2="315.0" y2="145.0" stroke="#6c757d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="90.0" y1="215.0" x2="540.0" y2="75.0" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="90.0" cy="215.0" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <circle cx="315.0" cy="145.0" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <circle cx="540.0" cy="75.0" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
  <text class="s" x="142.0" y="214.0">4 mA = 0 bar („live zero“)</text>
  <text class="s" x="325.0" y="161.0">12 mA = 5 bar</text>
  <text class="s" x="552" y="79.0">20 mA = 10 bar</text>
  <text class="s" x="552" y="238.2" style="fill:#b02a37">&lt; 3,6 mA: Fehler,</text>
  <text class="s" x="552" y="252.2" style="fill:#b02a37">z. B. Drahtbruch</text>
  <text class="s" x="552" y="57.1" style="fill:#b02a37">&gt; 21 mA: Fehler</text>
  <text class="s" x="552" y="139.0" style="font-weight:700">Umrechnung</text>
  <text class="s" x="552" y="155.0">p = (I − 4 mA) · 10 bar / 16 mA</text>
</svg>
