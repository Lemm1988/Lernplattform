<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" role="img" aria-labelledby="sq-title sq-desc">
  <title id="sq-title">Stack und Queue</title>
  <desc id="sq-desc">Links ein Stack als oben offener Behälter mit den Elementen tippe A unten, tippe B in der Mitte und fett oben. push legt oben ein Element ab, pop nimmt das oberste wieder herunter: last in, first out. Beispiele: Rückgängig-Funktion, Aufrufstapel, Klammerprüfung. Rechts eine Queue als Röhre: Neue Elemente werden mit offer hinten links angestellt, poll entnimmt vorne rechts das älteste Element Rechnung.pdf: first in, first out. Beispiele: Druckaufträge, Tickets, Nachrichten.</desc>
  <defs>
    <marker id="sq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d6efd"/></marker>
    <marker id="sq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198754"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .h { font-weight: 700; font-size: 14px; }
      .wall { stroke: #343a40; stroke-width: 2; fill: none; }
      .it { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.3; }
      .top { fill: #cfe2ff; stroke: #0d6efd; stroke-width: 2; }
      .t { font-size: 12px; }
      .c { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      .s { font-size: 11.5px; fill: #495057; }
      .in { stroke: #0d6efd; stroke-width: 2; fill: none; }
      .out { stroke: #198754; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <!-- Stack -->
  <text class="h" x="180" y="18">Stack (Stapel) – LIFO</text>
  <path class="wall" d="M110,44 V196 H250 V44"/>
  <rect class="it" x="116" y="160" width="128" height="32" rx="4"/><text class="t" x="180" y="181">tippe A</text>
  <rect class="it" x="116" y="126" width="128" height="32" rx="4"/><text class="t" x="180" y="147">tippe B</text>
  <rect class="top" x="116" y="92" width="128" height="32" rx="4"/><text class="t" x="180" y="113">fett</text>
  <path class="in" d="M150,30 V84" marker-end="url(#sq-a)"/><text class="c" x="142" y="40" style="text-anchor:end;fill:#0d6efd">push(x)</text>
  <path class="out" d="M210,84 V30" marker-end="url(#sq-b)"/><text class="c" x="218" y="40" style="text-anchor:start;fill:#198754">pop()</text>
  <text class="t" x="180" y="218">Zuletzt hineingelegt = zuerst heraus</text>
  <text class="s" x="180" y="236">Rückgängig-Funktion, Aufrufstapel, Klammerprüfung</text>

  <!-- Queue -->
  <text class="h" x="535" y="18">Queue (Warteschlange) – FIFO</text>
  <path class="wall" d="M408,100 H662 M408,160 H662"/>
  <rect class="it" x="414" y="112" width="78" height="36" rx="4"/><text class="t" x="453" y="135">Foto.png</text>
  <rect class="it" x="496" y="112" width="78" height="36" rx="4"/><text class="t" x="535" y="135">Brief.docx</text>
  <rect class="top" x="578" y="112" width="80" height="36" rx="4"/><text class="t" x="618" y="135">Rechnung.pdf</text>
  <path class="in" d="M364,130 H404" marker-end="url(#sq-a)"/><text class="c" x="384" y="118" style="fill:#0d6efd">offer(x)</text>
  <text class="s" x="384" y="152">hinten</text>
  <path class="out" d="M666,130 H708" marker-end="url(#sq-b)"/><text class="c" x="688" y="118" style="fill:#198754">poll()</text>
  <text class="s" x="688" y="152">vorne</text>
  <text class="t" x="535" y="218">Zuerst angestellt = zuerst bedient</text>
  <text class="s" x="535" y="236">Druckaufträge, Tickets, Nachrichten</text>
</svg>
