<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="od-title od-desc">
  <title id="od-title">Objektdiagramm: Momentaufnahme im Webshop</title>
  <desc id="od-desc">Das Objekt kaya der Klasse Kunde mit name gleich Kaya und ort gleich Bonn ist mit zwei Bestellungen verbunden: b1001 mit status BEZAHLT und betragCent 3980 sowie b1002 mit status NEU und betragCent 990. b1001 enthält die Position p1 mit menge 2, die auf den Artikel maus mit preisCent 1990 verweist. b1002 enthält die Position p2 mit menge 1, die auf den Artikel kabel mit preisCent 990 verweist.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; }
      .o { fill: #fff; stroke: #343a40; stroke-width: 1.3; }
      .hd { fill: #e7f1ff; stroke: #343a40; stroke-width: 1.3; }
      .on { font-size: 12px; font-weight: 600; text-decoration: underline; text-anchor: middle; }
      .a { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
      .lk { stroke: #343a40; stroke-width: 1.4; }
    </style>
  </defs>
  <!-- Verbindungen (Links) -->
  <line class="lk" x1="150" y1="95" x2="190" y2="55"/>
  <line class="lk" x1="150" y1="115" x2="190" y2="150"/>
  <line class="lk" x1="340" y1="50" x2="380" y2="50"/>
  <line class="lk" x1="340" y1="150" x2="380" y2="150"/>
  <line class="lk" x1="500" y1="50" x2="540" y2="50"/>
  <line class="lk" x1="500" y1="150" x2="540" y2="150"/>

  <!-- Objekte -->
  <rect class="hd" x="10" y="72" width="140" height="22"/><text class="on" x="80" y="87">kaya : Kunde</text>
  <rect class="o" x="10" y="94" width="140" height="42"/><text class="a" x="18" y="111">name = "Kaya"</text><text class="a" x="18" y="127">ort = "Bonn"</text>

  <rect class="hd" x="190" y="20" width="150" height="22"/><text class="on" x="265" y="35">b1001 : Bestellung</text>
  <rect class="o" x="190" y="42" width="150" height="42"/><text class="a" x="198" y="59">status = BEZAHLT</text><text class="a" x="198" y="75">betragCent = 3980</text>

  <rect class="hd" x="190" y="118" width="150" height="22"/><text class="on" x="265" y="133">b1002 : Bestellung</text>
  <rect class="o" x="190" y="140" width="150" height="42"/><text class="a" x="198" y="157">status = NEU</text><text class="a" x="198" y="173">betragCent = 990</text>

  <rect class="hd" x="380" y="28" width="120" height="22"/><text class="on" x="440" y="43">p1 : Position</text>
  <rect class="o" x="380" y="50" width="120" height="26"/><text class="a" x="388" y="67">menge = 2</text>

  <rect class="hd" x="380" y="126" width="120" height="22"/><text class="on" x="440" y="141">p2 : Position</text>
  <rect class="o" x="380" y="148" width="120" height="26"/><text class="a" x="388" y="165">menge = 1</text>

  <rect class="hd" x="540" y="20" width="170" height="22"/><text class="on" x="625" y="35">maus : Artikel</text>
  <rect class="o" x="540" y="42" width="170" height="42"/><text class="a" x="548" y="59">bezeichnung = "Maus"</text><text class="a" x="548" y="75">preisCent = 1990</text>

  <rect class="hd" x="540" y="118" width="170" height="22"/><text class="on" x="625" y="133">kabel : Artikel</text>
  <rect class="o" x="540" y="140" width="170" height="42"/><text class="a" x="548" y="157">bezeichnung = "Kabel"</text><text class="a" x="548" y="173">preisCent = 990</text>
</svg>
