<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="on-title on-desc">
  <title id="on-title">Wachstum der Laufzeitklassen</title>
  <desc id="on-desc">Liniendiagramm der Schrittzahl für n von 1 bis 20. O(1) bleibt konstant bei 1, O(log n) steigt nur auf gut 4, O(n) wächst gleichmäßig auf 20, O(n log n) verlässt den Bereich bis 60 bei etwa n gleich 15, O(n²) schon bei etwa n gleich 8. Rechts die Schrittzahlen für n gleich 1000: O(1) 1, O(log n) etwa 10, O(n) 1000, O(n log n) etwa 10000, O(n²) eine Million. Bei einer Million Elementen und einer Mikrosekunde pro Schritt braucht n log n etwa 20 Sekunden, n² etwa 11,6 Tage.</desc>
