      .tick { font-size: 11px; fill: #6c757d; }
      .ax { font-size: 11.5px; fill: #495057; }
      .lbl { font-size: 12px; font-weight: 600; fill: #212529; }
      .series { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .h { font-weight: 700; font-size: 12.5px; }
      .r { font-size: 12px; fill: #343a40; }
      .rv { font-size: 12px; fill: #212529; font-weight: 600; text-anchor: end; }
      .n { font-size: 11px; fill: #495057; font-style: italic; }
    </style>
  </defs>
