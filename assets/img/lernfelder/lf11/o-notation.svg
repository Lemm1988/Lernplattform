  <text class="rv" x="712" y="68">1</text>
  <line x1="530" y1="90" x2="548" y2="90" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
  <text class="r" x="556" y="94">O(log n) logarithmisch</text>
  <text class="rv" x="712" y="94">≈ 10</text>
  <line x1="530" y1="116" x2="548" y2="116" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/>
  <text class="r" x="556" y="120">O(n) linear</text>
  <text class="rv" x="712" y="120">1.000</text>
  <line x1="530" y1="142" x2="548" y2="142" stroke="#eda100" stroke-width="2" stroke-linecap="round"/>
  <text class="r" x="556" y="146">O(n log n) </text>
  <text class="rv" x="712" y="146">≈ 10.000</text>
  <line x1="530" y1="168" x2="548" y2="168" stroke="#e87ba4" stroke-width="2" stroke-linecap="round"/>
  <text class="r" x="556" y="172">O(n²) quadratisch</text>
  <text class="rv" x="712" y="172">1.000.000</text>
  <line x1="530" y1="196" x2="712" y2="196" stroke="#dee2e6"/>
  <text class="n" x="530" y="216">Bei 1 Mio. Elementen und 1 µs</text>
  <text class="n" x="530" y="232">pro Schritt: n log n ≈ 20 Sekunden,</text>
  <text class="n" x="530" y="248">n² ≈ 11,6 Tage.</text>
