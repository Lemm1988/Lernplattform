  <text class="lbl" x="456.0" y="254.3">O(1)</text>
  <text class="lbl" x="456.0" y="233.2">O(log n)</text>
  <text class="lbl" x="456.0" y="180.7">O(n)</text>
  <text class="lbl" x="365.9" y="42">O(n log n)</text>
  <text class="lbl" x="223.2" y="42">O(n²)</text>
  <text class="h" x="530" y="40">Schritte bei n = 1.000</text>
  <line x1="530" y1="64" x2="548" y2="64" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
