<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="di-title di-desc">
  <title id="di-title">Dependency Inversion</title>
  <desc id="di-desc">Vorher: Die Klasse BestellService hängt direkt von der konkreten Klasse MySqlDatenbank ab; testen geht nur mit echter Datenbank. Nachher: BestellService nutzt nur das Interface BestellRepository. Die Klassen MySqlRepository und SpeicherRepository für Tests implementieren dieses Interface. Beide Seiten hängen von der Abstraktion ab, die Implementierung lässt sich austauschen und wird über den Konstruktor hineingegeben.</desc>
  <defs>
    <marker id="di-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#343a40" stroke-width="1.5"/></marker>
    <marker id="di-t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#343a40" stroke-width="1.3"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .h { font-weight: 700; font-size: 13px; }
      .c { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .bad { fill: #f8d7da; stroke: #b02a37; stroke-width: 1.4; }
      .i { fill: #fff8e1; stroke: #f0ad4e; stroke-width: 1.4; }
      .n { font-size: 12.5px; font-weight: 600; }
      .st { font-size: 11px; fill: #6c757d; }
      .dep { stroke: #343a40; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; }
      .use { stroke: #343a40; stroke-width: 1.4; fill: none; }
      .s { font-size: 11.5px; fill: #495057; }
    </style>
  </defs>
  <text class="h" x="110" y="18">vorher</text>
  <rect class="c" x="30" y="34" width="160" height="40" rx="4"/><text class="n" x="110" y="58">BestellService</text>
  <path class="dep" d="M110,74 V128" marker-end="url(#di-a)"/>
  <rect class="bad" x="30" y="130" width="160" height="40" rx="4"/><text class="n" x="110" y="154">MySqlDatenbank</text>
  <text class="s" x="110" y="190">fest verdrahtet: testen nur</text><text class="s" x="110" y="205">mit echter Datenbank</text>

  <line x1="225" y1="10" x2="225" y2="205" stroke="#dee2e6"/>

  <text class="h" x="470" y="18">nachher</text>
  <rect class="c" x="250" y="40" width="150" height="40" rx="4"/><text class="n" x="325" y="64">BestellService</text>
  <path class="use" d="M400,60 H460" marker-end="url(#di-a)"/><text class="st" x="430" y="53">nutzt</text>
  <rect class="i" x="462" y="34" width="190" height="52" rx="4"/><text class="st" x="557" y="52">«interface»</text><text class="n" x="557" y="72">BestellRepository</text>
  <rect class="c" x="410" y="132" width="146" height="40" rx="4"/><text class="n" x="483" y="156">MySqlRepository</text>
  <rect class="c" x="570" y="132" width="146" height="40" rx="4"/><text class="n" x="643" y="150">SpeicherRepository</text><text class="st" x="643" y="165">für Tests</text>
  <path class="dep" d="M483,132 L540,87" marker-end="url(#di-t)"/>
  <path class="dep" d="M643,132 L576,87" marker-end="url(#di-t)"/>
  <text class="s" x="470" y="196">Service und Implementierungen hängen nur von der Abstraktion ab.</text>
</svg>
