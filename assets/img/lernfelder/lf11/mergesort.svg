<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="ms-title ms-desc">
  <title id="ms-title">Merge Sort: teilen und mischen</title>
  <desc id="ms-desc">Merge Sort sortiert 38, 27, 43, 3, 9, 82, 10. Oben wird die Liste immer weiter halbiert: 38 27 43 und 3 9 82 10, dann 38, 27 43, 3 9 und 82 10, bis nur noch Einzelelemente übrig sind. Unten werden jeweils zwei sortierte Teillisten zusammengemischt: 27 43, 3 9 und 10 82; dann 27 38 43 und 3 9 10 82; zuletzt 3 9 10 27 38 43 82. Beim Mischen nimmt man immer das kleinere der beiden vorderen Elemente.</desc>
