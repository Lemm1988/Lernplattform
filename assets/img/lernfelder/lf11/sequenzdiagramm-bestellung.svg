<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">Sequenzdiagramm: Bestellung im Webshop</title>
  <desc id="sd-desc">Beteiligte von links nach rechts: Akteur Kunde, Webshop, Lager, Zahlungsdienst, das später erzeugte Objekt b vom Typ Bestellung und Maildienst. Der Kunde ruft bestellen auf. Der Webshop fragt synchron pruefeBestand beim Lager an und erhält verfügbar zurück. Es folgt ein alt-Fragment. Im Fall verfügbar ruft der Webshop sich selbst mit berechneBetrag auf, ruft synchron abbuchen beim Zahlungsdienst auf und erhält ok, erzeugt mit create das Objekt b Bestellung, schickt asynchron sendeBestaetigung an den Maildienst und antwortet dem Kunden mit bestätigt. Im Fall sonst antwortet er mit nicht lieferbar.</desc>
  <defs>
    <marker id="sd-f" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
    <marker id="sd-o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#212529" stroke-width="1.5"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .obj { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.4; }
      .on { font-size: 12px; text-decoration: underline; }
      .life { stroke: #6c757d; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .act { fill: #fff; stroke: #343a40; stroke-width: 1.3; }
      .msg { stroke: #212529; stroke-width: 1.4; fill: none; }
      .ret { stroke: #212529; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; }
      .m { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .frame { fill: none; stroke: #6f42c1; stroke-width: 1.4; }
      .fl { font-size: 12px; font-weight: 700; fill: #6f42c1; }
      .g { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; fill: #6f42c1; text-anchor: start; }
    </style>
  </defs>

  <!-- Kopfzeile -->
  <circle cx="40" cy="14" r="6" fill="none" stroke="#212529" stroke-width="1.4"/>
  <path d="M40,20 V36 M30,26 H50 M40,36 L32,48 M40,36 L48,48" stroke="#212529" stroke-width="1.4" fill="none"/>
  <text class="on" x="40" y="62" style="text-decoration:none">Kunde</text>
  <rect class="obj" x="150" y="26" width="100" height="30" rx="3"/><text class="on" x="200" y="46">:Webshop</text>
  <rect class="obj" x="305" y="26" width="80" height="30" rx="3"/><text class="on" x="345" y="46">:Lager</text>
  <rect class="obj" x="410" y="26" width="104" height="30" rx="3"/><text class="on" x="462" y="46">:Zahlungsdienst</text>
  <rect class="obj" x="626" y="26" width="90" height="30" rx="3"/><text class="on" x="671" y="46">:Maildienst</text>

  <!-- Lebenslinien -->
  <line class="life" x1="40" y1="68" x2="40" y2="430"/>
  <line class="life" x1="200" y1="56" x2="200" y2="430"/>
  <line class="life" x1="345" y1="56" x2="345" y2="430"/>
  <line class="life" x1="462" y1="56" x2="462" y2="430"/>
  <line class="life" x1="575" y1="296" x2="575" y2="430"/>
  <line class="life" x1="671" y1="56" x2="671" y2="430"/>

  <!-- alt-Fragment -->
  <rect class="frame" x="18" y="160" width="698" height="254"/>
  <path d="M18,160 H58 V172 L50,180 H18" fill="#f3eefc" stroke="#6f42c1" stroke-width="1.4"/>
  <text class="fl" x="36" y="175">alt</text>
  <text class="g" x="64" y="176">[verfügbar]</text>
  <line x1="18" y1="368" x2="716" y2="368" stroke="#6f42c1" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="g" x="48" y="382">[sonst]</text>

  <!-- Aktivierungsbalken -->
  <rect class="act" x="195" y="88" width="10" height="318"/>
  <rect class="act" x="340" y="118" width="10" height="26"/>
  <rect class="act" x="200" y="200" width="10" height="16"/>
  <rect class="act" x="457" y="230" width="10" height="26"/>
  <rect class="act" x="666" y="318" width="10" height="20"/>

  <!-- Nachrichten -->
  <path class="msg" d="M40,90 H194" marker-end="url(#sd-f)"/><text class="m" x="117" y="84">bestellen(…)</text>
  <path class="msg" d="M205,120 H339" marker-end="url(#sd-f)"/><text class="m" x="272" y="114">pruefeBestand(…)</text>
  <path class="ret" d="M340,144 H206" marker-end="url(#sd-o)"/><text class="m" x="272" y="138">verfügbar</text>

  <path class="msg" d="M205,194 H232 V208 H211" marker-end="url(#sd-f)"/><text class="m" x="238" y="205" style="text-anchor:start">berechneBetrag()</text>
  <path class="msg" d="M205,232 H456" marker-end="url(#sd-f)"/><rect x="274" y="215" width="112" height="15" fill="#fff"/><text class="m" x="330" y="226">abbuchen(betrag)</text>
  <path class="ret" d="M457,256 H206" marker-end="url(#sd-o)"/><text class="m" x="330" y="250">ok</text>

  <path class="ret" d="M205,284 H529" marker-end="url(#sd-o)"/><text class="m" x="400" y="278">«create»</text>
  <rect class="obj" x="530" y="272" width="90" height="24" rx="3"/><text class="on" x="575" y="289">b:Bestellung</text>

  <path class="msg" d="M205,320 H665" marker-end="url(#sd-o)"/><rect x="434" y="303" width="172" height="15" fill="#fff"/><text class="m" x="520" y="314">sendeBestaetigung(email)</text>
  <path class="ret" d="M195,350 H41" marker-end="url(#sd-o)"/><text class="m" x="117" y="344">„bestätigt“</text>
  <path class="ret" d="M195,402 H41" marker-end="url(#sd-o)"/><text class="m" x="117" y="397">„nicht lieferbar“</text>
</svg>
