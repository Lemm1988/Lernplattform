<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="kk-title kk-desc">
  <title id="kk-title">Kopplung und Kohäsion</title>
  <desc id="kk-desc">Links drei Module A, B und C, in denen Funktionen für Kunden, Rechnungen und Lager bunt gemischt sind; viele Linien verbinden Funktionen kreuz und quer über Modulgrenzen hinweg: enge Kopplung, geringe Kohäsion. Rechts drei Module Kunden, Rechnung und Lager, die jeweils nur gleichartige Funktionen enthalten und nur über je eine Schnittstelle miteinander verbunden sind: lose Kopplung, hohe Kohäsion. Änderungen bleiben so innerhalb eines Moduls.</desc>
  <defs>
    <marker id="kk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .h { font-weight: 700; font-size: 13px; }
      .mod { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1.4; }
      .ml { font-size: 12px; font-weight: 600; fill: #495057; }
      .k { fill: #0d6efd; } .r { fill: #198754; } .l { fill: #fd7e14; }
      .x { stroke: #b02a37; stroke-width: 1.3; opacity: 0.7; }
      .s { font-size: 11.5px; fill: #495057; }
    </style>
  </defs>
  <!-- schlecht -->
  <text class="h" x="180" y="18" style="fill:#b02a37">enge Kopplung, geringe Kohäsion</text>
  <rect class="mod" x="30" y="34" width="130" height="80" rx="8"/>
  <rect class="mod" x="210" y="34" width="130" height="80" rx="8"/>
  <rect class="mod" x="120" y="140" width="130" height="80" rx="8"/>
  <line class="x" x1="60" y1="85" x2="275" y2="85"/>
  <line class="x" x1="95" y1="85" x2="150" y2="191"/>
  <line class="x" x1="130" y1="85" x2="240" y2="85"/>
  <line class="x" x1="310" y1="85" x2="220" y2="191"/>
  <line class="x" x1="95" y1="85" x2="310" y2="85"/>
  <line class="x" x1="185" y1="191" x2="240" y2="85"/>
  <line class="x" x1="60" y1="85" x2="185" y2="191"/>
  <text class="ml" x="95" y="52">Modul A</text>
  <text class="ml" x="275" y="52">Modul B</text>
  <rect x="154" y="146" width="62" height="16" fill="#f8f9fa"/><text class="ml" x="185" y="158">Modul C</text>
  <circle class="k" cx="60" cy="85" r="10"/><circle class="l" cx="95" cy="85" r="10"/><circle class="r" cx="130" cy="85" r="10"/>
  <circle class="r" cx="240" cy="85" r="10"/><circle class="k" cx="275" cy="85" r="10"/><circle class="l" cx="310" cy="85" r="10"/>
  <circle class="l" cx="150" cy="191" r="10"/><circle class="r" cx="185" cy="191" r="10"/><circle class="k" cx="220" cy="191" r="10"/>
  <text class="s" x="180" y="244">Eine Änderung zieht Änderungen überall nach sich.</text>

  <line x1="360" y1="10" x2="360" y2="240" stroke="#dee2e6"/>

  <!-- gut -->
  <text class="h" x="540" y="18" style="fill:#198754">lose Kopplung, hohe Kohäsion</text>
  <rect class="mod" x="390" y="34" width="130" height="80" rx="8"/><text class="ml" x="455" y="52">Kunden</text>
  <rect class="mod" x="570" y="34" width="130" height="80" rx="8"/><text class="ml" x="635" y="52">Rechnung</text>
  <rect class="mod" x="480" y="140" width="130" height="80" rx="8"/><text class="ml" x="545" y="158">Lager</text>
  <circle class="k" cx="420" cy="85" r="10"/><circle class="k" cx="455" cy="85" r="10"/><circle class="k" cx="490" cy="85" r="10"/>
  <circle class="r" cx="600" cy="85" r="10"/><circle class="r" cx="635" cy="85" r="10"/><circle class="r" cx="670" cy="85" r="10"/>
  <circle class="l" cx="510" cy="191" r="10"/><circle class="l" cx="545" cy="191" r="10"/><circle class="l" cx="580" cy="191" r="10"/>
  <path d="M520,74 H568" stroke="#343a40" stroke-width="1.6" fill="none" marker-end="url(#kk-a)"/>
  <path d="M635,114 V178 H612" stroke="#343a40" stroke-width="1.6" fill="none" marker-end="url(#kk-a)"/>
  <text class="s" x="540" y="244">Jedes Modul hat eine Aufgabe und eine klare Schnittstelle.</text>

</svg>
