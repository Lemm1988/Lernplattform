<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" role="img" aria-labelledby="bin-title bin-desc">
  <title id="bin-title">Binäre Suche nach 41</title>
  <desc id="bin-desc">Sortiertes Array mit 15 Zahlen von 3 bis 70, Indizes 0 bis 14. Schritt 1: Bereich 0 bis 14, mitte 7 mit dem Wert 34; 34 ist kleiner als 41, also wird rechts weitergesucht. Schritt 2: Bereich 8 bis 14, mitte 11 mit 52; 52 ist größer, also links weiter. Schritt 3: Bereich 8 bis 10, mitte 9 mit 41 – gefunden nach drei Vergleichen. Die lineare Suche hätte zehn Vergleiche gebraucht.</desc>
