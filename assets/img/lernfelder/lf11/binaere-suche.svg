  <rect class="out" x="620" y="164" width="40" height="32"/><text class="vo" x="640" y="185">63</text>
  <rect class="out" x="660" y="164" width="40" height="32"/><text class="vo" x="680" y="185">70</text>
  <text class="d" x="100" y="213">mitte = 9: 41 gefunden – nach 3 Vergleichen</text>
  <text class="d" x="10" y="240" style="font-style:italic">Bei jedem Schritt halbiert sich der Bereich. Die lineare Suche hätte 10 Vergleiche gebraucht.</text>
