  <text class="lab" x="10" y="53">1. Schritt</text>
  <rect class="in" x="100" y="32" width="40" height="32"/><text class="v" x="120" y="53">3</text>
  <rect class="in" x="140" y="32" width="40" height="32"/><text class="v" x="160" y="53">8</text>
