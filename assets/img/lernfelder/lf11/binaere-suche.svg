      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #212529; text-anchor: middle; }
      .in { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.1; }
      .out { fill: #f1f3f5; stroke: #dee2e6; stroke-width: 1.1; }
      .mid { fill: #fff3e0; stroke: #fd7e14; stroke-width: 2.2; }
      .hit { fill: #d1e7dd; stroke: #198754; stroke-width: 2.4; }
      .v { font-size: 13px; font-weight: 600; }
      .vo { font-size: 13px; fill: #adb5bd; }
      .i { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; fill: #6c757d; }
      .lab { font-weight: 700; font-size: 12.5px; text-anchor: start; }
      .d { font-size: 12px; text-anchor: start; fill: #343a40; }
    </style>
  </defs>
